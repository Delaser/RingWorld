pluginManagement {
	repositories {
		maven { url = 'https://maven.fabricmc.net/' }
		gradlePluginPortal()
	}
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'ringworld'

def ringBackportCompilerScope = providers.gradleProperty('ringBackportCompilerScope')
        .orElse('all').get()
if (!(ringBackportCompilerScope in ['all', 'fabric'])) {
    throw new GradleException('ringBackportCompilerScope must be all or fabric')
}
if (ringBackportCompilerScope == 'all') {
    include 'neoforge'
}
