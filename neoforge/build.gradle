tasks.register('verifyNeoForgeProductionVisualParityClient') {
    group = 'ringworld verification'
    description = 'Fails unless the NeoForge seam and both finite-width rim captures completed.'
    mustRunAfter('runProductionVisualParityClient')
    doLast {
        def logFile = new File(neoForgeVisualParityRun, 'logs/latest.log')
        def log = logFile.isFile() ? logFile.text : ''
        if (!log.contains('[visual-parity-capture] result=true, captures complete')) {
            throw new GradleException("NeoForge visual-parity capture did not pass; inspect ${logFile}")
        }
        def seamMetrics = log.readLines().findAll {
            it.contains('[visual-parity-capture] seam motion frame metrics:')
        }
        if (seamMetrics.isEmpty()) {
            throw new GradleException("NeoForge visual-parity capture is missing seam-motion frame metrics; inspect ${logFile}")
        }
        def sampleMatcher = (seamMetrics.last() =~ /samples=(\d+)/)
        if (!sampleMatcher.find() || sampleMatcher.group(1).toInteger() <= 0) {
            throw new GradleException("NeoForge visual-parity capture recorded no seam-motion frame samples; inspect ${logFile}")
        }
        ['seam', 'seam-join', 'min-rim', 'max-rim'].each { view ->
            def screenshot = new File(neoForgeVisualParityRun,
                    "screenshots/ringworld-visual-parity-${view}.png")
            if (!screenshot.isFile()) {
                throw new GradleException("NeoForge visual-parity capture is missing ${screenshot}")
            }
        }
    }
}

tasks.register('prepareNeoForgeCurvedObjectCapture') {
    group = 'ringworld verification'
    description = 'Creates a clean safe-small NeoForge world for curved rigid-object captures.'
    outputs.dir(new File(neoForgeCurvedObjectRun, 'config'))
    outputs.upToDateWhen { false }
    doLast {
        ['saves', 'screenshots', 'ringworld-cache', 'logs'].each {
            delete(new File(neoForgeCurvedObjectRun, it))
        }
        def configDirectory = new File(neoForgeCurvedObjectRun, 'config')
        configDirectory.mkdirs()
        new File(configDirectory, 'ringworld.properties').text = '''\
widthBlocks=416
circumferenceBlocks=2048
wallHeightBlocks=160
testMode=false
testViewDistanceChunks=12
pregenerateTerrainAtlas=false
'''
    }
}

tasks.register('verifyNeoForgeCurvedObjectCaptureClient') {
    group = 'ringworld verification'
    description = 'Fails unless both NeoForge curved rigid-object captures completed.'
    mustRunAfter('runCurvedObjectCaptureClient')
    doLast {
        def logFile = new File(neoForgeCurvedObjectRun, 'logs/latest.log')
        def log = logFile.isFile() ? logFile.text : ''
        if (!log.contains('[curved-object-capture] result=PASS, captures complete')
                || log.contains('[curved-object-capture] result=FAIL')) {
            throw new GradleException("NeoForge curved-object capture did not pass; inspect ${logFile}")
        }
        ['far', 'near'].each { distance ->
            def screenshot = new File(neoForgeCurvedObjectRun,
                    "screenshots/ringworld-curved-objects-${distance}.png")
            if (!screenshot.isFile()) {
                throw new GradleException("NeoForge curved-object capture is missing ${screenshot}")
            }
        }
    }
}

tasks.register('prepareCopiedNeoForgeLayoutSwitchWorlds') {
    group = 'ringworld verification'
    description = 'Copies two distinct NeoForge source saves into the isolated layout-switch run directory.'
    inputs.property('ringNeoForgeLayoutSwitchFirstSource',
            providers.gradleProperty('ringNeoForgeLayoutSwitchFirstSource').orElse(''))
    inputs.property('ringNeoForgeLayoutSwitchSecondSource',
            providers.gradleProperty('ringNeoForgeLayoutSwitchSecondSource').orElse(''))
    inputs.property('ringNeoForgeLayoutSwitchFirstDestination',
            providers.gradleProperty('ringNeoForgeLayoutSwitchFirstDestination')
                    .orElse('RingWorld NeoForge Layout A'))
    inputs.property('ringNeoForgeLayoutSwitchSecondDestination',
            providers.gradleProperty('ringNeoForgeLayoutSwitchSecondDestination')
                    .orElse('RingWorld NeoForge Layout B'))
    inputs.property('ringNeoForgeLayoutSwitchExpectation',
            providers.gradleProperty('ringNeoForgeLayoutSwitchExpectation')
                    .orElse('different-layout'))
    outputs.dir(neoForgeLayoutSwitchSaves)
    outputs.upToDateWhen { false }
    doLast {
        def copies = [
                [providers.gradleProperty('ringNeoForgeLayoutSwitchFirstSource').orElse('').get(),
                 providers.gradleProperty('ringNeoForgeLayoutSwitchFirstDestination')
                         .orElse('RingWorld NeoForge Layout A').get(),
                 'ringNeoForgeLayoutSwitchFirstSource', 'ringNeoForgeLayoutSwitchFirstDestination'],
                [providers.gradleProperty('ringNeoForgeLayoutSwitchSecondSource').orElse('').get(),
                 providers.gradleProperty('ringNeoForgeLayoutSwitchSecondDestination')
                         .orElse('RingWorld NeoForge Layout B').get(),
                 'ringNeoForgeLayoutSwitchSecondSource', 'ringNeoForgeLayoutSwitchSecondDestination']
        ]
        def destinations = [] as Set
        delete(new File(neoForgeLayoutSwitchRun, 'screenshots'))
        delete(new File(neoForgeLayoutSwitchRun, 'ringworld-cache'))
        delete(new File(neoForgeLayoutSwitchRun, 'logs'))
        copies.each { copySpec ->
            def sourceId = checkedProjectionSaveId(copySpec[0], copySpec[2])
            def destinationId = checkedProjectionSaveId(copySpec[1], copySpec[3])
            if (!destinations.add(destinationId)) {
                throw new GradleException('NeoForge layout-switch destinations must be distinct')
            }
            def source = new File(neoForgeProjectionSourceSaves, sourceId)
            if (!new File(source, 'level.dat').isFile()) {
                throw new GradleException("${copySpec[2]} must name a save under ${neoForgeProjectionSourceSaves}: ${sourceId}")
            }
            def destination = new File(neoForgeLayoutSwitchSaves, destinationId)
            delete(destination)
            copy {
                from(source)
                into(destination)
            }
            if (!new File(destination, 'level.dat').isFile()) {
                throw new GradleException("copied NeoForge layout-switch save is missing level.dat: ${destination}")
            }
            logger.lifecycle('[neoforge-layout-switch] copied source={} destination={}', source, destination)
        }
    }
}

tasks.register('verifyNeoForgeLayoutSwitchClient') {
    group = 'ringworld verification'
    description = 'Fails unless the NeoForge same-process layout switch clears and restores client state.'
    mustRunAfter('runLayoutSwitchClient')
    doLast {
        def logFile = new File(neoForgeLayoutSwitchRun, 'logs/latest.log')
        def log = logFile.isFile() ? logFile.text : ''
        if (!log.contains('[layout-switch] result-json={"passed":true,')
                || log.contains('[layout-switch] result-json={"passed":false,')) {
            throw new GradleException("NeoForge layout-switch client did not pass; inspect ${logFile}")
        }
        def expectation = providers.gradleProperty('ringNeoForgeLayoutSwitchExpectation')
                .orElse('different-layout').get()
        if (!log.contains("[layout-switch] expectation=${expectation}")) {
            throw new GradleException(
                    "NeoForge layout-switch client did not run expected mode '${expectation}'; inspect ${logFile}")
        }
        [
                providers.gradleProperty('ringNeoForgeLayoutSwitchFirstDestination')
                        .orElse('RingWorld NeoForge Layout A').get(),
                providers.gradleProperty('ringNeoForgeLayoutSwitchSecondDestination')
                        .orElse('RingWorld NeoForge Layout B').get()
        ].each { destinationId ->
            def destination = new File(neoForgeLayoutSwitchSaves,
                    checkedProjectionSaveId(destinationId, 'ringNeoForgeLayoutSwitchDestination'))
            if (!new File(destination, 'level.dat').isFile()) {
                throw new GradleException("NeoForge layout-switch output is missing level.dat: ${destination}")
            }
        }
    }
}

