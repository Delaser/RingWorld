plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version "${moddevgradle_version}"
}

tasks.named('check') {
	dependsOn(rootProject.tasks.named('verifyOutboundPositionPacketInventory'))
}

version = rootProject.mod_version
group = rootProject.maven_group

base {
    archivesName = rootProject.archives_base_name + '-neoforge'
}

def qualificationEnabled = rootProject.ext.ringQualificationEnabled
def qualificationRunDirectory = rootProject.ext.ringQualificationRunDirectory
def qualificationRunFile = { String historicPath -> project.file(qualificationRunDirectory(historicPath)) }
def qualificationMinecraftRange = rootProject.ext.ringQualificationMinecraftRange
def qualificationNeoForgeRange = rootProject.ext.ringQualificationNeoForgeRange
def minecraftMetadataVersion = qualificationMinecraftRange ?: "[${rootProject.minecraft_version}]"
def neoForgeMetadataVersion = qualificationNeoForgeRange ?: "[${rootProject.neoforge_version},)"
def neoForgeRunPort = { String qualificationProperty, String historicProperty, String defaultValue ->
    def raw = (qualificationEnabled
            ? providers.gradleProperty(qualificationProperty)
                    .orElse(providers.gradleProperty('ringQualificationPort'))
                    .orElse(providers.gradleProperty(historicProperty))
            : providers.gradleProperty(historicProperty))
            .orElse(defaultValue).get().trim()
    try {
        def port = Integer.parseInt(raw)
        if (port < 1 || port > 65535) throw new NumberFormatException(raw)
        return port
    } catch (NumberFormatException ignored) {
        throw new GradleException("${qualificationProperty}/${historicProperty} must be an integer from 1 to 65535")
    }
}
if (qualificationEnabled) {
    layout.buildDirectory.set(new File(rootProject.ext.ringQualificationCellRoot, 'build/neoforge'))
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
    withSourcesJar()
}

sourceSets.main.java.setSrcDirs([
        rootProject.file('src/main/java'),
        rootProject.file('src/client/java'),
        rootProject.file('src/platform/neoforge/java'),
        rootProject.file('src/platform/neoforgeClient/java')
])
sourceSets.main.resources.setSrcDirs([
        rootProject.file('src/main/resources'),
        rootProject.file('src/client/resources'),
        rootProject.file('src/platform/neoforge/resources')
])
sourceSets.main.resources.exclude('fabric.mod.json')

// Run the same loader-neutral contract suite against the NeoForge-compiled
// common sources. Platform-specific runtime gates remain separate.
sourceSets.test.java.setSrcDirs([
        rootProject.file('src/test/java')
])
sourceSets.test.resources.setSrcDirs([
        rootProject.file('src/test/resources'),
        rootProject.file('src/main/resources')
])

neoForge {
    version = rootProject.neoforge_version

    runs {
        client {
            client()
            gameDirectory = qualificationRunFile('run-client')
        }
        atlasUiClient {
            client()
            gameDirectory = qualificationRunFile('run-atlas-ui')
            systemProperty 'ringworld.atlasUiTest', 'true'
            programArgument '--username'
            programArgument 'AtlasUiTester'
        }
        creationUiClient {
            client()
            gameDirectory = qualificationRunFile('run-creation-ui')
            systemProperty 'ringworld.creationUiTest', 'true'
            // The fixture requires this exact framebuffer before it opens Create World.
            programArgument '--username'
            programArgument 'CreationUiTester'
            programArgument '--width'
            programArgument '1920'
            programArgument '--height'
            programArgument '1080'
        }
        mapCompassCaptureClient {
            client()
            gameDirectory = qualificationRunFile('run-map-compass-capture')
            systemProperty 'ringworld.captureMapCompass', 'true'
            programArgument '--username'
            programArgument 'MapCompassTester'
        }
        curvedObjectCaptureClient {
            client()
            gameDirectory = qualificationRunFile('run-curved-object-capture')
            systemProperty 'ringworld.curvedObjectCapture', 'true'
            programArgument '--username'
            programArgument 'RingObjectTester'
        }
        productionProjectionClient {
            client()
            gameDirectory = qualificationRunFile('run-production-projection')
            systemProperty 'ringworld.captureRingProjection', 'true'
            systemProperty 'ringworld.projectionWorld', providers.gradleProperty('ringNeoForgeProjectionDestination')
                    .orElse('RingWorld NeoForge Projection').get()
            systemProperty 'ringworld.projectionViewDistanceChunks',
                    providers.gradleProperty('ringNeoForgeProjectionViewDistanceChunks').orElse('16').get()
            systemProperty 'ringworld.projectionEnvironment',
                    providers.gradleProperty('ringNeoForgeProjectionEnvironment').orElse('noon').get()
        }
        productionVisualParityClient {
            client()
            // This run receives a fresh copied save for every invocation.
            // Keep it separate from the projection checkpoint so its seam and
            // rim screenshots are disposable, unambiguous gate evidence.
            gameDirectory = qualificationRunFile('run-production-visual-parity')
            systemProperty 'ringworld.captureRingVisualParity', 'true'
            systemProperty 'ringworld.visualParityWorld',
                    providers.gradleProperty('ringNeoForgeVisualParityDestination')
                            .orElse('RingWorld NeoForge Visual Parity').get()
            systemProperty 'ringworld.visualParityViewDistanceChunks',
                    providers.gradleProperty('ringNeoForgeVisualParityViewDistanceChunks')
                            .orElse('16').get()
        }
        layoutSwitchClient {
            client()
            gameDirectory = qualificationRunFile('run-layout-switch')
            systemProperty 'ringworld.layoutSwitchFirst',
                    providers.gradleProperty('ringNeoForgeLayoutSwitchFirstDestination')
                            .orElse('RingWorld NeoForge Layout A').get()
            systemProperty 'ringworld.layoutSwitchSecond',
                    providers.gradleProperty('ringNeoForgeLayoutSwitchSecondDestination')
                            .orElse('RingWorld NeoForge Layout B').get()
            systemProperty 'ringworld.layoutSwitchExpectation',
                    providers.gradleProperty('ringNeoForgeLayoutSwitchExpectation')
                            .orElse('different-layout').get()
        }
        productionLifecycleClient {
            client()
            gameDirectory = qualificationRunFile('run-production-lifecycle')
            systemProperty 'ringworld.productionLifecycleTest', 'true'
            systemProperty 'ringworld.productionLifecycleWorld',
                    providers.gradleProperty('ringNeoForgeProductionLifecycleDestination')
                            .orElse('RingWorld NeoForge Production Lifecycle').get()
        }
        strongholdTestServer {
            server()
            gameDirectory = qualificationRunFile('run-stronghold-test')
            systemProperty 'ringworld.strongholdTest', 'true'
            systemProperty 'ringworld.worldgenMatrix',
                    providers.gradleProperty('ringWorldgenMatrix').orElse('false').get()
            systemProperty 'ringworld.strongholdTestResume',
                    providers.gradleProperty('ringStrongholdTestResume').orElse('false').get()
            programArgument '--nogui'
        }
        headlessPrewarmServer {
            server()
            gameDirectory = qualificationRunFile('run-headless-prewarm')
            systemProperty 'ringworld.headlessPrewarm', 'true'
            systemProperty 'ringworld.headlessPrewarmReport',
                    providers.gradleProperty('ringNeoForgeHeadlessPrewarmResult').orElse('result.json').get()
            programArgument '--nogui'
        }
        multiplayerServer {
            server()
            // This intentionally lives below the NeoForge subproject so it
            // never shares a world, logs, or port configuration with Fabric's
            // run-multiplayer harness.
            gameDirectory = qualificationRunFile('run-multiplayer/server')
            systemProperty 'ringworld.multiplayerTest', 'true'
            programArgument '--nogui'
        }
        multiplayerClientA {
            client()
            gameDirectory = qualificationRunFile('run-multiplayer/client-a')
            systemProperty 'ringworld.multiplayerTestRole', 'A'
            systemProperty 'ringworld.multiplayerTestPort',
                    neoForgeRunPort('ringQualificationNeoForgeMultiplayerPort', 'ringNeoForgeMultiplayerPort', '25566').toString()
            systemProperty 'ringworld.multiplayerTestViewDistanceChunks', '5'
            programArgument '--username'
            programArgument 'RingTesterA'
        }
        multiplayerClientB {
            client()
            gameDirectory = qualificationRunFile('run-multiplayer/client-b')
            systemProperty 'ringworld.multiplayerTestRole', 'B'
            systemProperty 'ringworld.multiplayerTestPort',
                    neoForgeRunPort('ringQualificationNeoForgeMultiplayerPort', 'ringNeoForgeMultiplayerPort', '25566').toString()
            systemProperty 'ringworld.multiplayerTestViewDistanceChunks', '5'
            programArgument '--username'
            programArgument 'RingTesterB'
        }
        raidSeamArmServer {
            server()
            gameDirectory = qualificationRunFile('run-raid-seam/server')
            systemProperty 'ringworld.raidSeamTest', 'true'
            systemProperty 'ringworld.raidSeamTestPhase', 'arm'
            systemProperty 'ringworld.raidSeamTestStopAfterSave', 'true'
            programArgument '--nogui'
        }
        raidSeamReloadServer {
            server()
            gameDirectory = qualificationRunFile('run-raid-seam/server')
            systemProperty 'ringworld.raidSeamTest', 'true'
            systemProperty 'ringworld.raidSeamTestPhase', 'reload'
            programArgument '--nogui'
        }
        raidSeamClientA {
            client()
            gameDirectory = qualificationRunFile('run-raid-seam/client-a')
            systemProperty 'ringworld.multiplayerTestRole', 'A'
            systemProperty 'ringworld.multiplayerTestPort',
                    neoForgeRunPort('ringQualificationNeoForgeRaidSeamPort', 'ringNeoForgeRaidSeamPort', '25567').toString()
            programArgument '--username'
            programArgument 'RingTesterA'
        }
        raidSeamClientB {
            client()
            gameDirectory = qualificationRunFile('run-raid-seam/client-b')
            systemProperty 'ringworld.multiplayerTestRole', 'B'
            systemProperty 'ringworld.multiplayerTestPort',
                    neoForgeRunPort('ringQualificationNeoForgeRaidSeamPort', 'ringNeoForgeRaidSeamPort', '25567').toString()
            programArgument '--username'
            programArgument 'RingTesterB'
        }
        server {
            server()
            gameDirectory = qualificationRunFile('run-server')
        }
        qualificationSmokeServer {
            server()
            gameDirectory = qualificationRunFile('qualification-smoke')
            programArgument '--port'
            programArgument neoForgeRunPort('ringQualificationNeoForgeSmokePort', 'ringNeoForgeSmokePort', '25565').toString()
            programArgument '--nogui'
        }
    }

    mods {
        ringworld {
            sourceSet sourceSets.main
        }
    }

    unitTest {
        enable()
        testedMod = mods.ringworld
    }
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

def generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    inputs.properties([
        mod_version: project.version,
        minecraft_metadata_version: minecraftMetadataVersion,
        neoforge_metadata_version: neoForgeMetadataVersion
    ])
    expand([
        mod_version: project.version,
        minecraft_metadata_version: minecraftMetadataVersion,
        neoforge_metadata_version: neoForgeMetadataVersion
    ])
    from 'src/main/templates'
    into layout.buildDirectory.dir('generated/sources/modMetadata')
    doFirst {
        if (qualificationMinecraftRange != null) {
            rootProject.ext.requireNeoForgeQualificationRange(
                    'ringQualificationMinecraftRange', qualificationMinecraftRange)
        }
        if (qualificationNeoForgeRange != null) {
            rootProject.ext.requireNeoForgeQualificationRange(
                    'ringQualificationNeoForgeRange', qualificationNeoForgeRange)
        }
    }
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.encoding = 'UTF-8'
}

tasks.named('test') {
    useJUnitPlatform()
}

tasks.withType(Jar).configureEach {
    from(rootProject.file('LICENSE')) {
        rename { 'LICENSE-RINGWORLD.txt' }
    }
}

tasks.named('processResources') {
    inputs.property 'version', project.version
    inputs.property 'release_label', rootProject.release_label
    filesMatching('ringworld-build.properties') {
        expand version: project.version, release_label: rootProject.release_label
    }
}

def checkedProjectionSaveId = { String value, String propertyName ->
    def saveId = value == null ? '' : value.trim()
    if (saveId.isEmpty() || saveId == '.' || saveId == '..'
            || saveId.contains('/') || saveId.contains('\\')) {
        throw new GradleException("${propertyName} must be one save-directory name")
    }
    saveId
}

