tasks.register('prepareNeoForgeHeadlessPrewarmWorld') {
    group = 'ringworld verification'
    description = 'Prepares a fresh or copied disposable NeoForge world for headless atlas prewarm.'
    inputs.property('ringNeoForgeHeadlessPrewarmSource',
            providers.gradleProperty('ringNeoForgeHeadlessPrewarmSource').orElse(''))
    inputs.property('ringNeoForgeHeadlessPrewarmResult',
            providers.gradleProperty('ringNeoForgeHeadlessPrewarmResult').orElse('result.json'))
    inputs.property('ringNeoForgeHeadlessPrewarmResume',
            providers.gradleProperty('ringNeoForgeHeadlessPrewarmResume').orElse('false'))
    inputs.property('ringNeoForgeHeadlessPrewarmCircumference',
            providers.gradleProperty('ringNeoForgeHeadlessPrewarmCircumference').orElse('2048'))
    inputs.property('ringNeoForgeHeadlessPrewarmWidth',
            providers.gradleProperty('ringNeoForgeHeadlessPrewarmWidth').orElse('416'))
    outputs.upToDateWhen { false }
    doLast {
        def sourceName = providers.gradleProperty('ringNeoForgeHeadlessPrewarmSource').orElse('').get().trim()
        def resume = providers.gradleProperty('ringNeoForgeHeadlessPrewarmResume').orElse('false').get().toBoolean()
        def reportName = providers.gradleProperty('ringNeoForgeHeadlessPrewarmResult').orElse('result.json').get().trim()
        if (reportName.isEmpty() || reportName == 'progress.json' || reportName.contains('/')
                || reportName.contains('\\') || !reportName.endsWith('.json')) {
            throw new GradleException('-PringNeoForgeHeadlessPrewarmResult must be one .json filename')
        }
        def eula = new File(neoForgeHeadlessPrewarmRun, 'eula.txt')
        if (!eula.isFile()) {
            eula.parentFile.mkdirs()
            eula.text = '# Review https://aka.ms/MinecraftEULA before changing this value.\neula=false\n'
        }
        if (!eula.isFile() || !eula.text.readLines().any { it.trim() == 'eula=true' }) {
            throw new GradleException("Review ${eula}, then set eula=true to run this disposable server")
        }
        def world = new File(neoForgeHeadlessPrewarmRun, 'world')
        if (resume) {
            if (!sourceName.isEmpty() || !new File(world, 'level.dat').isFile()) {
                throw new GradleException('-PringNeoForgeHeadlessPrewarmResume=true requires the existing disposable world and no copy source')
            }
        } else {
            delete(world)
            delete(new File(neoForgeHeadlessPrewarmRun, 'logs'))
        }
        if (!sourceName.isEmpty()) {
            def sourceId = checkedProjectionSaveId(sourceName, 'ringNeoForgeHeadlessPrewarmSource')
            def source = new File(neoForgeProjectionSourceSaves, sourceId)
            if (!new File(source, 'level.dat').isFile()) {
                throw new GradleException("ringNeoForgeHeadlessPrewarmSource must name a save under ${neoForgeProjectionSourceSaves}: ${sourceId}")
            }
            copy { from source; into world }
            if (!new File(world, 'level.dat').isFile()) {
                throw new GradleException("copied NeoForge headless world is missing level.dat: ${world}")
            }
        }
        def reportDirectory = new File(world, 'ringworld-prewarm')
        delete(new File(reportDirectory, reportName))
        delete(new File(reportDirectory, 'progress.json'))

        def propertiesFile = new File(neoForgeHeadlessPrewarmRun, 'server.properties')
        def properties = new Properties()
        if (propertiesFile.isFile()) propertiesFile.withInputStream { properties.load(it) }
        properties.setProperty('level-name', 'world')
        properties.setProperty('online-mode', 'false')
        properties.setProperty('server-port', '0')
        properties.setProperty('pause-when-empty-seconds', '-1')
        propertiesFile.parentFile.mkdirs()
        propertiesFile.withOutputStream { properties.store(it, 'Disposable RingWorld NeoForge headless prewarm') }

        def configFile = new File(neoForgeHeadlessPrewarmRun, 'config/ringworld.properties')
        def config = new Properties()
        config.setProperty('widthBlocks',
                providers.gradleProperty('ringNeoForgeHeadlessPrewarmWidth').orElse('416').get())
        config.setProperty('circumferenceBlocks',
                providers.gradleProperty('ringNeoForgeHeadlessPrewarmCircumference').orElse('2048').get())
        config.setProperty('wallHeightBlocks', '160')
        config.setProperty('testMode', 'false')
        config.setProperty('testViewDistanceChunks', '6')
        config.setProperty('pregenerateTerrainAtlas', 'false')
        configFile.parentFile.mkdirs()
        configFile.withOutputStream { config.store(it, 'Disposable RingWorld NeoForge headless prewarm') }
    }
}

tasks.register('verifyNeoForgeHeadlessPrewarm') {
    group = 'ringworld verification'
    description = 'Fails unless NeoForge headless prewarm wrote a complete, identity-bearing atlas report.'
    mustRunAfter('runHeadlessPrewarmServer')
    doLast {
        def resultName = providers.gradleProperty('ringNeoForgeHeadlessPrewarmResult').orElse('result.json').get().trim()
        def expectedCircumference = providers.gradleProperty('ringNeoForgeHeadlessPrewarmCircumference').orElse('2048').get().toInteger()
        def expectedWidth = providers.gradleProperty('ringNeoForgeHeadlessPrewarmWidth').orElse('416').get().toInteger()
        def expectedMapping = providers.gradleProperty('ringNeoForgeHeadlessPrewarmExpectedTerrainNoiseMapping').orElse('4').get().toInteger()
        if (!(expectedMapping in [1, 2, 3, 4])) {
            throw new GradleException('-PringNeoForgeHeadlessPrewarmExpectedTerrainNoiseMapping must be 1, 2, 3, or 4')
        }
        def result = new File(neoForgeHeadlessPrewarmRun, "world/ringworld-prewarm/${resultName}")
        if (!result.isFile()) {
            throw new GradleException("NeoForge headless prewarm did not write a terminal result; inspect ${result}")
        }
        def report
        try {
            report = new groovy.json.JsonSlurper().parse(result)
        } catch (Exception failure) {
            throw new GradleException("NeoForge headless prewarm result is not valid JSON: ${result}", failure)
        }
        if (!(report instanceof Map) || report.schemaVersion != 2 || report.status != 'COMPLETE'
                || report.terrainNoiseMapping != expectedMapping
                || report.identityAvailable != true || !report.atlasPath || report.failureReason != null
                || !(report.totalChunks instanceof Number) || !(report.completedChunks instanceof Number)
                || !(report.totalCells instanceof Number) || !(report.completedCells instanceof Number)
                || report.circumferenceBlocks != expectedCircumference || report.widthBlocks != expectedWidth
                || report.totalChunks <= 0 || report.totalCells <= 0
                || report.completedChunks != report.totalChunks || report.completedCells != report.totalCells) {
            throw new GradleException("NeoForge headless prewarm did not complete; inspect ${result}")
        }
    }
}

tasks.named('runHeadlessPrewarmServer') {
    dependsOn('prepareNeoForgeHeadlessPrewarmWorld')
    finalizedBy('verifyNeoForgeHeadlessPrewarm')
}

tasks.register('prepareCopiedNeoForgeProductionProjectionWorld') {
    group = 'ringworld verification'
    description = 'Copies a NeoForge source save into the isolated projection-client run directory.'
    inputs.property('ringNeoForgeProjectionSource',
            providers.gradleProperty('ringNeoForgeProjectionSource').orElse('NeoForge Test'))
    inputs.property('ringNeoForgeProjectionDestination',
            providers.gradleProperty('ringNeoForgeProjectionDestination')
                    .orElse('RingWorld NeoForge Projection'))
    outputs.dir(neoForgeProjectionSaves)
    outputs.upToDateWhen { false }
    doLast {
        def sourceId = checkedProjectionSaveId(
                providers.gradleProperty('ringNeoForgeProjectionSource').orElse('NeoForge Test').get(),
                'ringNeoForgeProjectionSource')
        def destinationId = checkedProjectionSaveId(
                providers.gradleProperty('ringNeoForgeProjectionDestination')
                        .orElse('RingWorld NeoForge Projection').get(),
                'ringNeoForgeProjectionDestination')
        def source = new File(neoForgeProjectionSourceSaves, sourceId)
        if (!new File(source, 'level.dat').isFile()) {
            throw new GradleException(
                    "ringNeoForgeProjectionSource must name a save under ${neoForgeProjectionSourceSaves}: ${sourceId}")
        }
        def destination = new File(neoForgeProjectionSaves, destinationId)
        delete(destination)
        delete(new File(neoForgeProjectionRun, 'screenshots'))
        delete(new File(neoForgeProjectionRun, 'ringworld-cache'))
        delete(new File(neoForgeProjectionRun, 'logs'))
        // Keep release-evidence captures free of the first-world movement toast.
        // This directory is disposable and isolated from the user's real options.
        def projectionOptions = new File(neoForgeProjectionRun, 'options.txt')
        def optionLines = projectionOptions.isFile()
                ? projectionOptions.readLines('UTF-8') : []
        optionLines.removeAll { it.startsWith('tutorialStep:') }
        optionLines.add('tutorialStep:none')
        projectionOptions.parentFile.mkdirs()
        projectionOptions.setText(optionLines.join('\n') + '\n', 'UTF-8')
        copy {
            from(source)
            into(destination)
        }
        if (!new File(destination, 'level.dat').isFile()) {
            throw new GradleException("copied NeoForge projection save is missing level.dat: ${destination}")
        }
        logger.lifecycle('[neoforge-projection] copied source={} destination={}', source, destination)
    }
}

