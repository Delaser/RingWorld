tasks.register('verifyNeoForgeAtlasUiClient') {
    group = 'ringworld verification'
    description = 'Fails unless the isolated NeoForge GUI-scale-4 atlas-map client completed every required capture.'
    mustRunAfter('runAtlasUiClient')
    doLast {
        def logFile = new File(neoForgeAtlasUiRun, 'logs/latest.log')
        def log = logFile.isFile() ? logFile.text : ''
        if (!log.contains('[atlas-ui-test] PASS') || log.contains('[atlas-ui-test] FAIL')) {
            throw new GradleException("NeoForge atlas UI client did not pass; inspect ${logFile}")
        }
        def atlasHandshakeMarkers = ['[atlas-ui-test] client-ready', '[atlas-ui-test] settings-v3-mapping-4',
         '[atlas-ui-test] disconnect-clear', '[atlas-ui-test] PASS']
        def previousAtlasHandshakeMarker = -1
        atlasHandshakeMarkers.each { marker ->
            def markerIndex = log.indexOf(marker)
            if (markerIndex <= previousAtlasHandshakeMarker) {
                throw new GradleException("NeoForge atlas UI client is missing handshake marker '${marker}'; inspect ${logFile}")
            }
            previousAtlasHandshakeMarker = markerIndex
        }
        def atlasSettingsAck = log.indexOf('RingWorld settings acknowledged by AtlasUiTester on NeoForge: format 3')
        if (atlasSettingsAck < 0 || atlasSettingsAck >= log.indexOf('[atlas-ui-test] disconnect-clear')) {
            throw new GradleException("NeoForge Atlas UI integrated server did not accept the format-3 settings acknowledgement; inspect ${logFile}")
        }
        rootProject.ext.requirePartialAtlasHandoff(
                logFile, 'NeoForge Atlas UI client')
        (1..11).each { index ->
            def prefix = String.format('atlas-ui-%02d-', index)
            if (fileTree(new File(neoForgeAtlasUiRun, 'screenshots')).matching { include prefix + '*.png' }.isEmpty()) {
                throw new GradleException("NeoForge atlas UI client is missing screenshot ${prefix}*.png")
            }
        }
        def partialCaptures = fileTree(new File(neoForgeAtlasUiRun, 'screenshots'))
                .matching { include 'atlas-ui-05-*.png' }.files
        if (partialCaptures.size() != 1) {
            throw new GradleException(
                    'NeoForge Atlas UI client requires exactly one partial-handoff screenshot')
        }
        rootProject.ext.requireProjectionHandoffContinuity(
                partialCaptures.first(), 'NeoForge partial Atlas handoff')
    }
}

