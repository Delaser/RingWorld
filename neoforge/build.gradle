tasks.register('verifyNeoForgeMapCompassCaptureClient') {
    group = 'ringworld verification'
    description = 'Fails unless NeoForge passes the real map/compass seam and persistence paths.'
    mustRunAfter('runMapCompassCaptureClient')
    doLast {
        def logFile = new File(neoForgeMapCompassRun, 'logs/latest.log')
        def log = logFile.isFile() ? logFile.text : ''
        if (!log.contains('[map-compass-capture] PASS') || log.contains('[map-compass-capture] FAIL')) {
            throw new GradleException("NeoForge map and compass capture did not pass; inspect ${logFile}")
        }
        def verifyScreenshot = { screenshot ->
            def input = javax.imageio.ImageIO.createImageInputStream(screenshot)
            if (input == null) {
                throw new GradleException("NeoForge map and compass capture screenshot is not a readable image ${screenshot}")
            }
            try {
                def readers = javax.imageio.ImageIO.getImageReaders(input)
                if (!readers.hasNext()) {
                    throw new GradleException("NeoForge map and compass capture screenshot is not a decodable image ${screenshot}")
                }
                def reader = readers.next()
                try {
                    if (!reader.formatName.equalsIgnoreCase('png')) {
                        throw new GradleException("NeoForge map and compass capture screenshot is not a PNG ${screenshot}")
                    }
                    reader.setInput(input, true, true)
                    def width = reader.getWidth(0)
                    def height = reader.getHeight(0)
                    if (width < 16 || height < 16 || width > 16_384 || height > 16_384) {
                        throw new GradleException("NeoForge map and compass capture screenshot has unsafe dimensions ${width}x${height}: ${screenshot}")
                    }
                    def image = reader.read(0)
                    if (image == null || image.width != width || image.height != height) {
                        throw new GradleException("NeoForge map and compass capture screenshot did not decode correctly ${screenshot}")
                    }
                    Integer firstVisiblePixel = null
                    boolean nonUniform = false
                    for (int y = 0; y < height && !nonUniform; y++) {
                        for (int x = 0; x < width; x++) {
                            int pixel = image.getRGB(x, y)
                            if ((pixel >>> 24) != 0) {
                                if (firstVisiblePixel == null) {
                                    firstVisiblePixel = pixel
                                } else if (pixel != firstVisiblePixel) {
                                    nonUniform = true
                                    break
                                }
                            }
                        }
                    }
                    if (firstVisiblePixel == null || !nonUniform) {
                        throw new GradleException("NeoForge map and compass capture screenshot is blank or uniform ${screenshot}")
                    }
                } finally {
                    reader.dispose()
                }
            } finally {
                input.close()
            }
        }
        ['ringworld-map-scale', 'ringworld-map-banner-removed',
         'ringworld-map-high-to-low', 'ringworld-map-low-to-high',
         'ringworld-compass-high-to-low', 'ringworld-compass-low-to-high',
         'ringworld-map-reopened', 'ringworld-compass-reopened'].each { prefix ->
            def screenshots = fileTree(new File(neoForgeMapCompassRun, 'screenshots')).matching { include prefix + '*.png' }.files
            if (screenshots.isEmpty()) {
                throw new GradleException("NeoForge map and compass capture is missing screenshot ${prefix}*.png")
            }
            screenshots.each(verifyScreenshot)
        }
    }
}

