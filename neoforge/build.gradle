// The screenshot is written one rendered frame after the fixture samples the
// projected corners. Expand the sampled target rectangle by this bounded
// timing/anti-aliasing tolerance, then clip it to the actual viewport.
def createCompatibilityProjectionTolerancePixels = 24
def createCompatibilityPixelSignature = { File screenshot, String proof, boolean expectedVisible ->
        def sanityMatch = proof =~ / poseSanityRoi=(\d+)\/(\d+)\/(\d+)\/(\d+) /
        if (!sanityMatch.find()) {
            throw new GradleException("Capture proof has no pose sanity ROI: ${proof}")
        }
        def projectionMatch = proof =~ / projectedBounds=([^\/ ]+)\/([^\/ ]+)\/([^\/ ]+)\/([^ ]+) /
        if (!projectionMatch.find()) {
            throw new GradleException("Capture proof has no projected target bounds: ${proof}")
        }
        def image = javax.imageio.ImageIO.read(screenshot)
        if (image == null) throw new GradleException("Could not decode screenshot: ${screenshot}")
        def poseSanityRoi = [
                minX: sanityMatch.group(1).toInteger(), minY: sanityMatch.group(2).toInteger(),
                maxX: sanityMatch.group(3).toInteger(), maxY: sanityMatch.group(4).toInteger()]
        if (poseSanityRoi.minX < 0 || poseSanityRoi.minY < 0
                || poseSanityRoi.maxX > image.width || poseSanityRoi.maxY > image.height
                || poseSanityRoi.minX >= poseSanityRoi.maxX
                || poseSanityRoi.minY >= poseSanityRoi.maxY) {
            throw new GradleException("Invalid pose sanity ROI for ${screenshot.name}: "
                    + "${poseSanityRoi} in ${image.width}x${image.height}")
        }

        double projectedMinX = projectionMatch.group(1).toDouble()
        double projectedMinY = projectionMatch.group(2).toDouble()
        double projectedMaxX = projectionMatch.group(3).toDouble()
        double projectedMaxY = projectionMatch.group(4).toDouble()
        def projectionRoi = null
        if ([projectedMinX, projectedMinY, projectedMaxX, projectedMaxY].every { Double.isFinite(it) }) {
            int minX = Math.max(0, Math.floor(projectedMinX
                    - createCompatibilityProjectionTolerancePixels).toInteger())
            int minY = Math.max(0, Math.floor(projectedMinY
                    - createCompatibilityProjectionTolerancePixels).toInteger())
            int maxX = Math.min(image.width, Math.ceil(projectedMaxX
                    + createCompatibilityProjectionTolerancePixels).toInteger())
            int maxY = Math.min(image.height, Math.ceil(projectedMaxY
                    + createCompatibilityProjectionTolerancePixels).toInteger())
            if (minX < maxX && minY < maxY) {
                projectionRoi = [minX: minX, minY: minY, maxX: maxX, maxY: maxY]
            }
        }
        if (expectedVisible && projectionRoi == null) {
            throw new GradleException("Visible target has no clipped projection ROI: ${screenshot.name}")
        }
        if (expectedVisible && (projectionRoi.minX < poseSanityRoi.minX
                || projectionRoi.minY < poseSanityRoi.minY
                || projectionRoi.maxX > poseSanityRoi.maxX
                || projectionRoi.maxY > poseSanityRoi.maxY)) {
            throw new GradleException("Projected target escaped pose sanity ROI for ${screenshot.name}: "
                    + "projection=${projectionRoi} sanity=${poseSanityRoi}")
        }

        // These prototypes are the four reviewed, target-only block families.
        // Every pixel is assigned to at most one nearest prototype, so a
        // purple/magenta pixel cannot satisfy two nominal color groups.
        def prototypes = [
                gold: [151, 124, 33], magenta: [160, 70, 145],
                lime: [63, 114, 16], purple: [87, 64, 125]]
        def scanRoi = expectedVisible ? projectionRoi : poseSanityRoi
        def counts = [gold: 0, magenta: 0, lime: 0, purple: 0]
        int signatureMinX = image.width
        int signatureMinY = image.height
        int signatureMaxX = -1
        int signatureMaxY = -1
        for (int y = scanRoi.minY; y < scanRoi.maxY; y++) {
            for (int x = scanRoi.minX; x < scanRoi.maxX; x++) {
                int rgb = image.getRGB(x, y)
                int red = (rgb >>> 16) & 0xff
                int green = (rgb >>> 8) & 0xff
                int blue = rgb & 0xff
                if (Math.max(red, Math.max(green, blue)) - Math.min(red, Math.min(green, blue)) < 30) {
                    continue
                }
                def nearest = prototypes.collectEntries { name, prototype ->
                    int dr = red - prototype[0]
                    int dg = green - prototype[1]
                    int db = blue - prototype[2]
                    [(name): dr * dr + dg * dg + db * db]
                }.min { first, second -> first.value <=> second.value }
                if (nearest.value <= 6400) {
                    counts[nearest.key]++
                    signatureMinX = Math.min(signatureMinX, x)
                    signatureMinY = Math.min(signatureMinY, y)
                    signatureMaxX = Math.max(signatureMaxX, x)
                    signatureMaxY = Math.max(signatureMaxY, y)
                }
            }
        }
        int signatureWidth = signatureMaxX < signatureMinX ? 0 : signatureMaxX - signatureMinX + 1
        int signatureHeight = signatureMaxY < signatureMinY ? 0 : signatureMaxY - signatureMinY + 1
        // Seven pixels is the reviewed minimum for the far bearing pose: it
        // still requires three mutually-exclusive target colors plus a 12x4
        // footprint, while the expected-offscreen ceiling remains eight total
        // palette pixels across all groups.
        int qualifyingColors = counts.values().count { it >= 7 }
        if (expectedVisible && (qualifyingColors < 3
                || signatureWidth < 12 || signatureHeight < 4)) {
            throw new GradleException("Visible target pixel signature missing from ${screenshot.name}: "
                    + "counts=${counts} "
                    + "bounds=${signatureMinX}/${signatureMinY}/${signatureMaxX}/${signatureMaxY} "
                    + "projectionRoi=${projectionRoi} sanity=${poseSanityRoi}")
        }
        int totalPalettePixels = counts.values().sum() as int
        if (!expectedVisible && totalPalettePixels > 8) {
            throw new GradleException("Expected-offscreen target signature present in ${screenshot.name}: "
                    + "counts=${counts} total=${totalPalettePixels} sanity=${poseSanityRoi}")
        }
        [projectionRoi: projectionRoi,
         projectionTolerancePixels: createCompatibilityProjectionTolerancePixels,
         poseSanityRoi: poseSanityRoi,
         scanRoi: scanRoi,
         counts: counts,
         totalPalettePixels: totalPalettePixels,
         qualifyingColors: qualifyingColors,
         footprint: signatureWidth == 0 ? null : [minX: signatureMinX, minY: signatureMinY,
                                                   maxX: signatureMaxX, maxY: signatureMaxY,
                                                   width: signatureWidth, height: signatureHeight],
         expectedVisible: expectedVisible,
         requiredAndPassed: true]
}

// Moved block-entity payloads use Create's BER path, independently of the
// cached structure mesh. Bind their pixels to their exact projected local
// blocks and to the two adjoining structure blocks so an aggregate palette
// signature cannot conceal a detached chest or shulker.
def createLinearPayloadPixelEvidence = { File screenshot, String proof, boolean enforce = true ->
    def image = javax.imageio.ImageIO.read(screenshot)
    if (image == null) throw new GradleException("Could not decode screenshot: ${screenshot}")
    def parseBounds = { String label ->
        def match = proof =~ / ${label}=(-?[0-9.]+)\/(-?[0-9.]+)\/(-?[0-9.]+)\/(-?[0-9.]+)/
        if (!match.find()) {
            throw new GradleException("Linear capture lacks ${label}: ${proof}")
        }
        [minX: match.group(1).toDouble(), minY: match.group(2).toDouble(),
         maxX: match.group(3).toDouble(), maxY: match.group(4).toDouble()]
    }
    def parseNeighborBounds = { String label ->
        def match = proof =~ / ${label}=(-?[0-9.]+)\/(-?[0-9.]+)\/(-?[0-9.]+)\/(-?[0-9.]+)\|(-?[0-9.]+)\/(-?[0-9.]+)\/(-?[0-9.]+)\/(-?[0-9.]+)/
        if (!match.find()) {
            throw new GradleException("Linear capture lacks ${label}: ${proof}")
        }
        [[minX: match.group(1).toDouble(), minY: match.group(2).toDouble(),
          maxX: match.group(3).toDouble(), maxY: match.group(4).toDouble()],
         [minX: match.group(5).toDouble(), minY: match.group(6).toDouble(),
          maxX: match.group(7).toDouble(), maxY: match.group(8).toDouble()]]
    }
    def clipped = { bounds, int tolerance ->
        [minX: Math.max(0, Math.floor(bounds.minX - tolerance).toInteger()),
         minY: Math.max(0, Math.floor(bounds.minY - tolerance).toInteger()),
         maxX: Math.min(image.width, Math.ceil(bounds.maxX + tolerance).toInteger()),
         maxY: Math.min(image.height, Math.ceil(bounds.maxY + tolerance).toInteger())]
    }
    def scan = { bounds, int tolerance, Closure<Boolean> predicate ->
        def roi = clipped(bounds, tolerance)
        int count = 0
        long sumX = 0
        long sumY = 0
        int minX = image.width
        int minY = image.height
        int maxX = -1
        int maxY = -1
        for (int y = roi.minY; y < roi.maxY; y++) {
            for (int x = roi.minX; x < roi.maxX; x++) {
                int rgb = image.getRGB(x, y)
                int red = (rgb >>> 16) & 0xff
                int green = (rgb >>> 8) & 0xff
                int blue = rgb & 0xff
                if (!predicate.call(red, green, blue)) continue
                count++
                sumX += x
                sumY += y
                minX = Math.min(minX, x)
                minY = Math.min(minY, y)
                maxX = Math.max(maxX, x)
                maxY = Math.max(maxY, y)
            }
        }
        def centerX = count == 0 ? null : (double) sumX / count
        def centerY = count == 0 ? null : (double) sumY / count
        double predictedX = (bounds.minX + bounds.maxX) * 0.5d
        double predictedY = (bounds.minY + bounds.maxY) * 0.5d
        [roi: roi, count: count, centerX: centerX, centerY: centerY,
         predictedCenterX: predictedX, predictedCenterY: predictedY,
         centerError: count == 0 ? null
                 : Math.hypot(centerX - predictedX, centerY - predictedY),
         footprint: count == 0 ? null : [minX: minX, minY: minY,
                                          maxX: maxX, maxY: maxY,
                                          width: maxX - minX + 1,
                                          height: maxY - minY + 1]]
    }
    def chestBounds = parseBounds('chestBounds')
    def shulkerBounds = parseBounds('shulkerBounds')
    def chestNeighbors = parseNeighborBounds('chestNeighbors')
    def shulkerNeighbors = parseNeighborBounds('shulkerNeighbors')
    def chest = scan(chestBounds, 5) { int red, int green, int blue ->
        red >= 35 && red <= 145 && green >= 25 && green <= 120 && blue <= 70
                && red >= green && red - blue >= 25 && green - blue >= 12
    }
    def shulker = scan(shulkerBounds, 5) { int red, int green, int blue ->
        blue >= 55 && blue <= 190 && blue - red >= 28 && blue - green >= 18
    }
    def limePredicate = { int red, int green, int blue ->
        green >= 6 && green <= 165 && green - red >= 3 && green - blue >= 5
    }
    def goldPredicate = { int red, int green, int blue ->
        red >= 12 && red <= 210 && green >= 9 && green <= 180
                && red >= green && green - blue >= 3 && red - blue >= 6
    }
    def chestBefore = scan(chestNeighbors[0], 4, limePredicate)
    def chestAfter = scan(chestNeighbors[1], 4, goldPredicate)
    def shulkerBefore = scan(shulkerNeighbors[0], 4, limePredicate)
    def shulkerAfter = scan(shulkerNeighbors[1], 4, goldPredicate)
    def required = [chest: chest, shulker: shulker, chestBefore: chestBefore,
                    chestAfter: chestAfter, shulkerBefore: shulkerBefore,
                    shulkerAfter: shulkerAfter]
    def failures = required.findAll { name, sample ->
        sample.count < 6 || (sample.centerError != null && sample.centerError > 15.0d)
                || sample.footprint == null
                || (sample.footprint.width < 2 && sample.footprint.height < 2)
    }
    if (enforce && !failures.isEmpty()) {
        throw new GradleException("Detached/missing linear payload adjacency ${failures} in "
                + "${screenshot.name}: all=${required}")
    }
    [chest: chest, shulker: shulker,
     chestNeighbors: [before: chestBefore, after: chestAfter],
     shulkerNeighbors: [before: shulkerBefore, after: shulkerAfter],
     failures: failures.keySet().toList(), requiredAndPassed: failures.isEmpty()]
}

def bearingProjectedBounds = { String proof ->
        def match = proof =~ / projectedBounds=([^ ]+ depth=[^ ]+ center=[^ ]+ centerIn=[^ ]+ cornersIn=[^ ]+ projected=\d+)/
        if (!match.find()) throw new GradleException("Capture proof has no projected bounds: ${proof}")
        match.group(1)
}

def verifyCreateCompatibilityBearingClient = { File runDirectory, String route,
                                                String chart, String direction, String backendIdentity ->
        def logFile = new File(runDirectory, 'logs/latest.log')
        def log = logFile.isFile() ? logFile.text : ''
        if (backendIdentity == 'flywheel:instancing'
                && log.contains('[create-bearing] result=false capability-rejected requested=flywheel:instancing')) {
            new File(runDirectory, 'capability-rejection.txt').text =
                    log.readLines().find { it.contains('capability-rejected requested=flywheel:instancing') } + '\n'
            return
        }
        if (!log.contains("[create-bearing] result=true backend=${backendIdentity} realBearing=true glued=true")
                || !log.contains('route=' + route)
                || !log.contains('speedChange=true reversal=true')
                || !log.contains('reassemblyGeneration=2 durableReopenGeneration=3')
                || log.contains('[create-bearing] result=false')) {
            throw new GradleException("Real bearing reproducer did not pass; retained evidence: ${runDirectory}")
        }
        def proofLines = log.readLines().findAll { it.contains('[create-bearing] capture-proof') }
        if (proofLines.size() != 8) {
            throw new GradleException("Expected eight bound bearing sweep captures, found ${proofLines.size()}")
        }
        if (proofLines.count { it.contains('expectedVisible=true') } != 6
                || proofLines.count { it.contains('expectedVisible=false') } != 2) {
            throw new GradleException('Bearing sweep must contain six visible and two expected-offscreen captures')
        }
        def captures = proofLines.collect { proof ->
            def nameMatch = proof =~ / name=([^ ]+) /
            if (!nameMatch.find()) {
                throw new GradleException("Bearing proof line has no capture name: ${proof}")
            }
            def name = nameMatch.group(1)
            def screenshot = new File(runDirectory, "screenshots/${name}.png")
            if (!screenshot.isFile() || screenshot.length() == 0) {
                throw new GradleException("Missing bearing screenshot: ${screenshot}")
            }
            if (proof == null || !proof.contains('state=glued+rotating')
                    || !proof.contains('renderMembership=true removed=false')) {
                throw new GradleException("Bearing screenshot lacks bound rotation proof: ${name}")
            }
            boolean expectedVisible = proof.contains('expectedVisible=true')
            if (backendIdentity == 'flywheel:off'
                    && (proof.contains('/ringWorldLayout=true')
                    || proof.contains('/chunkTerrain=true')
                    || proof.count('/ringWorldLayout=false/chunkTerrain=false@') < 2)) {
                throw new GradleException("Bearing OFF selected a terrain-curving shader/layer: ${proof}")
            }
            def pixelSignature = createCompatibilityPixelSignature(
                    screenshot, proof, expectedVisible)
            // Bearing kinetic phase is intentionally live, so individual payload
            // faces can be hidden behind their distance-2/4 neighbours at a named
            // camera pose. Record every visible-frame result, then require several
            // separated unobscured angles below instead of treating occlusion as a
            // detached renderer.
            boolean payloadExpected = expectedVisible
            def payloadPixels = payloadExpected
                    ? createLinearPayloadPixelEvidence(screenshot, proof, false) : null
            [name: name,
             relativePath: runDirectory.toPath().relativize(screenshot.toPath()).toString(),
             absolutePath: screenshot.canonicalPath,
             sha256: sha256OfFile(screenshot),
             backend: backendIdentity, chart: chart, direction: direction,
             state: 'glued+rotating', expectedVisible: expectedVisible,
             projectedBounds: bearingProjectedBounds(proof),
             projectionRoi: pixelSignature.projectionRoi,
             poseSanityRoi: pixelSignature.poseSanityRoi,
             paletteCounts: pixelSignature.counts,
             paletteFootprint: pixelSignature.footprint,
              pixelSignature: pixelSignature, movedPayloadExpected: payloadExpected,
              movedPayloadPixels: payloadPixels,
              proofLogLine: proof]
        }
        def lifecycleProofLines = log.readLines().findAll {
            it.contains('[create-bearing] lifecycle-proof')
        }
        if (lifecycleProofLines.size() != 2) {
            throw new GradleException(
                    "Expected reassembled and reopened lifecycle captures, found ${lifecycleProofLines.size()}")
        }
        def lifecycleCaptures = lifecycleProofLines.collect { proof ->
            def nameMatch = proof =~ / name=([^ ]+) /
            if (!nameMatch.find()) {
                throw new GradleException("Bearing lifecycle proof has no capture name: ${proof}")
            }
            def name = nameMatch.group(1)
            def screenshot = new File(runDirectory, "screenshots/${name}.png")
            if (!screenshot.isFile() || screenshot.length() == 0
                    || !proof.contains('expectedVisible=true')
                    || !proof.contains('renderMembership=true removed=false')) {
                throw new GradleException("Bearing lifecycle screenshot is unbound or missing: ${name}")
            }
            def pixelSignature = createCompatibilityPixelSignature(screenshot, proof, true)
            if (backendIdentity == 'flywheel:off'
                    && (proof.contains('/ringWorldLayout=true')
                    || proof.contains('/chunkTerrain=true')
                    || proof.count('/ringWorldLayout=false/chunkTerrain=false@') < 2)) {
                throw new GradleException("Bearing lifecycle OFF selected a terrain-curving shader/layer: ${proof}")
            }
            def payloadPixels = createLinearPayloadPixelEvidence(screenshot, proof, false)
            [name: name,
             relativePath: runDirectory.toPath().relativize(screenshot.toPath()).toString(),
             absolutePath: screenshot.canonicalPath,
             sha256: sha256OfFile(screenshot),
             backend: backendIdentity, chart: chart, direction: direction,
             state: name.contains('durable-reopened') ? 'durable-reopened+rotating'
                     : 'reassembled+rotating', expectedVisible: true,
             projectedBounds: bearingProjectedBounds(proof),
             projectionRoi: pixelSignature.projectionRoi,
             poseSanityRoi: pixelSignature.poseSanityRoi,
             paletteCounts: pixelSignature.counts,
             paletteFootprint: pixelSignature.footprint,
              pixelSignature: pixelSignature, movedPayloadPixels: payloadPixels,
              proofLogLine: proof]
        }
        def qualifiedSweepPayloads = captures.findAll {
            it.movedPayloadPixels?.requiredAndPassed
        }
        def qualifiedLifecyclePayloads = lifecycleCaptures.findAll {
            it.movedPayloadPixels?.requiredAndPassed
        }
        if (qualifiedSweepPayloads.size() < 3 || qualifiedLifecyclePayloads.isEmpty()) {
            throw new GradleException("Bearing payload oracle lacks separated unobscured evidence: "
                    + "sweep=${qualifiedSweepPayloads*.name} lifecycle=${qualifiedLifecyclePayloads*.name} "
                    + "all=${(captures + lifecycleCaptures).collect { [it.name, it.movedPayloadPixels?.failures] }}")
        }
        def mods = new File(runDirectory, 'mods').listFiles()?.findAll { it.isFile() } ?: []
        if (mods.size() != 1 || sha256OfFile(mods.first()) != createCompatOuterJarSha256) {
            throw new GradleException("Bearing runtime jar is not the exact Create artifact: ${mods}")
        }
        def checkpointSourceCommit = providers.exec {
            workingDir rootProject.projectDir
            commandLine 'git', 'rev-parse', 'HEAD'
        }.standardOutput.asText.get().trim()
        new File(runDirectory, 'capture-manifest.json').text =
                groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson([
                        schema: 2,
                        sourceCommit: checkpointSourceCommit,
                        runDirectory: runDirectory.canonicalPath,
                        backend: backendIdentity,
                        route: route,
                        chart: chart,
                        direction: direction,
                        sourceLogRelativePath: runDirectory.toPath().relativize(logFile.toPath()).toString(),
                        sourceLogAbsolutePath: logFile.canonicalPath,
                        sourceLogSha256: sha256OfFile(logFile),
                        graphicalQualification: 'projected-target-roi-and-exclusive-palette-signature',
                        captures: captures + lifecycleCaptures
                ])) + '\n'
}

