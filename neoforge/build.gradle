tasks.register('verifyNeoForgeMapCompassCaptureClient') {
    group = 'ringworld verification'
    description = 'Fails unless NeoForge passes the real map/compass seam and persistence paths.'
    mustRunAfter('runMapCompassCaptureClient')
    doLast {
        def logFile = new File(neoForgeMapCompassRun, 'logs/latest.log')
        def log = logFile.isFile() ? logFile.text : ''
        if (!log.contains('[map-compass-capture] PASS') || log.contains('[map-compass-capture] FAIL')) {
            throw new GradleException("NeoForge map and compass capture did not pass; inspect ${logFile}")
        }
        def verifyScreenshot = { screenshot ->
            def input = javax.imageio.ImageIO.createImageInputStream(screenshot)
            if (input == null) {
                throw new GradleException("NeoForge map and compass capture screenshot is not a readable image ${screenshot}")
            }
            try {
                def readers = javax.imageio.ImageIO.getImageReaders(input)
                if (!readers.hasNext()) {
                    throw new GradleException("NeoForge map and compass capture screenshot is not a decodable image ${screenshot}")
                }
                def reader = readers.next()
                try {
                    if (!reader.formatName.equalsIgnoreCase('png')) {
                        throw new GradleException("NeoForge map and compass capture screenshot is not a PNG ${screenshot}")
                    }
                    reader.setInput(input, true, true)
                    def width = reader.getWidth(0)
                    def height = reader.getHeight(0)
                    if (width < 16 || height < 16 || width > 16_384 || height > 16_384) {
                        throw new GradleException("NeoForge map and compass capture screenshot has unsafe dimensions ${width}x${height}: ${screenshot}")
                    }
                    def image = reader.read(0)
                    if (image == null || image.width != width || image.height != height) {
                        throw new GradleException("NeoForge map and compass capture screenshot did not decode correctly ${screenshot}")
                    }
                    Integer firstVisiblePixel = null
                    boolean nonUniform = false
                    for (int y = 0; y < height && !nonUniform; y++) {
                        for (int x = 0; x < width; x++) {
                            int pixel = image.getRGB(x, y)
                            if ((pixel >>> 24) != 0) {
                                if (firstVisiblePixel == null) {
                                    firstVisiblePixel = pixel
                                } else if (pixel != firstVisiblePixel) {
                                    nonUniform = true
                                    break
                                }
                            }
                        }
                    }
                    if (firstVisiblePixel == null || !nonUniform) {
                        throw new GradleException("NeoForge map and compass capture screenshot is blank or uniform ${screenshot}")
                    }
                } finally {
                    reader.dispose()
                }
            } finally {
                input.close()
            }
        }
        ['ringworld-map-scale', 'ringworld-map-banner-removed',
         'ringworld-map-high-to-low', 'ringworld-map-low-to-high',
         'ringworld-compass-high-to-low', 'ringworld-compass-low-to-high',
         'ringworld-map-reopened', 'ringworld-compass-reopened'].each { prefix ->
            def screenshots = fileTree(new File(neoForgeMapCompassRun, 'screenshots')).matching { include prefix + '*.png' }.files
            if (screenshots.isEmpty()) {
                throw new GradleException("NeoForge map and compass capture is missing screenshot ${prefix}*.png")
            }
            screenshots.each(verifyScreenshot)
        }
    }
}

tasks.named('runMapCompassCaptureClient') {
    dependsOn('prepareNeoForgeMapCompassCaptureRun')
    finalizedBy('verifyNeoForgeMapCompassCaptureClient')
}

tasks.register('prepareNeoForgeMultiplayerHarness') {
	group = 'ringworld verification'
	description = 'Creates clean, isolated NeoForge server and client-A/client-B multiplayer harness directories.'
	inputs.property('ringNeoForgeMultiplayerPort',
			neoForgeMultiplayerPort())
	inputs.property('ringMultiplayerPregenerateTerrainAtlas', neoForgeMultiplayerPregenerateTerrainAtlas)
	inputs.property('ringMultiplayerCircumferenceBlocks', neoForgeMultiplayerCircumferenceBlocks)
	inputs.property('ringMultiplayerWidthBlocks', neoForgeMultiplayerWidthBlocks)
	inputs.property('ringMultiplayerWallHeightBlocks', neoForgeMultiplayerWallHeightBlocks)
    outputs.dir(neoForgeMultiplayerRun)
    outputs.upToDateWhen { false }
    doLast {
        def port = neoForgeMultiplayerPort()
        def eula = new File(neoForgeMultiplayerServerRun, 'eula.txt')
        if (!eula.isFile()) {
            eula.parentFile.mkdirs()
            eula.text = '# Review https://aka.ms/MinecraftEULA before changing this value.\neula=false\n'
        }
        if (!eula.text.readLines().any { it.trim() == 'eula=true' }) {
            throw new GradleException("Review ${eula}, then set eula=true to run this disposable server")
        }
        // The harness is fully disposable and subproject-local. Do not touch
        // the root Fabric run-multiplayer directory or any user save. Keep a
        // previously accepted EULA file, though: launching the server again
        // must not silently discard that explicit acknowledgement.
        [new File(neoForgeMultiplayerServerRun, 'world'),
         new File(neoForgeMultiplayerServerRun, 'logs'),
         new File(neoForgeMultiplayerServerRun, 'ringworld-cache'),
         new File(neoForgeMultiplayerServerRun, 'crash-reports'),
         new File(neoForgeMultiplayerClientARun, 'logs'),
         new File(neoForgeMultiplayerClientARun, 'screenshots'),
         new File(neoForgeMultiplayerClientARun, 'ringworld-cache'),
         new File(neoForgeMultiplayerClientARun, 'crash-reports'),
         new File(neoForgeMultiplayerClientBRun, 'logs'),
         new File(neoForgeMultiplayerClientBRun, 'screenshots'),
         new File(neoForgeMultiplayerClientBRun, 'ringworld-cache'),
         new File(neoForgeMultiplayerClientBRun, 'crash-reports')].each { delete(it) }
        [neoForgeMultiplayerServerRun, neoForgeMultiplayerClientARun,
         neoForgeMultiplayerClientBRun].each { it.mkdirs() }

        // The automated clients do not need NeoForge's separate early splash.
        // Disabling only that window avoids a GLFW primary-monitor failure
        // when the disposable graphical fixture starts after macOS display
        // sleep; Minecraft's real client window and renderer still run.
        [neoForgeMultiplayerClientARun, neoForgeMultiplayerClientBRun].each { clientRun ->
            def fmlConfig = new File(clientRun, 'config/fml.toml')
            fmlConfig.parentFile.mkdirs()
            fmlConfig.text = '# Automated multiplayer fixture: disable only the separate early splash.\nearlyWindowControl = false\n'
        }

        def configDirectory = new File(neoForgeMultiplayerServerRun, 'config')
        configDirectory.mkdirs()
        new File(configDirectory, 'ringworld.properties').text = """\
widthBlocks=${neoForgeMultiplayerWidthBlocks}
circumferenceBlocks=${neoForgeMultiplayerCircumferenceBlocks}
wallHeightBlocks=${neoForgeMultiplayerWallHeightBlocks}
testMode=false
testViewDistanceChunks=2
pregenerateTerrainAtlas=${neoForgeMultiplayerPregenerateTerrainAtlas.get().toBoolean() ? 'true' : 'false'}
"""

        def serverProperties = new Properties()
        serverProperties.setProperty('server-port', Integer.toString(port))
        serverProperties.setProperty('online-mode', 'false')
        serverProperties.setProperty('gamemode', 'creative')
        serverProperties.setProperty('difficulty', 'normal')
        serverProperties.setProperty('level-name', 'world')
        serverProperties.setProperty('level-seed', '-2162056627494116761')
        serverProperties.setProperty('view-distance', '5')
        serverProperties.setProperty('simulation-distance', '5')
        serverProperties.setProperty('pause-when-empty-seconds', '-1')
        serverProperties.setProperty('motd', 'RingWorld NeoForge automated multiplayer harness')
        new File(neoForgeMultiplayerServerRun, 'server.properties').withOutputStream {
            serverProperties.store(it, 'Disposable RingWorld NeoForge multiplayer harness')
        }

        logger.lifecycle('[neoforge-multiplayer] prepared isolated server/client runs at {} on port {}',
                neoForgeMultiplayerRun, port)
    }
}

tasks.register('verifyNeoForgeMultiplayerHarness') {
    group = 'ringworld verification'
    description = 'Fails unless the isolated NeoForge two-client seam matrix completed successfully.'
    doLast {
        def serverLog = new File(neoForgeMultiplayerServerRun, 'logs/latest.log')
        def clientALog = new File(neoForgeMultiplayerClientARun, 'logs/latest.log')
        def clientBLog = new File(neoForgeMultiplayerClientBRun, 'logs/latest.log')
        def serverText = serverLog.isFile() ? serverLog.text : ''
        def clientAText = clientALog.isFile() ? clientALog.text : ''
        def clientBText = clientBLog.isFile() ? clientBLog.text : ''
        if (!serverText.contains('[multiplayer] full scenario result=true')
                || serverText.contains('[multiplayer] full scenario result=false')) {
            throw new GradleException("NeoForge multiplayer server matrix did not pass; inspect ${serverLog}")
        }
        if (!serverText.contains('[multiplayer-extended] ordinary Nether portal wait result=true')
                || !serverText.contains('[multiplayer-extended] multi-lap Nether portal routing result=true')
                || !serverText.contains('[multiplayer-extended] seam thunder/lightning result=true')) {
            throw new GradleException("NeoForge multiplayer portal-delay/weather evidence is incomplete; inspect ${serverLog}")
        }
		if (!serverText.contains('[multiplayer] bidirectional seam placement result=true')) {
			throw new GradleException("NeoForge multiplayer bidirectional placement evidence is incomplete; inspect ${serverLog}")
		}
		[[clientALog, clientAText], [clientBLog, clientBText]].each { entry ->
			if (!entry[1].contains('forward seam placement result=true')
					|| !entry[1].contains('reverse seam placement result=true')) {
				throw new GradleException("NeoForge multiplayer client placement evidence is incomplete; inspect ${entry[0]}")
			}
		}
		if (!serverText.contains('[multiplayer-extended] double chest prepared')
				|| !serverText.contains('highSize=54, lowSize=54')
				|| !serverText.contains('lowAliasSame=true, highAliasSame=true')
				|| !serverText.contains('[multiplayer-extended] alias block-entity recovery policy result=true')) {
			throw new GradleException("NeoForge multiplayer seam double-chest evidence is incomplete; inspect ${serverLog}")
		}
		['extended-fixture-before', 'extended-fixture-after', 'nether-returned',
		 'end-returned', 'weather-stability-ready', 'terminal-result'].each { phase ->
			if (!serverText.contains("[multiplayer-cold] phase=${phase}")) {
				throw new GradleException("NeoForge multiplayer cold-phase telemetry is missing ${phase}; inspect ${serverLog}")
			}
		}
		if (serverText.contains('post-End weather stability timed out')) {
			throw new GradleException("NeoForge multiplayer post-End stability barrier timed out; inspect ${serverLog}")
		}
        [
                [clientALog, clientAText, '[multiplayer:A] client world fully loaded'],
                [clientBLog, clientBText, '[multiplayer:B] client world fully loaded'],
                [clientALog, clientAText, '[multiplayer:A] local scenario result=true; stopping client'],
                [clientBLog, clientBText, '[multiplayer:B] local scenario result=true; stopping client']
        ].each { entry ->
            if (!entry[1].contains(entry[2])) {
                throw new GradleException("NeoForge multiplayer client did not complete startup; inspect ${entry[0]}")
            }
        }
        [
                new File(neoForgeMultiplayerClientARun, 'screenshots/ringworld-multiplayer-a.png'),
                new File(neoForgeMultiplayerClientBRun, 'screenshots/ringworld-multiplayer-b.png'),
                new File(neoForgeMultiplayerClientARun, 'screenshots/ringworld-multiplayer-weather-a.png'),
                new File(neoForgeMultiplayerClientBRun, 'screenshots/ringworld-multiplayer-weather-b.png')
		].each { screenshot ->
            if (!screenshot.isFile()) {
                throw new GradleException("NeoForge multiplayer harness is missing ${screenshot}")
            }
		}
		if (neoForgeMultiplayerPregenerateTerrainAtlas.get().toBoolean()) {
			def samples = []
			def matcher = (serverText =~ /RingWorld terrain atlas progress: (\d+)\/(\d+) cells \([^)]*\), generation (\w+)/)
			matcher.each { match ->
				samples << [match[1].toLong(), match[2].toLong(), match[3]]
			}
			if (samples.isEmpty()) {
				throw new GradleException("NeoForge multiplayer atlas gate found no atlas progress or completion status; inspect ${serverLog}")
			}
			long previousCells = -1L
			long totalCells = -1L
			boolean advanced = false
			for (sample in samples) {
				long presentCells = sample[0]
				long sampleTotal = sample[1]
				if (sample[2] in ['failed', 'cancelled']) {
					throw new GradleException("NeoForge multiplayer atlas generation did not remain healthy; inspect ${serverLog}")
				}
				if (sampleTotal <= 0L || presentCells < 0L || presentCells > sampleTotal) {
					throw new GradleException("NeoForge multiplayer atlas status is invalid; inspect ${serverLog}")
				}
				if (sampleTotal != neoForgeMultiplayerAtlasCellCount) {
					throw new GradleException("NeoForge multiplayer atlas total ${sampleTotal} does not match "
							+ "the configured geometry's expected ${neoForgeMultiplayerAtlasCellCount} cells; inspect ${serverLog}")
				}
				if (totalCells != -1L && sampleTotal != totalCells) {
					throw new GradleException("NeoForge multiplayer atlas total changed during one disposable run; inspect ${serverLog}")
				}
				if (previousCells != -1L && presentCells < previousCells) {
					throw new GradleException("NeoForge multiplayer atlas progress regressed; inspect ${serverLog}")
				}
				if (previousCells != -1L && presentCells > previousCells) advanced = true
				previousCells = presentCells
				totalCells = sampleTotal
			}
			if (!advanced) {
				throw new GradleException("NeoForge multiplayer atlas gate did not observe increasing atlas progress; inspect ${serverLog}")
			}
		}
		logger.lifecycle('[neoforge-multiplayer] verified full server and client-A/client-B seam matrix')
    }
}

tasks.register('prepareNeoForgeStrongholdTestWorld') {
    group = 'ringworld verification'
    description = 'Creates or resumes the disposable NeoForge guaranteed-structure world.'
    inputs.property('ringStrongholdTestSeed',
            providers.gradleProperty('ringStrongholdTestSeed').orElse('ringworld-regression-0'))
    inputs.property('ringStrongholdTestCircumference',
            providers.gradleProperty('ringStrongholdTestCircumference').orElse('16384'))
    inputs.property('ringStrongholdTestWidth',
            providers.gradleProperty('ringStrongholdTestWidth').orElse('256'))
    inputs.property('ringStrongholdTestWallHeight',
            providers.gradleProperty('ringStrongholdTestWallHeight').orElse('160'))
    inputs.property('ringStrongholdTestResume',
            providers.gradleProperty('ringStrongholdTestResume').orElse('false'))
    inputs.property('ringWorldgenMatrix',
            providers.gradleProperty('ringWorldgenMatrix').orElse('false'))
    outputs.upToDateWhen { false }
    doLast {
        def eula = new File(neoForgeStrongholdTestRun, 'eula.txt')
        if (!eula.isFile()) {
            eula.parentFile.mkdirs()
            eula.text = '# Review https://aka.ms/MinecraftEULA before changing this value.\neula=false\n'
        }
        if (!eula.isFile() || !eula.text.readLines().any { it.trim() == 'eula=true' }) {
            throw new GradleException("Review ${eula}, then set eula=true to run this disposable server")
        }
        def resume = providers.gradleProperty('ringStrongholdTestResume').orElse('false').get().toBoolean()
        if (resume && !new File(neoForgeStrongholdTestRun, 'world/level.dat').isFile()) {
            throw new GradleException('-PringStrongholdTestResume=true requires the existing disposable NeoForge world')
        }
        if (!resume) delete(new File(neoForgeStrongholdTestRun, 'world'))
        delete(new File(neoForgeStrongholdTestRun, 'logs/latest.log'))

        def propertiesFile = new File(neoForgeStrongholdTestRun, 'server.properties')
        def properties = new Properties()
        if (propertiesFile.isFile()) propertiesFile.withInputStream { properties.load(it) }
        properties.setProperty('level-seed',
                providers.gradleProperty('ringStrongholdTestSeed').orElse('ringworld-regression-0').get())
        properties.setProperty('level-name', 'world')
        properties.setProperty('online-mode', 'false')
        properties.setProperty('server-port', '0')
        propertiesFile.parentFile.mkdirs()
        propertiesFile.withOutputStream { properties.store(it, 'Disposable RingWorld NeoForge stronghold test') }

        def configFile = new File(neoForgeStrongholdTestRun, 'config/ringworld.properties')
        def config = new Properties()
        if (configFile.isFile()) configFile.withInputStream { config.load(it) }
        config.setProperty('circumferenceBlocks',
                providers.gradleProperty('ringStrongholdTestCircumference').orElse('16384').get())
        config.setProperty('widthBlocks',
                providers.gradleProperty('ringStrongholdTestWidth').orElse('256').get())
        config.setProperty('wallHeightBlocks',
                providers.gradleProperty('ringStrongholdTestWallHeight').orElse('160').get())
        config.setProperty('pregenerateTerrainAtlas', 'false')
        config.setProperty('requestOceanMonument',
                Integer.parseInt(config.getProperty('widthBlocks')) >= 160 ? 'true' : 'false')
        configFile.parentFile.mkdirs()
        configFile.withOutputStream { config.store(it, 'Disposable RingWorld NeoForge stronghold test') }
    }
}

