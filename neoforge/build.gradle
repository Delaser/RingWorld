tasks.register('prepareCopiedNeoForgeLayoutSwitchWorlds') {
    group = 'ringworld verification'
    description = 'Copies two distinct NeoForge source saves into the isolated layout-switch run directory.'
    inputs.property('ringNeoForgeLayoutSwitchFirstSource',
            providers.gradleProperty('ringNeoForgeLayoutSwitchFirstSource').orElse(''))
    inputs.property('ringNeoForgeLayoutSwitchSecondSource',
            providers.gradleProperty('ringNeoForgeLayoutSwitchSecondSource').orElse(''))
    inputs.property('ringNeoForgeLayoutSwitchFirstDestination',
            providers.gradleProperty('ringNeoForgeLayoutSwitchFirstDestination')
                    .orElse('RingWorld NeoForge Layout A'))
    inputs.property('ringNeoForgeLayoutSwitchSecondDestination',
            providers.gradleProperty('ringNeoForgeLayoutSwitchSecondDestination')
                    .orElse('RingWorld NeoForge Layout B'))
    outputs.dir(neoForgeLayoutSwitchSaves)
    outputs.upToDateWhen { false }
    doLast {
        def copies = [
                [providers.gradleProperty('ringNeoForgeLayoutSwitchFirstSource').orElse('').get(),
                 providers.gradleProperty('ringNeoForgeLayoutSwitchFirstDestination')
                         .orElse('RingWorld NeoForge Layout A').get(),
                 'ringNeoForgeLayoutSwitchFirstSource', 'ringNeoForgeLayoutSwitchFirstDestination'],
                [providers.gradleProperty('ringNeoForgeLayoutSwitchSecondSource').orElse('').get(),
                 providers.gradleProperty('ringNeoForgeLayoutSwitchSecondDestination')
                         .orElse('RingWorld NeoForge Layout B').get(),
                 'ringNeoForgeLayoutSwitchSecondSource', 'ringNeoForgeLayoutSwitchSecondDestination']
        ]
        def destinations = [] as Set
        delete(new File(neoForgeLayoutSwitchRun, 'screenshots'))
        delete(new File(neoForgeLayoutSwitchRun, 'ringworld-cache'))
        delete(new File(neoForgeLayoutSwitchRun, 'logs'))
        copies.each { copySpec ->
            def sourceId = checkedProjectionSaveId(copySpec[0], copySpec[2])
            def destinationId = checkedProjectionSaveId(copySpec[1], copySpec[3])
            if (!destinations.add(destinationId)) {
                throw new GradleException('NeoForge layout-switch destinations must be distinct')
            }
            def source = new File(neoForgeProjectionSourceSaves, sourceId)
            if (!new File(source, 'level.dat').isFile()) {
                throw new GradleException("${copySpec[2]} must name a save under ${neoForgeProjectionSourceSaves}: ${sourceId}")
            }
            def destination = new File(neoForgeLayoutSwitchSaves, destinationId)
            delete(destination)
            copy {
                from(source)
                into(destination)
            }
            if (!new File(destination, 'level.dat').isFile()) {
                throw new GradleException("copied NeoForge layout-switch save is missing level.dat: ${destination}")
            }
            logger.lifecycle('[neoforge-layout-switch] copied source={} destination={}', source, destination)
        }
    }
}

tasks.register('verifyNeoForgeLayoutSwitchClient') {
    group = 'ringworld verification'
    description = 'Fails unless the NeoForge same-process layout switch clears and restores client state.'
    mustRunAfter('runLayoutSwitchClient')
    doLast {
        def logFile = new File(neoForgeLayoutSwitchRun, 'logs/latest.log')
        def log = logFile.isFile() ? logFile.text : ''
        if (!log.contains('[layout-switch] result-json={"passed":true,')
                || log.contains('[layout-switch] result-json={"passed":false,')) {
            throw new GradleException("NeoForge layout-switch client did not pass; inspect ${logFile}")
        }
        [
                providers.gradleProperty('ringNeoForgeLayoutSwitchFirstDestination')
                        .orElse('RingWorld NeoForge Layout A').get(),
                providers.gradleProperty('ringNeoForgeLayoutSwitchSecondDestination')
                        .orElse('RingWorld NeoForge Layout B').get()
        ].each { destinationId ->
            def destination = new File(neoForgeLayoutSwitchSaves,
                    checkedProjectionSaveId(destinationId, 'ringNeoForgeLayoutSwitchDestination'))
            if (!new File(destination, 'level.dat').isFile()) {
                throw new GradleException("NeoForge layout-switch output is missing level.dat: ${destination}")
            }
        }
    }
}

