def createCompatOuterJarSha256 = 'ef87fe5709f1ba1f5b8bb20a2925b5afb4669e178fd6d8bf10c167759eefe37a'
def createCompatFlywheelNestedPath = 'META-INF/jarjar/flywheel-neoforge-1.21.1-1.0.6.jar'
def createCompatFlywheelShaderHashes = [
        'assets/flywheel/flywheel/internal/indirect/cull.glsl':
                'd4fe4fb66dd389f2e414cbc787fa58c1d723b1c6bf374a95f680336e7acc3d48',
        'assets/flywheel/flywheel/internal/indirect/main.vert':
                'ad1ceedaf430b078dea6e3555639979922717b0001e7a9e0481599bd3be4cd44',
        'assets/flywheel/flywheel/internal/instancing/main.vert':
                '7be34310b320b5f04943c2db4ca8efdf965afba87e141e33709cef4f579c3ae4',
        'assets/flywheel/flywheel/internal/common.vert':
                '4d9ab62a7da527c7f4727be9f128fd685e951317ac63f4308069d8036984d701'
]
def sha256OfBytes = { byte[] input ->
    def digest = java.security.MessageDigest.getInstance('SHA-256')
    digest.update(input)
    digest.digest().encodeHex().toString()
}
def sha256OfFile = { File inputFile ->
    def digest = java.security.MessageDigest.getInstance('SHA-256')
    inputFile.withInputStream { input ->
        byte[] buffer = new byte[64 * 1024]
        int count
        while ((count = input.read(buffer)) != -1) {
            if (count > 0) digest.update(buffer, 0, count)
        }
    }
    digest.digest().encodeHex().toString()
}

tasks.register('verifyCreateCompatibilityDependencyIsolation') {
    group = 'ringworld verification'
    description = 'Fails unless exact Create compile inputs and the isolated outer runtime jar remain bounded.'
    doLast {
        def createCoordinates = 'maven.modrinth:create:' + rootProject.create_version
        def flywheelCoordinates = 'dev.engine-room.flywheel:flywheel-neoforge-1.21.1:' +
                rootProject.flywheel_version
        def compileOnlyDependencies = configurations.compileOnly.dependencies.findAll {
            it.group in ['maven.modrinth', 'dev.engine-room.flywheel']
        }
        def compileOnlyCoordinates = compileOnlyDependencies.collect {
            "${it.group}:${it.name}:${it.version}"
        } as Set
        if (compileOnlyCoordinates != [createCoordinates, flywheelCoordinates] as Set
                || compileOnlyDependencies.any { it.transitive }) {
            throw new GradleException(
                    "Create compatibility compile inputs must be exactly two non-transitive modules: "
                            + compileOnlyCoordinates)
        }

        def customDependencies = createCompatRuntime.dependencies.collect {
            "${it.group}:${it.name}:${it.version}"
        }
        if (customDependencies != [createCoordinates]
                || createCompatRuntime.extendsFrom
                || createCompatRuntime.dependencies.any { it.transitive }) {
            throw new GradleException(
                    "createCompatRuntime must contain only the non-transitive outer Create module: "
                            + customDependencies)
        }

        def compatibilityGroups = ['maven.modrinth', 'dev.engine-room.flywheel',
                                   'net.createmod.ponder', 'com.tterrag.registrate'] as Set
        def moduleCoordinates = { Configuration configuration ->
            configuration.incoming.resolutionResult.allComponents.collect { component ->
                def module = component.moduleVersion
                module == null ? null : "${module.group}:${module.name}:${module.version}"
            }.findAll { it != null }
        }
        def ordinaryRuntimeCompatibility = moduleCoordinates(configurations.runtimeClasspath)
                .findAll { coordinate -> compatibilityGroups.contains(coordinate.split(':', 2)[0]) }
        if (!ordinaryRuntimeCompatibility.isEmpty()) {
            throw new GradleException(
                    "ordinary NeoForge runtimeClasspath leaked Create compatibility modules: "
                            + ordinaryRuntimeCompatibility)
        }

        def compileCompatibility = moduleCoordinates(configurations.compileClasspath)
                .findAll { coordinate -> compatibilityGroups.contains(coordinate.split(':', 2)[0]) }
        if (compileCompatibility as Set != [createCoordinates, flywheelCoordinates] as Set) {
            throw new GradleException(
                    "Create compatibility compile graph is not the exact non-transitive pair: "
                            + compileCompatibility)
        }

        def runtimeArtifacts = createCompatRuntime.resolvedConfiguration.resolvedArtifacts
        if (runtimeArtifacts.size() != 1) {
            throw new GradleException(
                    "createCompatRuntime must resolve one outer jar, found ${runtimeArtifacts}")
        }
        def artifact = runtimeArtifacts.first()
        def coordinates = "${artifact.moduleVersion.id.group}:${artifact.name}:" +
                artifact.moduleVersion.id.version
        if (coordinates != createCoordinates || !artifact.file.name.endsWith('.jar')) {
            throw new GradleException(
                    "createCompatRuntime resolved an unexpected artifact: ${coordinates} ${artifact.file}")
        }
        def sha256 = sha256OfFile(artifact.file)
        if (sha256 != createCompatOuterJarSha256) {
            throw new GradleException(
                    "Create compatibility outer jar SHA-256 mismatch: ${sha256}")
        }
        byte[] nestedFlywheel
        def outerZip = new java.util.zip.ZipFile(artifact.file)
        try {
            def nestedEntry = outerZip.getEntry(createCompatFlywheelNestedPath)
            if (nestedEntry == null) {
                throw new GradleException(
                        "Create outer jar is missing ${createCompatFlywheelNestedPath}")
            }
            nestedFlywheel = outerZip.getInputStream(nestedEntry).withCloseable { it.readAllBytes() }
        } finally {
            outerZip.close()
        }
        def actualShaderHashes = [:]
        new java.util.zip.ZipInputStream(new ByteArrayInputStream(nestedFlywheel)).withCloseable { nestedZip ->
            java.util.zip.ZipEntry entry
            while ((entry = nestedZip.nextEntry) != null) {
                if (!entry.directory && createCompatFlywheelShaderHashes.containsKey(entry.name)) {
                    actualShaderHashes[entry.name] = sha256OfBytes(nestedZip.readAllBytes())
                }
            }
        }
        if (actualShaderHashes != createCompatFlywheelShaderHashes) {
            throw new GradleException(
                    "Nested Flywheel shader inventory/hash mismatch: ${actualShaderHashes}")
        }
        logger.lifecycle(
                '[create-compat-dependencies] PASS compile={} runtime={} sha256={} flywheelShaders={}',
                compileCompatibility.sort(), coordinates, sha256, actualShaderHashes)
    }
}

tasks.named('check') {
    dependsOn(tasks.named('verifyCreateCompatibilityDependencyIsolation'))
}

tasks.named('build') {
    dependsOn(tasks.named('verifyCreateCompatibilityDependencyIsolation'))
}

def prepareCreateCompatibilityServer = { File runDirectory, boolean includeCreate ->
    def eula = new File(runDirectory, 'eula.txt')
    if (!eula.isFile()) {
        eula.parentFile.mkdirs()
        eula.text = '# Review https://aka.ms/MinecraftEULA before changing this value.\neula=false\n'
    }
    if (!eula.text.readLines().any { it.trim() == 'eula=true' }) {
        throw new GradleException("Review ${eula}, then set eula=true to run this disposable server")
    }

    ['world', 'logs', 'ringworld-cache', 'crash-reports', 'mods'].each {
        delete(new File(runDirectory, it))
    }
    runDirectory.mkdirs()
    def configFile = new File(runDirectory, 'config/ringworld.properties')
    configFile.parentFile.mkdirs()
    def config = new Properties()
    config.setProperty('widthBlocks', '416')
    config.setProperty('circumferenceBlocks', '2048')
    config.setProperty('wallHeightBlocks', '160')
    config.setProperty('testMode', 'false')
    config.setProperty('testViewDistanceChunks', '2')
    config.setProperty('pregenerateTerrainAtlas', 'false')
    configFile.withOutputStream { config.store(it, 'Disposable NeoForge Create compatibility boot') }

    def serverProperties = new Properties()
    serverProperties.setProperty('online-mode', 'false')
    serverProperties.setProperty('level-name', 'world')
    serverProperties.setProperty('level-seed', '-2162056627494116761')
    serverProperties.setProperty('view-distance', '3')
    serverProperties.setProperty('simulation-distance', '3')
    serverProperties.setProperty('pause-when-empty-seconds', '-1')
    serverProperties.setProperty('motd', 'RingWorld disposable Create compatibility boot')
    new File(runDirectory, 'server.properties').withOutputStream {
        serverProperties.store(it, 'Disposable NeoForge Create compatibility boot')
    }

    if (includeCreate) {
        def createFiles = createCompatRuntime.resolve()
        if (createFiles.size() != 1) {
            throw new GradleException("Create compatibility runtime must resolve exactly one outer jar, found ${createFiles}")
        }
        def createJar = createFiles.first()
        def sha256 = sha256OfFile(createJar)
        if (sha256 != createCompatOuterJarSha256) {
            throw new GradleException("Create compatibility outer jar SHA-256 mismatch: ${sha256}")
        }
        copy {
            from(createJar)
            into(new File(runDirectory, 'mods'))
        }
    }
}

