            providers.gradleProperty('ringStrongholdTestWidth').orElse('256'))
    inputs.property('ringStrongholdTestWallHeight',
            providers.gradleProperty('ringStrongholdTestWallHeight').orElse('160'))
    inputs.property('ringStrongholdTestResume',
            providers.gradleProperty('ringStrongholdTestResume').orElse('false'))
    inputs.property('ringWorldgenMatrix',
            providers.gradleProperty('ringWorldgenMatrix').orElse('false'))
    outputs.upToDateWhen { false }
    doLast {
