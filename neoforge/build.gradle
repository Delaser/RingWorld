def prepareCreateCompatibilityClient = { File runDirectory, boolean backendOff ->
    ['saves', 'screenshots', 'ringworld-cache', 'logs', 'crash-reports', 'mods',
     'capture-manifest.json'].each {
        delete(new File(runDirectory, it))
    }
    runDirectory.mkdirs()
    def configDirectory = new File(runDirectory, 'config')
    configDirectory.mkdirs()
    new File(configDirectory, 'ringworld.properties').text = '''\
widthBlocks=416
circumferenceBlocks=2048
wallHeightBlocks=160
testMode=false
testViewDistanceChunks=8
pregenerateTerrainAtlas=false
'''
    new File(configDirectory, 'flywheel-client.toml').text =
            "backend = \"${backendOff ? 'flywheel:off' : 'DEFAULT'}\"\n"
    new File(configDirectory, 'fml.toml').text =
            '# Automated graphical capture: disable only the separate early splash.\nearlyWindowControl = false\n'
    new File(runDirectory, 'options.txt').text = '''\
onboardAccessibility:false
pauseOnLostFocus:false
renderClouds:"false"
graphicsMode:1
'''
    def createFiles = createCompatRuntime.resolve()
    if (createFiles.size() != 1) {
        throw new GradleException("Create compatibility runtime must resolve exactly one outer jar, found ${createFiles}")
    }
    def createJar = createFiles.first()
    if (sha256OfFile(createJar) != createCompatOuterJarSha256) {
        throw new GradleException('Create compatibility client source jar SHA-256 mismatch')
    }
    copy {
        from(createJar)
        into(new File(runDirectory, 'mods'))
    }
    if (backendOff) {
        def sourceWorld = new File(neoForgeCreateCompatDefaultClientRun,
                'saves/RingWorld Create Compatibility')
        if (!sourceWorld.isDirectory()) {
            throw new GradleException("Default Create compatibility durable world is missing: ${sourceWorld}")
        }
        def destinationWorld = new File(runDirectory,
                'saves/RingWorld Create Compatibility')
        copy { from(sourceWorld); into(destinationWorld) }
        def sourceFiles = fileTree(sourceWorld).files.findAll { it.isFile() }.sort { it.path }
        def destinationFiles = fileTree(destinationWorld).files.findAll { it.isFile() }.sort { it.path }
        def sourceHashes = sourceFiles.collectEntries {
            [(sourceWorld.toPath().relativize(it.toPath()).toString()): sha256OfFile(it)]
        }
        def destinationHashes = destinationFiles.collectEntries {
            [(destinationWorld.toPath().relativize(it.toPath()).toString()): sha256OfFile(it)]
        }
        if (sourceHashes != destinationHashes || sourceHashes.isEmpty()) {
            throw new GradleException('Create compatibility OFF world copy is not byte-identical')
        }
        new File(runDirectory, 'world-copy-provenance.txt').text =
                "source=${sourceWorld.canonicalPath}\nfiles=${sourceHashes.size()}\n" +
                sourceHashes.collect { path, hash -> "${hash}  ${path}" }.join('\n') + '\n'
    }
}

