        }
        def resume = providers.gradleProperty('ringStrongholdTestResume').orElse('false').get().toBoolean()
        if (resume && !new File(neoForgeStrongholdTestRun, 'world/level.dat').isFile()) {
            throw new GradleException('-PringStrongholdTestResume=true requires the existing disposable NeoForge world')
        }
        if (!resume) delete(new File(neoForgeStrongholdTestRun, 'world'))
        delete(new File(neoForgeStrongholdTestRun, 'logs/latest.log'))

        def propertiesFile = new File(neoForgeStrongholdTestRun, 'server.properties')
