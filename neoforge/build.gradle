tasks.register('verifyNeoForgeProductionLifecycleClient') {
    group = 'ringworld verification'
    description = 'Fails unless the NeoForge production dimension and reopen lifecycle passes.'
    mustRunAfter('runProductionLifecycleClient')
    doLast {
        def logFile = new File(neoForgeProductionLifecycleRun, 'logs/latest.log')
        def log = logFile.isFile() ? logFile.text : ''
        if (!log.contains('[production-lifecycle] result=true')
                || log.contains('[production-lifecycle] result=false')) {
            throw new GradleException("NeoForge production lifecycle did not pass; inspect ${logFile}")
        }
        def destinationId = checkedProjectionSaveId(
                providers.gradleProperty('ringNeoForgeProductionLifecycleDestination')
                        .orElse('RingWorld NeoForge Production Lifecycle').get(),
                'ringNeoForgeProductionLifecycleDestination')
        def destination = new File(neoForgeProductionLifecycleSaves, destinationId)
        if (!new File(destination, 'level.dat').isFile()) {
            throw new GradleException("NeoForge lifecycle output is missing level.dat: ${destination}")
        }
    }
}

tasks.named('runProductionProjectionClient') {
    dependsOn('prepareCopiedNeoForgeProductionProjectionWorld')
    finalizedBy('verifyNeoForgeProductionProjectionClient')
}

tasks.named('runProductionVisualParityClient') {
    dependsOn('prepareCopiedNeoForgeProductionVisualParityWorld')
    finalizedBy('verifyNeoForgeProductionVisualParityClient')
}

tasks.named('runLayoutSwitchClient') {
    dependsOn('prepareCopiedNeoForgeLayoutSwitchWorlds')
    finalizedBy('verifyNeoForgeLayoutSwitchClient')
}

tasks.named('runProductionLifecycleClient') {
    dependsOn('prepareCopiedNeoForgeProductionLifecycleWorld')
    finalizedBy('verifyNeoForgeProductionLifecycleClient')
}
