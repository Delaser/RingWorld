def verifyCreateCompatibilityClient = { File runDirectory, boolean backendOff ->
    def logFile = new File(runDirectory, 'logs/latest.log')
    def log = logFile.isFile() ? logFile.text : ''
    def expectedResult = backendOff
            ? '[create-compat-client] result=true off vanillaFallback=true flywheelEmbedding=zero durable=true backend=flywheel:off'
            : '[create-compat-client] result=true default realClicks=both-directions preview=both-charts transfer=true durable=true controllerCharts=both backend='
    if (!log.contains(expectedResult)
            || !log.contains('attachedReads=') || !log.contains('detachedReads=')
            || !log.contains('curvedEmbeddingTransforms=')
            || !log.contains('nonFiniteMatrices=0')
            || log.contains('[create-compat-client] result=false')) {
        throw new GradleException("Create compatibility client qualification failed; inspect ${logFile}")
    }
    if (backendOff && !log.contains('backend=flywheel:off')) {
        throw new GradleException("Create compatibility OFF client did not select flywheel:off; inspect ${logFile}")
    }
    if (backendOff && !log.contains('curvedEmbeddingTransforms=0')) {
        throw new GradleException("Create compatibility OFF client invoked the Flywheel embedding; inspect ${logFile}")
    }
    if (!backendOff && (!log.contains('high mounted route PASS uninterruptedTicks=40')
            || !log.contains('low mounted route distinct baseline')
            || !log.contains('low mounted route PASS uninterruptedTicks=40')
            || !log.contains('chart relocation range-exit only')
            || !log.contains('embedding finite=true')
            || !log.contains('durable reload canonicalNbt=true')
            || !log.contains('client controller chart=high')
            || !log.contains('client controller chart=low'))) {
        throw new GradleException("Create compatibility route/durable evidence is incomplete; inspect ${logFile}")
    }
    def captureDefinitions = backendOff
            ? [[name: 'ringworld-create-off-high-translucent.png', route: 'off-vanilla',
                direction: 'none', chart: 'high', state: 'opaque+translucent+static', targetOce: true],
               [name: 'ringworld-create-off-low-opaque.png', route: 'off-vanilla',
                direction: 'none', chart: 'low', state: 'opaque+translucent+static', targetOce: true]]
            : [[name: 'ringworld-create-default-high-opaque-translucent.png', route: 'high-static',
                direction: 'none', chart: 'high', state: 'opaque+translucent+static', targetOce: true],
               [name: 'ringworld-create-default-moving-high.png', route: 'high-mounted',
                direction: 'positive', chart: 'high', state: 'opaque+translucent+moving', targetOce: true],
               [name: 'ringworld-create-default-moving-low.png', route: 'low-mounted',
                direction: 'negative', chart: 'low', state: 'opaque+translucent+moving', targetOce: true],
               [name: 'ringworld-create-default-reopened-high.png', route: 'durable-controller',
                direction: 'none', chart: 'high', state: 'durable+gameplay', targetOce: false],
               [name: 'ringworld-create-default-reopened-low.png', route: 'durable-controller',
                direction: 'none', chart: 'low', state: 'durable+gameplay', targetOce: false]]
    def logLines = log.readLines()
    def resultLine = logLines.find { it.contains('[create-compat-client] result=true') }
    def backendMatch = resultLine =~ / backend=([^ ]+)/
    if (!backendMatch.find()) {
        throw new GradleException("Create compatibility backend identity is missing; inspect ${logFile}")
    }
    def backendIdentity = backendMatch.group(1)
    def manifestCaptures = captureDefinitions.collect { definition ->
        def name = definition.name
        def screenshot = new File(runDirectory, 'screenshots/' + name)
        if (!screenshot.isFile() || screenshot.length() == 0) {
            throw new GradleException("Create compatibility client screenshot is missing: ${screenshot}")
        }
        def proof = logLines.find {
            it.contains('[create-compat-client] capture-proof name=' + name[0..-5] + ' ')
        }
        def expectedMembership = definition.targetOce
                ? 'clientLevel=true renderMembership=true removed=false'
                : 'targetOce=none clientLevel=n/a renderMembership=n/a'
        if (proof == null || !proof.contains(expectedMembership)) {
            throw new GradleException(
                    "Create compatibility capture lacks target membership proof: ${name}")
        }
        [relativePath: runDirectory.toPath().relativize(screenshot.toPath()).toString(),
         absolutePath: screenshot.canonicalPath,
         sha256: sha256OfFile(screenshot),
         backend: backendIdentity,
         route: definition.route,
         direction: definition.direction,
         chart: definition.chart,
         state: definition.state,
         targetOceRequired: definition.targetOce,
         targetOcePresentInClientLevelAndRenderMembership: definition.targetOce ? true : null,
         proofLogLine: proof]
    }
    def rejectedCapture = new File(runDirectory,
            'screenshots/ringworld-create-default-moving-low-reentry.png')
    if (rejectedCapture.exists()) {
        throw new GradleException("Rejected replacement-identity capture was retained: ${rejectedCapture}")
    }
    new File(runDirectory, 'capture-manifest.json').text =
            groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson([
                    schema: 1,
                    runDirectory: runDirectory.canonicalPath,
                    backend: backendIdentity,
                    sourceLogRelativePath: runDirectory.toPath().relativize(logFile.toPath()).toString(),
                    sourceLogAbsolutePath: logFile.canonicalPath,
                    sourceLogSha256: sha256OfFile(logFile),
                    invalidCapturePolicy: 'fresh preparation deletes prior screenshots; replacement-identity low capture is forbidden',
                    captures: manifestCaptures
            ])) + '\n'
    def mods = new File(runDirectory, 'mods').listFiles()?.findAll { it.isFile() } ?: []
    if (mods.size() != 1 || sha256OfFile(mods.first()) != createCompatOuterJarSha256) {
        throw new GradleException("Create compatibility client runtime jar is not exact: ${mods}")
    }
    if (backendOff && !new File(runDirectory, 'world-copy-provenance.txt').isFile()) {
        throw new GradleException('Create compatibility OFF world-copy provenance is missing')
    }
}

