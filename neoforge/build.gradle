plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version "${moddevgradle_version}"
}

version = rootProject.mod_version
group = rootProject.maven_group

base {
    archivesName = rootProject.archives_base_name + '-neoforge'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
    withSourcesJar()
}

sourceSets.main.java.setSrcDirs([
        rootProject.file('src/main/java'),
        rootProject.file('src/client/java'),
        rootProject.file('src/platform/neoforge/java'),
        rootProject.file('src/platform/neoforgeClient/java')
])
sourceSets.main.resources.setSrcDirs([
        rootProject.file('src/main/resources'),
        rootProject.file('src/client/resources')
])
sourceSets.main.resources.exclude('fabric.mod.json')

// Run the same loader-neutral contract suite against the NeoForge-compiled
// common sources. Platform-specific runtime gates remain separate.
sourceSets.test.java.setSrcDirs([
        rootProject.file('src/test/java')
])
sourceSets.test.resources.setSrcDirs([
        rootProject.file('src/test/resources'),
        rootProject.file('src/main/resources')
])

neoForge {
    version = rootProject.neoforge_version

    runs {
        client {
            client()
            gameDirectory = project.file('run-client')
        }
        productionProjectionClient {
            client()
            gameDirectory = project.file('run-production-projection')
            systemProperty 'ringworld.captureRingProjection', 'true'
            systemProperty 'ringworld.projectionWorld', providers.gradleProperty('ringNeoForgeProjectionDestination')
                    .orElse('RingWorld NeoForge Projection').get()
            systemProperty 'ringworld.projectionViewDistanceChunks',
                    providers.gradleProperty('ringNeoForgeProjectionViewDistanceChunks').orElse('16').get()
            systemProperty 'ringworld.projectionEnvironment',
                    providers.gradleProperty('ringNeoForgeProjectionEnvironment').orElse('noon').get()
        }
        server {
            server()
            gameDirectory = project.file('run-server')
            programArgument '--nogui'
        }
    }

    mods {
        ringworld {
            sourceSet sourceSets.main
        }
    }

    unitTest {
        enable()
        testedMod = mods.ringworld
    }
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

def generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    inputs.properties([
        mod_version: project.version,
        minecraft_version: rootProject.minecraft_version,
        neoforge_version: rootProject.neoforge_version
    ])
    expand([
        mod_version: project.version,
        minecraft_version: rootProject.minecraft_version,
        neoforge_version: rootProject.neoforge_version
    ])
    from 'src/main/templates'
    into layout.buildDirectory.dir('generated/sources/modMetadata')
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.encoding = 'UTF-8'
}

tasks.named('test') {
    useJUnitPlatform()
}

tasks.withType(Jar).configureEach {
    from(rootProject.file('LICENSE')) {
        rename { 'LICENSE-RINGWORLD.txt' }
    }
}

def checkedProjectionSaveId = { String value, String propertyName ->
    def saveId = value == null ? '' : value.trim()
    if (saveId.isEmpty() || saveId == '.' || saveId == '..'
            || saveId.contains('/') || saveId.contains('\\')) {
        throw new GradleException("${propertyName} must be one save-directory name")
    }
    saveId
}

def neoForgeProjectionSourceSaves = project.file('run-client/saves')
def neoForgeProjectionRun = project.file('run-production-projection')
def neoForgeProjectionSaves = new File(neoForgeProjectionRun, 'saves')

tasks.register('prepareCopiedNeoForgeProductionProjectionWorld') {
    group = 'ringworld verification'
    description = 'Copies a NeoForge source save into the isolated projection-client run directory.'
    inputs.property('ringNeoForgeProjectionSource',
            providers.gradleProperty('ringNeoForgeProjectionSource').orElse('NeoForge Test'))
    inputs.property('ringNeoForgeProjectionDestination',
            providers.gradleProperty('ringNeoForgeProjectionDestination')
                    .orElse('RingWorld NeoForge Projection'))
    outputs.dir(neoForgeProjectionSaves)
    outputs.upToDateWhen { false }
    doLast {
        def sourceId = checkedProjectionSaveId(
                providers.gradleProperty('ringNeoForgeProjectionSource').orElse('NeoForge Test').get(),
                'ringNeoForgeProjectionSource')
        def destinationId = checkedProjectionSaveId(
                providers.gradleProperty('ringNeoForgeProjectionDestination')
                        .orElse('RingWorld NeoForge Projection').get(),
                'ringNeoForgeProjectionDestination')
        def source = new File(neoForgeProjectionSourceSaves, sourceId)
        if (!new File(source, 'level.dat').isFile()) {
            throw new GradleException(
                    "ringNeoForgeProjectionSource must name a save under ${neoForgeProjectionSourceSaves}: ${sourceId}")
        }
        def destination = new File(neoForgeProjectionSaves, destinationId)
        delete(destination)
        delete(new File(neoForgeProjectionRun, 'screenshots'))
        delete(new File(neoForgeProjectionRun, 'ringworld-cache'))
        delete(new File(neoForgeProjectionRun, 'logs'))
        copy {
            from(source)
            into(destination)
        }
        if (!new File(destination, 'level.dat').isFile()) {
            throw new GradleException("copied NeoForge projection save is missing level.dat: ${destination}")
        }
        logger.lifecycle('[neoforge-projection] copied source={} destination={}', source, destination)
    }
}

tasks.register('verifyNeoForgeProductionProjectionClient') {
    group = 'ringworld verification'
    description = 'Fails unless the NeoForge projection client completed all three captures.'
    mustRunAfter('runProductionProjectionClient')
    doLast {
        def logFile = new File(neoForgeProjectionRun, 'logs/latest.log')
        def log = logFile.isFile() ? logFile.text : ''
        if (!log.contains('[projection-capture] result=true, captures complete')) {
            throw new GradleException("NeoForge projection capture did not pass; inspect ${logFile}")
        }
        def environment = providers.gradleProperty('ringNeoForgeProjectionEnvironment')
                .orElse('noon').get().trim().toLowerCase(Locale.ROOT)
        def prefix = environment == 'noon' ? 'ringworld-projection-' : "ringworld-projection-${environment}-"
        ['tangent', 'handoff', 'up'].each { view ->
            def screenshot = new File(neoForgeProjectionRun, "screenshots/${prefix}${view}.png")
            if (!screenshot.isFile()) {
                throw new GradleException("NeoForge projection capture is missing ${screenshot}")
            }
        }
    }
}

tasks.named('runProductionProjectionClient') {
    dependsOn('prepareCopiedNeoForgeProductionProjectionWorld')
    finalizedBy('verifyNeoForgeProductionProjectionClient')
}
