                 'ringNeoForgeLayoutSwitchSecondSource', 'ringNeoForgeLayoutSwitchSecondDestination']
        ]
        def destinations = [] as Set
        delete(new File(neoForgeLayoutSwitchRun, 'screenshots'))
        delete(new File(neoForgeLayoutSwitchRun, 'ringworld-cache'))
        delete(new File(neoForgeLayoutSwitchRun, 'logs'))
        copies.each { copySpec ->
            def sourceId = checkedProjectionSaveId(copySpec[0], copySpec[2])
            def destinationId = checkedProjectionSaveId(copySpec[1], copySpec[3])
            if (!destinations.add(destinationId)) {
                throw new GradleException('NeoForge layout-switch destinations must be distinct')
            }
            def source = new File(neoForgeProjectionSourceSaves, sourceId)
            if (!new File(source, 'level.dat').isFile()) {
                throw new GradleException("${copySpec[2]} must name a save under ${neoForgeProjectionSourceSaves}: ${sourceId}")
            }
            def destination = new File(neoForgeLayoutSwitchSaves, destinationId)
            delete(destination)
            copy {
                from(source)
                into(destination)
            }
            if (!new File(destination, 'level.dat').isFile()) {
                throw new GradleException("copied NeoForge layout-switch save is missing level.dat: ${destination}")
            }
            logger.lifecycle('[neoforge-layout-switch] copied source={} destination={}', source, destination)
        }
    }
}

tasks.register('verifyNeoForgeLayoutSwitchClient') {
    group = 'ringworld verification'
    description = 'Fails unless the NeoForge same-process layout switch clears and restores client state.'
    mustRunAfter('runLayoutSwitchClient')
    doLast {
        def logFile = new File(neoForgeLayoutSwitchRun, 'logs/latest.log')
        def log = logFile.isFile() ? logFile.text : ''
        if (!log.contains('[layout-switch] result-json={"passed":true,')
                || log.contains('[layout-switch] result-json={"passed":false,')) {
            throw new GradleException("NeoForge layout-switch client did not pass; inspect ${logFile}")
        }
        def expectation = providers.gradleProperty('ringNeoForgeLayoutSwitchExpectation')
                .orElse('different-layout').get()
        if (!log.contains("[layout-switch] expectation=${expectation}")) {
            throw new GradleException(
                    "NeoForge layout-switch client did not run expected mode '${expectation}'; inspect ${logFile}")
        }
        [
                providers.gradleProperty('ringNeoForgeLayoutSwitchFirstDestination')
                        .orElse('RingWorld NeoForge Layout A').get(),
                providers.gradleProperty('ringNeoForgeLayoutSwitchSecondDestination')
                        .orElse('RingWorld NeoForge Layout B').get()
        ].each { destinationId ->
            def destination = new File(neoForgeLayoutSwitchSaves,
                    checkedProjectionSaveId(destinationId, 'ringNeoForgeLayoutSwitchDestination'))
            if (!new File(destination, 'level.dat').isFile()) {
                throw new GradleException("NeoForge layout-switch output is missing level.dat: ${destination}")
            }
        }
    }
}

tasks.register('prepareCopiedNeoForgeProductionLifecycleWorld') {
    group = 'ringworld verification'
    description = 'Copies a production NeoForge source save into the isolated lifecycle run directory.'
    inputs.property('ringNeoForgeProductionLifecycleSource',
            providers.gradleProperty('ringNeoForgeProductionLifecycleSource').orElse('NeoForge Test'))
    inputs.property('ringNeoForgeProductionLifecycleDestination',
            providers.gradleProperty('ringNeoForgeProductionLifecycleDestination')
                    .orElse('RingWorld NeoForge Production Lifecycle'))
    outputs.dir(neoForgeProductionLifecycleSaves)
    outputs.upToDateWhen { false }
    doLast {
        def sourceId = checkedProjectionSaveId(
                providers.gradleProperty('ringNeoForgeProductionLifecycleSource')
                        .orElse('NeoForge Test').get(),
                'ringNeoForgeProductionLifecycleSource')
        def destinationId = checkedProjectionSaveId(
                providers.gradleProperty('ringNeoForgeProductionLifecycleDestination')
                        .orElse('RingWorld NeoForge Production Lifecycle').get(),
                'ringNeoForgeProductionLifecycleDestination')
        def source = new File(neoForgeProjectionSourceSaves, sourceId)
        if (!new File(source, 'level.dat').isFile()) {
            throw new GradleException(
                    "ringNeoForgeProductionLifecycleSource must name a save under ${neoForgeProjectionSourceSaves}: ${sourceId}")
        }
        def destination = new File(neoForgeProductionLifecycleSaves, destinationId)
        delete(destination)
        delete(new File(neoForgeProductionLifecycleRun, 'screenshots'))
        delete(new File(neoForgeProductionLifecycleRun, 'ringworld-cache'))
        delete(new File(neoForgeProductionLifecycleRun, 'logs'))
        copy {
            from(source)
            into(destination)
        }
        if (!new File(destination, 'level.dat').isFile()) {
            throw new GradleException("copied NeoForge lifecycle save is missing level.dat: ${destination}")
        }
        logger.lifecycle('[neoforge-production-lifecycle] copied source={} destination={}', source, destination)
    }
}

tasks.register('verifyNeoForgeProductionLifecycleClient') {
    group = 'ringworld verification'
    description = 'Fails unless the NeoForge production dimension and reopen lifecycle passes.'
    mustRunAfter('runProductionLifecycleClient')
    doLast {
        def logFile = new File(neoForgeProductionLifecycleRun, 'logs/latest.log')
        def log = logFile.isFile() ? logFile.text : ''
        if (!log.contains('[production-lifecycle] result=true')
                || log.contains('[production-lifecycle] result=false')) {
