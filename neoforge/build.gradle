        .orElse('false')
def neoForgeMultiplayerHarnessDimension = { String propertyName, String defaultValue, int minimum, boolean chunkAligned ->
    def raw = providers.gradleProperty(propertyName).orElse(defaultValue).get().trim()
    int value
    try {
        value = Integer.parseInt(raw)
    } catch (NumberFormatException ignored) {
        throw new GradleException("${propertyName} must be a positive integer")
    }
    if (value < minimum) {
        throw new GradleException("${propertyName} must be at least ${minimum} blocks")
    }
    if (chunkAligned && value % 16 != 0) {
        throw new GradleException("${propertyName} must be divisible by 16 blocks")
    }
    value
}
// Mirror RingGeometry/RingWorldConfig's bootstrap constraints. The server
// still applies the full first-world dimension report before world creation.
def neoForgeMultiplayerCircumferenceBlocks = neoForgeMultiplayerHarnessDimension(
        'ringMultiplayerCircumferenceBlocks', '2048', 2048, true)
def neoForgeMultiplayerWidthBlocks = neoForgeMultiplayerHarnessDimension(
        'ringMultiplayerWidthBlocks', '416', 128, true)
def neoForgeMultiplayerWallHeightBlocks = neoForgeMultiplayerHarnessDimension(
        'ringMultiplayerWallHeightBlocks', '160', 32, false)
def neoForgeMultiplayerAtlasCellCount = (neoForgeMultiplayerCircumferenceBlocks.longValue() / 8L)
        * (neoForgeMultiplayerWidthBlocks.longValue() / 8L)

def neoForgeMultiplayerPort = {
    neoForgeRunPort('ringQualificationNeoForgeMultiplayerPort', 'ringNeoForgeMultiplayerPort', '25566')
}

tasks.register('prepareNeoForgeAtlasUiRun') {
    group = 'ringworld verification'
    description = 'Writes an isolated safe-small configuration for the NeoForge atlas-map GUI regression.'
    outputs.upToDateWhen { false }
    doLast {
        [new File(neoForgeAtlasUiRun, 'saves'), new File(neoForgeAtlasUiRun, 'screenshots'),
         new File(neoForgeAtlasUiRun, 'ringworld-cache'), new File(neoForgeAtlasUiRun, 'logs')].each { delete(it) }
        def configFile = new File(neoForgeAtlasUiRun, 'config/ringworld.properties')
        configFile.parentFile.mkdirs()
        def config = new Properties()
        config.setProperty('widthBlocks', '416')
        config.setProperty('circumferenceBlocks', '2048')
        config.setProperty('wallHeightBlocks', '160')
        config.setProperty('testMode', 'true')
        config.setProperty('testViewDistanceChunks', '6')
        config.setProperty('pregenerateTerrainAtlas', 'false')
        configFile.withOutputStream { config.store(it, 'Isolated NeoForge RingWorld atlas UI regression') }
        new File(neoForgeAtlasUiRun, 'options.txt').text = 'onboardAccessibility:false\nguiScale:4\n'
    }
}

tasks.register('verifyNeoForgeAtlasUiClient') {
    group = 'ringworld verification'
    description = 'Fails unless the isolated NeoForge GUI-scale-4 atlas-map client completed every required capture.'
    mustRunAfter('runAtlasUiClient')
    doLast {
        def logFile = new File(neoForgeAtlasUiRun, 'logs/latest.log')
        def log = logFile.isFile() ? logFile.text : ''
        if (!log.contains('[atlas-ui-test] PASS') || log.contains('[atlas-ui-test] FAIL')) {
            throw new GradleException("NeoForge atlas UI client did not pass; inspect ${logFile}")
        }
        (1..11).each { index ->
            def prefix = String.format('atlas-ui-%02d-', index)
            if (fileTree(new File(neoForgeAtlasUiRun, 'screenshots')).matching { include prefix + '*.png' }.isEmpty()) {
                throw new GradleException("NeoForge atlas UI client is missing screenshot ${prefix}*.png")
            }
        }
    }
}

tasks.named('runAtlasUiClient') {
    dependsOn('prepareNeoForgeAtlasUiRun')
    finalizedBy('verifyNeoForgeAtlasUiClient')
}

tasks.register('prepareNeoForgeCreationUiRun') {
    group = 'ringworld verification'
    description = 'Writes the isolated menu-only NeoForge creation-UI regression configuration.'
    outputs.upToDateWhen { false }
    doLast {
        ['saves', 'screenshots', 'ringworld-cache', 'logs'].each {
            delete(new File(neoForgeCreationUiRun, it))
        }
        def configFile = new File(neoForgeCreationUiRun, 'config/ringworld.properties')
        configFile.parentFile.mkdirs()
        def config = new Properties()
        config.setProperty('widthBlocks', '256')
        config.setProperty('circumferenceBlocks', '16384')
        config.setProperty('wallHeightBlocks', '160')
        config.setProperty('testMode', 'false')
        config.setProperty('testViewDistanceChunks', '6')
        config.setProperty('pregenerateTerrainAtlas', 'false')
        config.setProperty('requestOceanMonument', 'false')
        configFile.withOutputStream { config.store(it, 'Isolated NeoForge RingWorld creation UI regression') }

        // Keep Minecraft graphical. This disables only NeoForge's separate
        // early splash, which otherwise can fail to find a primary monitor.
        def fmlConfig = new File(neoForgeCreationUiRun, 'config/fml.toml')
        fmlConfig.text = '''# Automated creation UI fixture: disable only the separate early splash.
earlyWindowControl = false
disableConfigWatcher = false
maxThreads = -1
versionCheck = true
debugOpenGl = false
defaultConfigPath = "defaultconfigs"
disableOptimizedDFU = true
earlyWindowProvider = "fmlearlywindow"
earlyWindowWidth = 854
earlyWindowHeight = 480
earlyWindowMaximized = false
earlyLoadingScreenTheme = ""
'''
        new File(neoForgeCreationUiRun, 'options.txt').text = 'onboardAccessibility:false\nguiScale:1\n'
    }
}

tasks.register('verifyNeoForgeCreationUiClient') {
    group = 'ringworld verification'
