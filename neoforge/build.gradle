plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version "${moddevgradle_version}"
}

tasks.named('check') {
	dependsOn(rootProject.tasks.named('verifyOutboundPositionPacketInventory'))
	dependsOn(rootProject.tasks.named('verifyBackportDependencyInventory'))
}

version = rootProject.mod_version
group = rootProject.maven_group

base {
    archivesName = rootProject.archives_base_name + '-neoforge'
}

repositories {
    exclusiveContent {
        forRepository {
            maven {
                name = 'ModrinthCreateCompatibility'
                url = uri('https://api.modrinth.com/maven')
            }
        }
        filter { includeGroup('maven.modrinth') }
    }
    exclusiveContent {
        forRepository {
            maven {
                name = 'CreateModFlywheelCompatibility'
                url = uri('https://maven.createmod.net')
            }
        }
        filter { includeGroup('dev.engine-room.flywheel') }
    }
}

def createCompatRuntime = configurations.create('createCompatRuntime') {
    description = 'Exact outer Create jar copied only into the disposable compatibility fixture.'
    canBeConsumed = false
    canBeResolved = true
    transitive = false
}

def qualificationEnabled = rootProject.ext.ringQualificationEnabled
def qualificationRunDirectory = rootProject.ext.ringQualificationRunDirectory
def qualificationRunFile = { String historicPath -> project.file(qualificationRunDirectory(historicPath)) }
def qualificationMinecraftRange = rootProject.ext.ringQualificationMinecraftRange
def qualificationNeoForgeRange = rootProject.ext.ringQualificationNeoForgeRange
def minecraftMetadataVersion = qualificationMinecraftRange ?: "[${rootProject.minecraft_version}]"
def neoForgeMetadataVersion = qualificationNeoForgeRange ?: "[${rootProject.neoforge_version},)"
def neoForgeRunPort = { String qualificationProperty, String historicProperty, String defaultValue ->
    def raw = (qualificationEnabled
            ? providers.gradleProperty(qualificationProperty)
                    .orElse(providers.gradleProperty('ringQualificationPort'))
                    .orElse(providers.gradleProperty(historicProperty))
            : providers.gradleProperty(historicProperty))
            .orElse(defaultValue).get().trim()
    try {
        def port = Integer.parseInt(raw)
        if (port < 1 || port > 65535) throw new NumberFormatException(raw)
        return port
    } catch (NumberFormatException ignored) {
        throw new GradleException("${qualificationProperty}/${historicProperty} must be an integer from 1 to 65535")
    }
}
if (qualificationEnabled) {
    layout.buildDirectory.set(new File(rootProject.ext.ringQualificationCellRoot, 'build/neoforge'))
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}

sourceSets.main.java.setSrcDirs([
        rootProject.file('src/main/java'),
        rootProject.file('src/client/java'),
        rootProject.file('src/platform/neoforge/java'),
        rootProject.file('src/platform/neoforgeClient/java')
])
sourceSets.main.resources.setSrcDirs([
        rootProject.file('src/main/resources'),
        rootProject.file('src/client/resources'),
        rootProject.file('src/platform/neoforge/resources')
])
sourceSets.main.resources.exclude('fabric.mod.json')

// Run the same loader-neutral contract suite against the NeoForge-compiled
// common sources. Platform-specific runtime gates remain separate.
sourceSets.test.java.setSrcDirs([
        rootProject.file('src/test/java'),
        rootProject.file('src/platform/neoforgeTest/java'),
        rootProject.file('src/platform/neoforgeClientTest/java')
])
sourceSets.test.resources.setSrcDirs([
        rootProject.file('src/test/resources'),
        rootProject.file('src/main/resources')
])

