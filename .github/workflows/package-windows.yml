name: Windows package launcher

on:
  # This suite is quick and imports several release-contract helpers. Running
  # it for every pull request avoids a path list silently missing a transitive
  # packaging dependency.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-launcher:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Test Fabric and NeoForge package assembly and Windows launcher updates
        run: >-
          python -m unittest
          scripts/test_build_unified_jar_prototype.py
          scripts/test_alpha_installer.py
          scripts/test_verify_distribution_license.py
          scripts/test_prepare_release_packages.py
          scripts/test_prism_neoforge_component.py
          scripts/test_server_rcon_send.py
