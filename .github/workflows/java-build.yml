name: Java dual-loader build

on:
  pull_request:
    paths:
      - ".github/workflows/java-build.yml"
      - "build.gradle"
      - "settings.gradle"
      - "gradle.properties"
      - "gradle/**"
      - "gradlew"
      - "gradlew.bat"
      - "neoforge/build.gradle"
      - "neoforge/src/**"
      - "src/**"
      - "config/minecraft-version-matrix*.json"
      - "scripts/minecraft_qualification_model.py"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/java-build.yml"
      - "build.gradle"
      - "settings.gradle"
      - "gradle.properties"
      - "gradle/**"
      - "gradlew"
      - "gradlew.bat"
      - "neoforge/build.gradle"
      - "neoforge/src/**"
      - "src/**"
      - "config/minecraft-version-matrix*.json"
      - "scripts/minecraft_qualification_model.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.minecraft.version }} ${{ matrix.loader }} source build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        minecraft:
          - version: "26.1"
            manifest: config/minecraft-version-matrix.json
          - version: "26.2"
            manifest: config/minecraft-version-matrix-26.2.json
          - version: "26.3"
            manifest: config/minecraft-version-matrix-26.3.json
        loader:
          - Fabric
          - NeoForge
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "25"
      - name: Build and test ${{ matrix.loader }}
        shell: bash
        env:
          RINGWORLD_CI_MINECRAFT: ${{ matrix.minecraft.version }}
          RINGWORLD_CI_MANIFEST: ${{ matrix.minecraft.manifest }}
          RINGWORLD_CI_LOADER: ${{ matrix.loader }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess, sys
          from pathlib import Path
          sys.path.insert(0, 'scripts')
          from minecraft_qualification_model import required_dependency_properties
          version = os.environ['RINGWORLD_CI_MINECRAFT']
          cells = json.loads(Path(os.environ['RINGWORLD_CI_MANIFEST']).read_text())['cells']
          pins = {}
          for cell in cells:
              if cell['minecraft']['version'] == version:
                  pins.update(required_dependency_properties(cell))
          if not pins:
              raise SystemExit('No pinned dependencies for the selected Minecraft version')
          prefix = ':' if os.environ['RINGWORLD_CI_LOADER'] == 'Fabric' else ':neoforge:'
          subprocess.run(['./gradlew', '--no-daemon', '--console=plain',
                          '-Pminecraft_version=' + version,
                          '-Pmod_version=0.0.0-qualification+mc' + version,
                          '-Prelease_label=qualification',
                          *['-P' + key + '=' + value for key, value in pins.items()],
                          prefix + 'test', prefix + 'build'], check=True)
          PY
