plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

def fabricMultiplayerPort = {
	def raw = providers.gradleProperty("ringFabricMultiplayerPort").orElse("25568").get().trim()
	try {
		def port = Integer.parseInt(raw)
		if (port < 1 || port > 65535) throw new NumberFormatException(raw)
		return port
	} catch (NumberFormatException ignored) {
		throw new GradleException("ringFabricMultiplayerPort must be an integer from 1 to 65535")
	}
}

repositories {
	mavenCentral()
}

loom {
	splitEnvironmentSourceSets()
	mods {
		"ringworld" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
	runs {
		multiplayerServer {
			server()
			name "RingWorld Multiplayer Server"
			runDir "run-multiplayer/server"
			vmArg "-Dringworld.multiplayerTest=true"
			programArg "nogui"
		}
		multiplayerClientA {
			client()
			name "RingWorld Multiplayer Client A"
			runDir "run-multiplayer/client-a"
			vmArg "-Dringworld.multiplayerTestRole=A"
			vmArg "-Dringworld.multiplayerTestPort=${fabricMultiplayerPort()}"
			programArgs "--username", "RingTesterA"
		}
		multiplayerClientB {
			client()
			name "RingWorld Multiplayer Client B"
			runDir "run-multiplayer/client-b"
			vmArg "-Dringworld.multiplayerTestRole=B"
			vmArg "-Dringworld.multiplayerTestPort=${fabricMultiplayerPort()}"
			programArgs "--username", "RingTesterB"
		}
		raidSeamArmServer {
			server()
			name "RingWorld Raid Seam Arm Server"
			runDir "run-raid-seam/server"
			vmArg "-Dringworld.raidSeamTest=true"
			vmArg "-Dringworld.raidSeamTestPhase=arm"
			vmArg "-Dringworld.raidSeamTestStopAfterSave=true"
			programArg "nogui"
		}
		raidSeamReloadServer {
			server()
			name "RingWorld Raid Seam Reload Server"
			runDir "run-raid-seam/server"
			vmArg "-Dringworld.raidSeamTest=true"
			vmArg "-Dringworld.raidSeamTestPhase=reload"
			programArg "nogui"
		}
		raidSeamClientA {
			client()
			name "RingWorld Raid Seam Client A"
			runDir "run-raid-seam/client-a"
			vmArg "-Dringworld.multiplayerTestRole=A"
			vmArg "-Dringworld.multiplayerTestPort=25567"
			programArgs "--username", "RingTesterA"
		}
		raidSeamClientB {
			client()
			name "RingWorld Raid Seam Client B"
			runDir "run-raid-seam/client-b"
			vmArg "-Dringworld.multiplayerTestRole=B"
			vmArg "-Dringworld.multiplayerTestPort=25567"
			programArgs "--username", "RingTesterB"
		}
		layoutSwitchClient {
			client()
			name "RingWorld Layout Switch Client"
			// Never open the source saves in-place: this run receives disposable
			// copies from prepareCopiedLayoutSwitchWorlds below.
			runDir "run-layout-switch"
			vmArg "-Dringworld.layoutSwitchFirst=" + providers.gradleProperty("ringLayoutSwitchFirstDestination")
					.orElse("RingWorld Layout Switch A").get()
			vmArg "-Dringworld.layoutSwitchSecond=" + providers.gradleProperty("ringLayoutSwitchSecondDestination")
					.orElse("RingWorld Layout Switch B").get()
			vmArg "-Dringworld.layoutSwitchExpectation=" + providers.gradleProperty("ringLayoutSwitchExpectation")
					.orElse("different-layout").get()
		}
		productionProjectionClient {
			client()
			name "RingWorld Production Projection Capture"
			// The projection run opens only the disposable copied world prepared
			// below. It must never open a source checkpoint in place.
			runDir "run-production-projection"
			vmArg "-Dringworld.captureRingProjection=true"
			vmArg "-Dringworld.projectionWorld=" + providers.gradleProperty("ringProjectionDestination")
					.orElse("RingWorld Production Projection").get()
			vmArg("-Dringworld.projectionViewDistanceChunks="
					+ providers.gradleProperty("ringProjectionViewDistanceChunks")
							.orElse("16").get())
			vmArg("-Dringworld.projectionEnvironment="
					+ providers.gradleProperty("ringProjectionEnvironment")
							.orElse("noon").get())
		}
		productionVisualParityClient {
			client()
			name "RingWorld Production Visual Parity"
			// This run receives a fresh copied save and uses server-authoritative
			// poses for the natural seam and both finite-width rims.
			runDir "run-production-visual-parity"
			vmArg "-Dringworld.captureRingVisualParity=true"
			vmArg("-Dringworld.visualParityWorld="
					+ providers.gradleProperty("ringVisualParityDestination")
							.orElse("RingWorld Fabric Visual Parity").get())
			vmArg("-Dringworld.visualParityViewDistanceChunks="
					+ providers.gradleProperty("ringVisualParityViewDistanceChunks")
							.orElse("16").get())
		}
		productionLifecycleClient {
			client()
			name "RingWorld Production Lifecycle Regression"
			// The client opens only the disposable copied world prepared below.
			// Do not use quick-play: its macOS launch path is nondeterministic.
			runDir "run-production-lifecycle"
			vmArg "-Dringworld.productionLifecycleTest=true"
			vmArg("-Dringworld.productionLifecycleWorld="
					+ providers.gradleProperty("ringProductionLifecycleDestination")
							.orElse("RingWorld Production Lifecycle").get())
		}
		curvedObjectCaptureClient {
			client()
			name "RingWorld Curved Object Capture"
			runDir "run-curved-object-capture"
			vmArg "-Dringworld.curvedObjectCapture=true"
			programArgs "--username", "RingObjectTester"
		}
		atlasUiClient {
			client()
			name "RingWorld Atlas UI Regression"
			runDir "run-atlas-ui"
			vmArg "-Dringworld.atlasUiTest=true"
			// Minecraft login names are limited to 16 characters.
			programArgs "--username", "AtlasUiTester"
		}
		creationUiClient {
			client()
			name "RingWorld Creation UI Regression"
			runDir "run-creation-ui"
			vmArg "-Dringworld.creationUiTest=true"
			// The menu-only fixture asserts this exact framebuffer at startup.
			programArgs "--username", "CreationUiTester", "--width", "1920", "--height", "1080"
		}
		mapCompassCaptureClient {
			client()
			name "RingWorld Map and Compass Capture"
			runDir "run-map-compass-capture"
			vmArg "-Dringworld.captureMapCompass=true"
			programArgs "--username", "MapCompassTester"
		}
		strongholdTestServer {
			server()
			name "RingWorld Stronghold Test Server"
			runDir "run-stronghold-test"
			vmArg "-Dringworld.strongholdTest=true"
			vmArg "-Dringworld.worldgenMatrix=" + providers.gradleProperty("ringWorldgenMatrix")
					.orElse("false").get()
			vmArg "-Dringworld.strongholdTestResume=" + providers.gradleProperty("ringStrongholdTestResume")
					.orElse("false").get()
			programArg "nogui"
		}
		headlessPrewarmServer {
			server()
			name "RingWorld Headless Atlas Prewarm"
			// This is the only launch directory accepted by the checked-in
			// disposable fixture. Never point this launch at a source save.
			runDir "run-headless-prewarm"
			vmArg "-Dringworld.headlessPrewarm=true"
			vmArg "-Dringworld.headlessPrewarmReport=" + providers.gradleProperty("ringHeadlessPrewarmResult")
					.orElse("result.json").get()
			programArg "nogui"
		}
	}
}

// Loader-neutral Minecraft code remains in the conventional main/client
// trees. Fabric-owned entrypoints, lifecycle hooks, networking transports,
// environment lookup, and launch adapters live in explicit platform trees so
// the same common sources can be compiled by the future NeoForge module.
sourceSets.main.java.srcDir 'src/platform/fabric/java'
sourceSets.client.java.srcDir 'src/platform/fabricClient/java'

def checkedSaveId = { String value, String propertyName ->
	def saveId = value == null ? "" : value.trim()
	if (saveId.isEmpty() || saveId == "." || saveId == ".."
				|| saveId.contains("/") || saveId.indexOf(92) >= 0) {
		throw new GradleException("-${propertyName} must be a single existing save-folder identifier")
	}
	return saveId
}

def requireSave = { String value, String propertyName, File savesDirectory ->
	def saveId = checkedSaveId(value, propertyName)
	def worldDirectory = new File(savesDirectory, saveId)
	if (!new File(worldDirectory, "level.dat").isFile()) {
		throw new GradleException("-${propertyName}='${saveId}' is not an existing save under "
				+ savesDirectory + " (expected " + new File(worldDirectory, "level.dat") + ")")
	}
	return [id: saveId, directory: worldDirectory]
}

def sourceSavesDirectory = file("run/saves")
def layoutSwitchSavesDirectory = file("run-layout-switch/saves")
def projectionSavesDirectory = file("run-production-projection/saves")
def visualParitySavesDirectory = file("run-production-visual-parity/saves")
def lifecycleSavesDirectory = file("run-production-lifecycle/saves")
def strongholdTestDirectory = file("run-stronghold-test")
def headlessPrewarmDirectory = file("run-headless-prewarm")
def raidSeamDirectory = file("run-raid-seam")

def requireFabricRuntimeGateLog = { File logFile, String passMarker,
									 String failMarker, String label ->
	def log = logFile.isFile() ? logFile.getText("UTF-8") : ""
	if (!log.contains(passMarker) || log.contains(failMarker)) {
		throw new GradleException("${label} did not pass; inspect ${logFile}")
	}
}

def requireReadablePng = { File screenshot, String label ->
	if (!screenshot.isFile()) {
		throw new GradleException("${label} is missing ${screenshot}")
	}
	def input = javax.imageio.ImageIO.createImageInputStream(screenshot)
	if (input == null) {
		throw new GradleException("${label} is not a readable image: ${screenshot}")
	}
	try {
		def readers = javax.imageio.ImageIO.getImageReaders(input)
		if (!readers.hasNext()) {
			throw new GradleException("${label} is not a decodable image: ${screenshot}")
		}
		def reader = readers.next()
		try {
			if (!reader.formatName.equalsIgnoreCase("png")) {
				throw new GradleException("${label} is not a PNG: ${screenshot}")
			}
			reader.setInput(input, true, true)
			def width = reader.getWidth(0)
			def height = reader.getHeight(0)
			if (width < 16 || height < 16 || width > 16_384 || height > 16_384) {
				throw new GradleException(
						"${label} has unsafe dimensions ${width}x${height}: ${screenshot}")
			}
			def image = reader.read(0)
			if (image == null || image.width != width || image.height != height) {
				throw new GradleException("${label} did not decode correctly: ${screenshot}")
			}
		} catch (GradleException failure) {
			throw failure
		} catch (Exception failure) {
			throw new GradleException("${label} is corrupt: ${screenshot}", failure)
		} finally {
			reader.dispose()
		}
	} finally {
		input.close()
	}
}

def requireNonUniformPng = { File screenshot, String label ->
	requireReadablePng(screenshot, label)
	def image = javax.imageio.ImageIO.read(screenshot)
	if (image == null) {
		throw new GradleException("${label} did not decode correctly: ${screenshot}")
	}
	Integer firstVisiblePixel = null
	boolean nonUniform = false
	for (int y = 0; y < image.height && !nonUniform; y++) {
		for (int x = 0; x < image.width; x++) {
			int pixel = image.getRGB(x, y)
			if ((pixel >>> 24) != 0) {
				if (firstVisiblePixel == null) {
					firstVisiblePixel = pixel
				} else if (pixel != firstVisiblePixel) {
					nonUniform = true
					break
				}
			}
		}
	}
	if (firstVisiblePixel == null || !nonUniform) {
		throw new GradleException("${label} is blank or uniform: ${screenshot}")
	}
}

def verifyFabricProjectionOutputs = { File runDirectory, String environment ->
	def normalizedEnvironment = environment.trim().toLowerCase(Locale.ROOT)
	if (!(normalizedEnvironment in ["noon", "dusk", "night", "rain"])) {
		throw new GradleException(
				"ringProjectionEnvironment must be one of noon, dusk, night, or rain")
	}
	def logFile = new File(runDirectory, "logs/latest.log")
	requireFabricRuntimeGateLog(logFile,
			"[projection-capture] result=true, captures complete",
			"[projection-capture] result=false", "Fabric projection capture")
	def prefix = normalizedEnvironment == "noon"
			? "ringworld-projection-" : "ringworld-projection-${normalizedEnvironment}-"
	["tangent", "handoff", "up"].each { view ->
		requireReadablePng(new File(runDirectory, "screenshots/${prefix}${view}.png"),
				"Fabric projection capture")
	}
}

def requireVisualParitySeamMotionMetrics = { File logFile, String label ->
	def metrics = logFile.readLines("UTF-8").findAll {
		it.contains("[visual-parity-capture] seam motion frame metrics:")
	}
	if (metrics.isEmpty()) {
		throw new GradleException("${label} is missing seam-motion frame metrics: ${logFile}")
	}
	def sampleMatcher = (metrics.last() =~ /samples=(\d+)/)
	if (!sampleMatcher.find() || sampleMatcher.group(1).toInteger() <= 0) {
		throw new GradleException("${label} recorded no seam-motion frame samples: ${logFile}")
	}
}

def verifyFabricVisualParityOutputs = { File runDirectory ->
	def logFile = new File(runDirectory, "logs/latest.log")
	requireFabricRuntimeGateLog(logFile,
			"[visual-parity-capture] result=true, captures complete",
			"[visual-parity-capture] result=false",
			"Fabric visual-parity capture")
	requireVisualParitySeamMotionMetrics(logFile, "Fabric visual-parity capture")
	["seam", "min-rim", "max-rim"].each { view ->
		def screenshot = new File(runDirectory,
				"screenshots/ringworld-visual-parity-${view}.png")
		if (!screenshot.isFile()) {
			throw new GradleException("Fabric visual-parity capture is missing " + screenshot)
		}
	}
}

def verifyFabricLayoutSwitchOutputs = { File runDirectory, List<String> destinations, String expectation ->
	def logFile = new File(runDirectory, "logs/latest.log")
	requireFabricRuntimeGateLog(logFile,
			"[layout-switch] result-json={\"passed\":true,",
			"[layout-switch] result-json={\"passed\":false,",
			"Fabric layout-switch client")
	if (!logFile.text.contains("[layout-switch] expectation=${expectation}")) {
		throw new GradleException(
				"Fabric layout-switch client did not run expected mode '${expectation}'; inspect ${logFile}")
	}
	destinations.each { destinationId ->
		def destination = new File(new File(runDirectory, "saves"),
				checkedSaveId(destinationId, "ringLayoutSwitchDestination"))
		if (!new File(destination, "level.dat").isFile()) {
			throw new GradleException(
					"Fabric layout-switch output is missing level.dat: ${destination}")
		}
	}
}

def verifyFabricProductionLifecycleOutputs = { File runDirectory, String destinationId ->
	def logFile = new File(runDirectory, "logs/latest.log")
	requireFabricRuntimeGateLog(logFile,
			"[production-lifecycle] result=true",
			"[production-lifecycle] result=false",
			"Fabric production lifecycle")
	def destination = new File(new File(runDirectory, "saves"),
			checkedSaveId(destinationId, "ringProductionLifecycleDestination"))
	if (!new File(destination, "level.dat").isFile()) {
		throw new GradleException(
				"Fabric lifecycle output is missing level.dat: ${destination}")
	}
}

def multiplayerHarnessDirectory = file("run-multiplayer")
def multiplayerPregenerateTerrainAtlas = providers.gradleProperty("ringMultiplayerPregenerateTerrainAtlas")
        .orElse("false")
def multiplayerHarnessDimension = { String propertyName, String defaultValue, int minimum, boolean chunkAligned ->
	def raw = providers.gradleProperty(propertyName).orElse(defaultValue).get().trim()
	int value
	try {
		value = Integer.parseInt(raw)
	} catch (NumberFormatException ignored) {
		throw new GradleException("${propertyName} must be a positive integer")
	}
	if (value < minimum) {
		throw new GradleException("${propertyName} must be at least ${minimum} blocks")
	}
	if (chunkAligned && value % 16 != 0) {
		throw new GradleException("${propertyName} must be divisible by 16 blocks")
	}
	value
}
// Mirror RingGeometry/RingWorldConfig's bootstrap constraints. The server
// still applies the full first-world dimension report before world creation.
def multiplayerCircumferenceBlocks = multiplayerHarnessDimension(
		"ringMultiplayerCircumferenceBlocks", "2048", 2048, true)
def multiplayerWidthBlocks = multiplayerHarnessDimension(
		"ringMultiplayerWidthBlocks", "416", 128, true)
def multiplayerWallHeightBlocks = multiplayerHarnessDimension(
		"ringMultiplayerWallHeightBlocks", "160", 32, false)
def multiplayerAtlasCellCount = (multiplayerCircumferenceBlocks.longValue() / 8L)
		* (multiplayerWidthBlocks.longValue() / 8L)

tasks.register("prepareMultiplayerHarness") {
	group = "ringworld verification"
	description = "Creates clean, isolated Fabric server and client-A/client-B multiplayer harness directories."
	inputs.property("ringMultiplayerPregenerateTerrainAtlas", multiplayerPregenerateTerrainAtlas)
	inputs.property("ringMultiplayerCircumferenceBlocks", multiplayerCircumferenceBlocks)
	inputs.property("ringMultiplayerWidthBlocks", multiplayerWidthBlocks)
	inputs.property("ringMultiplayerWallHeightBlocks", multiplayerWallHeightBlocks)
	inputs.property("ringFabricMultiplayerPort", fabricMultiplayerPort())
	outputs.dir(multiplayerHarnessDirectory)
	outputs.upToDateWhen { false }
	doLast {
		def server = new File(multiplayerHarnessDirectory, "server")
		def eula = new File(server, "eula.txt")
		if (!eula.isFile()) {
			eula.parentFile.mkdirs()
			eula.text = "# Review https://aka.ms/MinecraftEULA before changing this value.\neula=false\n"
		}
		if (!eula.text.readLines().any { it.trim() == "eula=true" }) {
			throw new GradleException("Review ${eula}, then set eula=true to run this disposable server")
		}

		["world", "logs", "ringworld-cache", "crash-reports"].each { delete(new File(server, it)) }
		["client-a", "client-b"].each { client ->
			["logs", "screenshots", "ringworld-cache", "crash-reports"].each {
				delete(new File(multiplayerHarnessDirectory, client + "/" + it))
			}
		}
		[server, new File(multiplayerHarnessDirectory, "client-a"),
		 new File(multiplayerHarnessDirectory, "client-b")].each { it.mkdirs() }

		def configDirectory = new File(server, "config")
		configDirectory.mkdirs()
		new File(configDirectory, "ringworld.properties").text = """\
widthBlocks=${multiplayerWidthBlocks}
circumferenceBlocks=${multiplayerCircumferenceBlocks}
wallHeightBlocks=${multiplayerWallHeightBlocks}
testMode=false
testViewDistanceChunks=2
pregenerateTerrainAtlas=${multiplayerPregenerateTerrainAtlas.get().toBoolean() ? "true" : "false"}
"""

		def properties = new Properties()
		properties.setProperty("server-port", fabricMultiplayerPort().toString())
		properties.setProperty("online-mode", "false")
		properties.setProperty("gamemode", "creative")
		properties.setProperty("difficulty", "normal")
		properties.setProperty("level-name", "world")
		properties.setProperty("level-seed", "-2162056627494116761")
		properties.setProperty("view-distance", "5")
		properties.setProperty("simulation-distance", "5")
		properties.setProperty("pause-when-empty-seconds", "-1")
		properties.setProperty("motd", "RingWorld Fabric automated multiplayer harness")
		new File(server, "server.properties").withOutputStream {
			properties.store(it, "Disposable RingWorld Fabric multiplayer harness")
		}

		logger.lifecycle("[fabric-multiplayer] prepared isolated server/client runs at {} on port {}",
				multiplayerHarnessDirectory, fabricMultiplayerPort())
	}
}

def verifyMultiplayerAtlasProgress = { String loader, File serverLog, String serverText,
		long expectedTotalCells ->
	def samples = []
	def matcher = (serverText =~ /RingWorld terrain atlas progress: (\d+)\/(\d+) cells \([^)]*\), generation (\w+)/)
	matcher.each { match ->
		samples << [match[1].toLong(), match[2].toLong(), match[3]]
	}
	if (samples.isEmpty()) {
		throw new GradleException("${loader} multiplayer atlas gate found no atlas progress or completion status; inspect ${serverLog}")
	}
	long previousCells = -1L
	long totalCells = -1L
	boolean advanced = false
	for (sample in samples) {
		long presentCells = sample[0]
		long sampleTotal = sample[1]
		if (sample[2] in ["failed", "cancelled"]) {
			throw new GradleException("${loader} multiplayer atlas generation did not remain healthy; inspect ${serverLog}")
		}
		if (sampleTotal <= 0L || presentCells < 0L || presentCells > sampleTotal) {
			throw new GradleException("${loader} multiplayer atlas status is invalid; inspect ${serverLog}")
		}
		if (sampleTotal != expectedTotalCells) {
			throw new GradleException("${loader} multiplayer atlas total ${sampleTotal} does not match "
					+ "the configured geometry's expected ${expectedTotalCells} cells; inspect ${serverLog}")
		}
		if (totalCells != -1L && sampleTotal != totalCells) {
			throw new GradleException("${loader} multiplayer atlas total changed during one disposable run; inspect ${serverLog}")
		}
		if (previousCells != -1L && presentCells < previousCells) {
			throw new GradleException("${loader} multiplayer atlas progress regressed; inspect ${serverLog}")
		}
		if (previousCells != -1L && presentCells > previousCells) advanced = true
		previousCells = presentCells
		totalCells = sampleTotal
	}
	if (!advanced) {
		throw new GradleException("${loader} multiplayer atlas gate did not observe increasing atlas progress; inspect ${serverLog}")
	}
}

tasks.register("verifyMultiplayerHarness") {
	group = "ringworld verification"
	description = "Fails unless the isolated Fabric two-client seam matrix completed successfully."
	doLast {
		def serverLog = new File(multiplayerHarnessDirectory, "server/logs/latest.log")
		def clientALog = new File(multiplayerHarnessDirectory, "client-a/logs/latest.log")
		def clientBLog = new File(multiplayerHarnessDirectory, "client-b/logs/latest.log")
		def serverText = serverLog.isFile() ? serverLog.text : ""
		def clientAText = clientALog.isFile() ? clientALog.text : ""
		def clientBText = clientBLog.isFile() ? clientBLog.text : ""
		if (!serverText.contains("[multiplayer] full scenario result=true")
				|| serverText.contains("[multiplayer] full scenario result=false")) {
			throw new GradleException("Fabric multiplayer server matrix did not pass; inspect ${serverLog}")
		}
		if (!serverText.contains("[multiplayer-extended] ordinary Nether portal wait result=true")
				|| !serverText.contains("[multiplayer-extended] multi-lap Nether portal routing result=true")
				|| !serverText.contains("[multiplayer-extended] seam thunder/lightning result=true")) {
			throw new GradleException("Fabric multiplayer portal-delay/weather evidence is incomplete; inspect ${serverLog}")
		}
		if (!serverText.contains("[multiplayer] bidirectional seam placement result=true")) {
			throw new GradleException("Fabric multiplayer bidirectional placement evidence is incomplete; inspect ${serverLog}")
		}
		[[clientALog, clientAText], [clientBLog, clientBText]].each { entry ->
			if (!entry[1].contains("forward seam placement result=true")
					|| !entry[1].contains("reverse seam placement result=true")) {
				throw new GradleException("Fabric multiplayer client placement evidence is incomplete; inspect ${entry[0]}")
			}
		}
		if (!serverText.contains("[multiplayer-extended] double chest prepared")
				|| !serverText.contains("highSize=54, lowSize=54")
				|| !serverText.contains("lowAliasSame=true, highAliasSame=true")
				|| !serverText.contains("[multiplayer-extended] alias block-entity recovery policy result=true")) {
			throw new GradleException("Fabric multiplayer seam double-chest evidence is incomplete; inspect ${serverLog}")
		}
		["extended-fixture-before", "extended-fixture-after", "nether-returned",
		 "end-returned", "weather-stability-ready", "terminal-result"].each { phase ->
			if (!serverText.contains("[multiplayer-cold] phase=${phase}")) {
				throw new GradleException("Fabric multiplayer cold-phase telemetry is missing ${phase}; inspect ${serverLog}")
			}
		}
		if (serverText.contains("post-End weather stability timed out")) {
			throw new GradleException("Fabric multiplayer post-End stability barrier timed out; inspect ${serverLog}")
		}
		[
				[clientALog, clientAText, "[multiplayer:A] client world fully loaded"],
				[clientBLog, clientBText, "[multiplayer:B] client world fully loaded"],
				[clientALog, clientAText, "[multiplayer:A] local scenario result=true; stopping client"],
				[clientBLog, clientBText, "[multiplayer:B] local scenario result=true; stopping client"]
		].each { entry ->
			if (!entry[1].contains(entry[2])) {
				throw new GradleException("Fabric multiplayer client did not complete startup; inspect ${entry[0]}")
			}
		}
		[
				new File(multiplayerHarnessDirectory, "client-a/screenshots/ringworld-multiplayer-a.png"),
				new File(multiplayerHarnessDirectory, "client-b/screenshots/ringworld-multiplayer-b.png"),
				new File(multiplayerHarnessDirectory, "client-a/screenshots/ringworld-multiplayer-weather-a.png"),
				new File(multiplayerHarnessDirectory, "client-b/screenshots/ringworld-multiplayer-weather-b.png")
		].each { screenshot ->
			if (!screenshot.isFile()) {
				throw new GradleException("Fabric multiplayer harness is missing ${screenshot}")
			}
		}
		if (multiplayerPregenerateTerrainAtlas.get().toBoolean()) {
			verifyMultiplayerAtlasProgress("Fabric", serverLog, serverText, multiplayerAtlasCellCount)
		}
		logger.lifecycle("[fabric-multiplayer] verified full server and client-A/client-B seam matrix")
	}
}

