plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	mavenCentral()
}

loom {
	splitEnvironmentSourceSets()
	mods {
		"ringworld" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
	runs {
		multiplayerServer {
			server()
			name "RingWorld Multiplayer Server"
			runDir "run-multiplayer/server"
			vmArg "-Dringworld.multiplayerTest=true"
			programArg "nogui"
		}
		multiplayerClientA {
			client()
			name "RingWorld Multiplayer Client A"
			runDir "run-multiplayer/client-a"
			vmArg "-Dringworld.multiplayerTestRole=A"
			vmArg "-Dringworld.multiplayerTestPort=25566"
			programArgs "--username", "RingTesterA"
		}
		multiplayerClientB {
			client()
			name "RingWorld Multiplayer Client B"
			runDir "run-multiplayer/client-b"
			vmArg "-Dringworld.multiplayerTestRole=B"
			vmArg "-Dringworld.multiplayerTestPort=25566"
			programArgs "--username", "RingTesterB"
		}
		layoutSwitchClient {
			client()
			name "RingWorld Layout Switch Client"
			// Never open the source saves in-place: this run receives disposable
			// copies from prepareCopiedLayoutSwitchWorlds below.
			runDir "run-layout-switch"
			vmArg "-Dringworld.layoutSwitchFirst=" + providers.gradleProperty("ringLayoutSwitchFirstDestination")
					.orElse("RingWorld Layout Switch A").get()
			vmArg "-Dringworld.layoutSwitchSecond=" + providers.gradleProperty("ringLayoutSwitchSecondDestination")
					.orElse("RingWorld Layout Switch B").get()
		}
		productionProjectionClient {
			client()
			name "RingWorld Production Projection Capture"
			// The projection run opens only the disposable copied world prepared
			// below. It must never open a source checkpoint in place.
			runDir "run-production-projection"
			vmArg "-Dringworld.captureRingProjection=true"
			vmArg "-Dringworld.projectionWorld=" + providers.gradleProperty("ringProjectionDestination")
					.orElse("RingWorld Production Projection").get()
		}
		productionLifecycleClient {
			client()
			name "RingWorld Production Lifecycle Regression"
			// The client opens only the disposable copied world prepared below.
			// Do not use quick-play: its macOS launch path is nondeterministic.
			runDir "run-production-lifecycle"
			vmArg "-Dringworld.productionLifecycleTest=true"
			vmArg("-Dringworld.productionLifecycleWorld="
					+ providers.gradleProperty("ringProductionLifecycleDestination")
							.orElse("RingWorld Production Lifecycle").get())
		}
		curvedObjectCaptureClient {
			client()
			name "RingWorld Curved Object Capture"
			runDir "run-curved-object-capture"
			vmArg "-Dringworld.curvedObjectCapture=true"
			programArgs "--username", "RingObjectTester"
		}
		atlasUiClient {
			client()
			name "RingWorld Atlas UI Regression"
			runDir "run-atlas-ui"
			vmArg "-Dringworld.atlasUiTest=true"
			// Minecraft login names are limited to 16 characters.
			programArgs "--username", "AtlasUiTester"
		}
		strongholdTestServer {
			server()
			name "RingWorld Stronghold Test Server"
			runDir "run-stronghold-test"
			vmArg "-Dringworld.strongholdTest=true"
			programArg "nogui"
		}
		headlessPrewarmServer {
			server()
			name "RingWorld Headless Atlas Prewarm"
			// This is the only launch directory accepted by the checked-in
			// disposable fixture. Never point this launch at a source save.
			runDir "run-headless-prewarm"
			vmArg "-Dringworld.headlessPrewarm=true"
			vmArg "-Dringworld.headlessPrewarmReport=" + providers.gradleProperty("ringHeadlessPrewarmResult")
					.orElse("result.json").get()
			programArg "nogui"
		}
	}
}

def checkedSaveId = { String value, String propertyName ->
	def saveId = value == null ? "" : value.trim()
	if (saveId.isEmpty() || saveId == "." || saveId == ".."
				|| saveId.contains("/") || saveId.indexOf(92) >= 0) {
		throw new GradleException("-${propertyName} must be a single existing save-folder identifier")
	}
	return saveId
}

def requireSave = { String value, String propertyName, File savesDirectory ->
	def saveId = checkedSaveId(value, propertyName)
	def worldDirectory = new File(savesDirectory, saveId)
	if (!new File(worldDirectory, "level.dat").isFile()) {
		throw new GradleException("-${propertyName}='${saveId}' is not an existing save under "
				+ savesDirectory + " (expected " + new File(worldDirectory, "level.dat") + ")")
	}
	return [id: saveId, directory: worldDirectory]
}

def sourceSavesDirectory = file("run/saves")
def layoutSwitchSavesDirectory = file("run-layout-switch/saves")
def projectionSavesDirectory = file("run-production-projection/saves")
def lifecycleSavesDirectory = file("run-production-lifecycle/saves")
def strongholdTestDirectory = file("run-stronghold-test")
def headlessPrewarmDirectory = file("run-headless-prewarm")

tasks.register("prepareStrongholdTestWorld") {
	group = "ringworld verification"
	description = "Creates a fresh disposable stronghold world for the selected test seed."
	inputs.property("ringStrongholdTestSeed",
			providers.gradleProperty("ringStrongholdTestSeed").orElse("ringworld-regression-0"))
	inputs.property("ringStrongholdTestCircumference",
			providers.gradleProperty("ringStrongholdTestCircumference").orElse("16384"))
	inputs.property("ringStrongholdTestWidth",
			providers.gradleProperty("ringStrongholdTestWidth").orElse("256"))
	outputs.upToDateWhen { false }
	doLast {
		def eula = new File(strongholdTestDirectory, "eula.txt")
		if (!eula.isFile() || !eula.text.readLines().any { it.trim() == "eula=true" }) {
			throw new GradleException("Run the stronghold server once, review its eula.txt, then set eula=true")
		}
		delete(new File(strongholdTestDirectory, "world"))
		delete(new File(strongholdTestDirectory, "logs/latest.log"))
		def propertiesFile = new File(strongholdTestDirectory, "server.properties")
		def properties = new Properties()
		if (propertiesFile.isFile()) propertiesFile.withInputStream { properties.load(it) }
		properties.setProperty("level-seed",
				providers.gradleProperty("ringStrongholdTestSeed").orElse("ringworld-regression-0").get())
		propertiesFile.parentFile.mkdirs()
		propertiesFile.withOutputStream { properties.store(it, "Disposable RingWorld stronghold test") }

		def configFile = new File(strongholdTestDirectory, "config/ringworld.properties")
		def config = new Properties()
		if (configFile.isFile()) configFile.withInputStream { config.load(it) }
		config.setProperty("circumferenceBlocks",
				providers.gradleProperty("ringStrongholdTestCircumference").orElse("16384").get())
		config.setProperty("widthBlocks",
				providers.gradleProperty("ringStrongholdTestWidth").orElse("256").get())
		config.setProperty("pregenerateTerrainAtlas", "false")
		configFile.parentFile.mkdirs()
		configFile.withOutputStream { config.store(it, "Disposable RingWorld stronghold test") }
	}
}

tasks.named("runStrongholdTestServer") {
	dependsOn("prepareStrongholdTestWorld")
	finalizedBy("verifyStrongholdTestServer")
}

tasks.register("prepareHeadlessPrewarmWorld") {
	group = "ringworld verification"
	description = "Prepares a fresh or copied disposable world for headless atlas prewarm."
	inputs.property("ringHeadlessPrewarmSource",
			providers.gradleProperty("ringHeadlessPrewarmSource").orElse(""))
	inputs.property("ringHeadlessPrewarmResult",
			providers.gradleProperty("ringHeadlessPrewarmResult").orElse("result.json"))
	inputs.property("ringHeadlessPrewarmResume",
			providers.gradleProperty("ringHeadlessPrewarmResume").orElse("false"))
	outputs.upToDateWhen { false }
	doLast {
		def sourceName = providers.gradleProperty("ringHeadlessPrewarmSource").orElse("").get().trim()
		def resume = providers.gradleProperty("ringHeadlessPrewarmResume").orElse("false").get().toBoolean()
		def reportName = providers.gradleProperty("ringHeadlessPrewarmResult").orElse("result.json").get().trim()
		if (reportName.isEmpty() || reportName == "progress.json" || reportName.contains("/") || reportName.indexOf(92) >= 0 || !reportName.endsWith(".json")) {
			throw new GradleException("-PringHeadlessPrewarmResult must be one .json filename")
		}
		def eula = new File(headlessPrewarmDirectory, "eula.txt")
		if (!eula.isFile() || !eula.text.readLines().any { it.trim() == "eula=true" }) {
			throw new GradleException("Run the disposable headless server once, review its eula.txt, then set eula=true")
		}
		def world = new File(headlessPrewarmDirectory, "world")
		if (resume) {
			if (!sourceName.isEmpty() || !new File(world, "level.dat").isFile()) {
				throw new GradleException("-PringHeadlessPrewarmResume=true requires the existing disposable world and no copy source")
			}
		} else {
			delete(world)
			delete(new File(headlessPrewarmDirectory, "logs"))
		}
		if (!sourceName.isEmpty()) {
			def source = requireSave(sourceName, "ringHeadlessPrewarmSource", sourceSavesDirectory)
			copy { from source.directory; into world }
			if (!new File(world, "level.dat").isFile()) {
				throw new GradleException("copied headless world is missing level.dat: " + world)
			}
			logger.lifecycle("[headless-prewarm] copied source={} destination={}", source.directory, world)
		}
		// A prewarm may crash before it can write new evidence. Never let the
		// finalizer mistake an older COMPLETE result for this launch, including
		// a deliberate resume of the same disposable runtime world.
		def reportDirectory = new File(world, "ringworld-prewarm")
		delete(new File(reportDirectory, reportName))
		delete(new File(reportDirectory, "progress.json"))
		def properties = new Properties()
		def propertiesFile = new File(headlessPrewarmDirectory, "server.properties")
		if (propertiesFile.isFile()) propertiesFile.withInputStream { properties.load(it) }
		properties.setProperty("level-name", "world")
		properties.setProperty("online-mode", "false")
		properties.setProperty("server-port", "0")
		// A non-interactive job has no players, so vanilla's empty-server pause
		// would otherwise stop normal ticks partway through pregeneration.
		properties.setProperty("pause-when-empty-seconds", "-1")
		propertiesFile.withOutputStream { properties.store(it, "Disposable RingWorld headless prewarm") }
		def config = new Properties()
		def configFile = new File(headlessPrewarmDirectory, "config/ringworld.properties")
		config.setProperty("widthBlocks", "416")
		config.setProperty("circumferenceBlocks", "2048")
		config.setProperty("wallHeightBlocks", "160")
		config.setProperty("testMode", "false")
		config.setProperty("testViewDistanceChunks", "6")
		// The launch adapter supplies HEADLESS_PREWARM itself and suppresses
		// background autostart even if an existing copied config says true.
		config.setProperty("pregenerateTerrainAtlas", "false")
		configFile.parentFile.mkdirs()
		configFile.withOutputStream { config.store(it, "Disposable RingWorld headless prewarm") }
	}
}

tasks.register("verifyHeadlessPrewarm") {
	group = "ringworld verification"
	description = "Converts a non-complete headless prewarm JSON result into a failing Gradle result."
	mustRunAfter("runHeadlessPrewarmServer")
	doLast {
		def resultName = providers.gradleProperty("ringHeadlessPrewarmResult").orElse("result.json").get().trim()
		def result = new File(headlessPrewarmDirectory, "world/ringworld-prewarm/" + resultName)
		if (!result.isFile()) {
			throw new GradleException("Headless prewarm did not write a terminal result; inspect " + result)
		}
		def report
		try {
			report = new groovy.json.JsonSlurper().parse(result)
		} catch (Exception failure) {
			throw new GradleException("Headless prewarm result is not valid JSON: " + result, failure)
		}
		if (!(report instanceof Map) || report.schemaVersion != 1 || report.status != "COMPLETE" || report.identityAvailable != true
				|| !report.containsKey("atlasPath") || !report.atlasPath || !report.containsKey("failureReason") || report.failureReason != null
				|| !(report.totalChunks instanceof Number) || !(report.completedChunks instanceof Number)
				|| !(report.totalCells instanceof Number) || !(report.completedCells instanceof Number)
				|| report.totalChunks <= 0 || report.totalCells <= 0
				|| report.completedChunks != report.totalChunks || report.completedCells != report.totalCells) {
			throw new GradleException("Headless prewarm did not complete; inspect " + result)
		}
	}
}

tasks.named("runHeadlessPrewarmServer") {
	dependsOn("prepareHeadlessPrewarmWorld")
	finalizedBy("verifyHeadlessPrewarm")
}

tasks.register("prepareAtlasUiRun") {
	group = "ringworld verification"
	description = "Writes an isolated safe-small configuration for the atlas-map GUI regression."
	doLast {
		delete(file("run-atlas-ui/saves"))
		delete(file("run-atlas-ui/screenshots"))
		delete(file("run-atlas-ui/ringworld-cache"))
		delete(file("run-atlas-ui/logs"))
		def configFile = file("run-atlas-ui/config/ringworld.properties")
		configFile.parentFile.mkdirs()
		def config = new Properties()
		config.setProperty("widthBlocks", "416")
		config.setProperty("circumferenceBlocks", "2048")
		config.setProperty("wallHeightBlocks", "160")
		config.setProperty("testMode", "true")
		config.setProperty("testViewDistanceChunks", "6")
		config.setProperty("pregenerateTerrainAtlas", "false")
		configFile.withOutputStream { config.store(it, "Isolated RingWorld atlas UI regression") }
	}
}

tasks.named("runAtlasUiClient") {
	dependsOn("prepareAtlasUiRun")
	finalizedBy("verifyAtlasUiClient")
}

tasks.register("verifyAtlasUiClient") {
	group = "ringworld verification"
	description = "Fails unless the isolated GUI-scale-4 atlas-map client completed every required capture."
	mustRunAfter("runAtlasUiClient")
	doLast {
		def logFile = file("run-atlas-ui/logs/latest.log")
		def log = logFile.isFile() ? logFile.text : ""
		if (!log.contains("[atlas-ui-test] PASS") || log.contains("[atlas-ui-test] FAIL")) {
			throw new GradleException("Atlas UI client did not pass; inspect " + logFile)
		}
		(1..10).each { index ->
			def prefix = String.format("atlas-ui-%02d-", index)
			if (fileTree("run-atlas-ui/screenshots").matching { include prefix + "*.png" }.isEmpty()) {
				throw new GradleException("Atlas UI client is missing screenshot " + prefix + "*.png")
			}
		}
	}
}

tasks.register("verifyStrongholdTestServer") {
	group = "ringworld verification"
	description = "Fails unless the disposable server logged a complete stronghold PASS."
	mustRunAfter("runStrongholdTestServer")
	doLast {
		def logFile = new File(strongholdTestDirectory, "logs/latest.log")
		def log = logFile.isFile() ? logFile.text : ""
		if (!log.contains("[stronghold-test] PASS") || log.contains("[stronghold-test] FAILED")) {
			throw new GradleException("Stronghold runtime gate did not pass; inspect " + logFile)
		}
	}
}

tasks.register("prepareCopiedLayoutSwitchWorlds") {
	group = "ringworld verification"
	description = "Copies two explicit saved worlds into the isolated layout-switch run directory."
	inputs.property("ringLayoutSwitchFirstSource",
			providers.gradleProperty("ringLayoutSwitchFirstSource").orElse("RingWorld Automated Test (10)"))
	inputs.property("ringLayoutSwitchSecondSource",
			providers.gradleProperty("ringLayoutSwitchSecondSource").orElse("RingWorld Automated Test (6)"))
	inputs.property("ringLayoutSwitchFirstDestination",
			providers.gradleProperty("ringLayoutSwitchFirstDestination").orElse("RingWorld Layout Switch A"))
	inputs.property("ringLayoutSwitchSecondDestination",
			providers.gradleProperty("ringLayoutSwitchSecondDestination").orElse("RingWorld Layout Switch B"))
	outputs.dir(layoutSwitchSavesDirectory)
	// A saved world can change between runs; always refresh only the isolated copies.
	outputs.upToDateWhen { false }
	doLast {
		def copies = [
			[providers.gradleProperty("ringLayoutSwitchFirstSource").orElse("RingWorld Automated Test (10)").get(),
					providers.gradleProperty("ringLayoutSwitchFirstDestination").orElse("RingWorld Layout Switch A").get(),
					"ringLayoutSwitchFirstSource", "ringLayoutSwitchFirstDestination"],
			[providers.gradleProperty("ringLayoutSwitchSecondSource").orElse("RingWorld Automated Test (6)").get(),
					providers.gradleProperty("ringLayoutSwitchSecondDestination").orElse("RingWorld Layout Switch B").get(),
					"ringLayoutSwitchSecondSource", "ringLayoutSwitchSecondDestination"]
		]
		def destinations = [] as Set
		copies.each { copySpec ->
			def source = requireSave(copySpec[0], copySpec[2], sourceSavesDirectory)
			def destinationId = checkedSaveId(copySpec[1], copySpec[3])
			if (!destinations.add(destinationId)) {
				throw new GradleException("layout-switch destinations must be distinct")
			}
			def destination = new File(layoutSwitchSavesDirectory, destinationId)
			delete(destination)
			copy {
				from(source.directory)
				into(destination)
			}
			if (!new File(destination, "level.dat").isFile()) {
				throw new GradleException("copied layout-switch save is missing level.dat: " + destination)
			}
			logger.lifecycle("[layout-switch] copied source={} destination={}", source.directory, destination)
		}
	}
}

tasks.register("verifyProductionProjectionSave") {
	group = "ringworld verification"
	description = "Checks that ringProjectionWorld names an existing source save under run/saves."
	doLast {
		requireSave(providers.gradleProperty("ringProjectionWorld").orNull,
				"ringProjectionWorld", sourceSavesDirectory)
	}
}

tasks.register("prepareCopiedProductionLifecycleWorld") {
	group = "ringworld verification"
	description = "Copies the named production save into the isolated lifecycle run directory."
	inputs.property("ringProductionLifecycleSource",
			providers.gradleProperty("ringProductionLifecycleSource").orElse(""))
	inputs.property("ringProductionLifecycleDestination",
			providers.gradleProperty("ringProductionLifecycleDestination")
					.orElse("RingWorld Production Lifecycle"))
	outputs.dir(lifecycleSavesDirectory)
	// A saved world can change between runs; always refresh only the ignored copy.
	outputs.upToDateWhen { false }
	doLast {
		def source = requireSave(providers.gradleProperty("ringProductionLifecycleSource").orNull,
				"ringProductionLifecycleSource", sourceSavesDirectory)
		def destinationId = checkedSaveId(
				providers.gradleProperty("ringProductionLifecycleDestination")
						.orElse("RingWorld Production Lifecycle").get(),
				"ringProductionLifecycleDestination")
		def destination = new File(lifecycleSavesDirectory, destinationId)
		delete(destination)
		copy {
			from(source.directory)
			into(destination)
		}
		if (!new File(destination, "level.dat").isFile()) {
			throw new GradleException("copied lifecycle save is missing level.dat: " + destination)
		}
		logger.lifecycle("[production-lifecycle] copied source={} destination={}",
				source.directory, destination)
	}
}

tasks.register("prepareCopiedProductionProjectionWorld") {
	group = "ringworld verification"
	description = "Copies the named production-projection source save into its isolated run directory."
	inputs.property("ringProjectionWorld",
			providers.gradleProperty("ringProjectionWorld").orElse(""))
	inputs.property("ringProjectionDestination",
			providers.gradleProperty("ringProjectionDestination")
					.orElse("RingWorld Production Projection"))
	outputs.dir(projectionSavesDirectory)
	// World state can change between runs; refresh only the ignored destination copy.
	outputs.upToDateWhen { false }
	doLast {
		def source = requireSave(providers.gradleProperty("ringProjectionWorld").orNull,
				"ringProjectionWorld", sourceSavesDirectory)
		def destinationId = checkedSaveId(
				providers.gradleProperty("ringProjectionDestination")
						.orElse("RingWorld Production Projection").get(),
				"ringProjectionDestination")
		def destination = new File(projectionSavesDirectory, destinationId)
		delete(destination)
		copy {
			from(source.directory)
			into(destination)
		}
		if (!new File(destination, "level.dat").isFile()) {
			throw new GradleException("copied projection save is missing level.dat: " + destination)
		}
		logger.lifecycle("[projection-capture] copied source={} destination={}",
				source.directory, destination)
	}
}

tasks.named("runLayoutSwitchClient") {
	dependsOn(tasks.named("prepareCopiedLayoutSwitchWorlds"))
}

tasks.named("runProductionProjectionClient") {
	dependsOn(tasks.named("prepareCopiedProductionProjectionWorld"))
}

tasks.named("runProductionLifecycleClient") {
	dependsOn(tasks.named("prepareCopiedProductionLifecycleWorld"))
}

tasks.register("prepareCurvedObjectCapture") {
	group = "ringworld verification"
	description = "Creates a clean safe-small test configuration for curved object captures."
	outputs.dir(file("run-curved-object-capture/config"))
	outputs.upToDateWhen { false }
	doLast {
		delete(file("run-curved-object-capture/saves"))
		delete(file("run-curved-object-capture/screenshots"))
		delete(file("run-curved-object-capture/ringworld-cache"))
		def configDirectory = file("run-curved-object-capture/config")
		configDirectory.mkdirs()
		new File(configDirectory, "ringworld.properties").text = """\
widthBlocks=416
circumferenceBlocks=2048
wallHeightBlocks=160
testMode=true
testViewDistanceChunks=12
pregenerateTerrainAtlas=false
"""
	}
}

tasks.named("runCurvedObjectCaptureClient") {
	dependsOn(tasks.named("prepareCurvedObjectCapture"))
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	testImplementation platform('org.junit:junit-bom:5.11.4')
	testImplementation 'org.junit.jupiter:junit-jupiter'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

processResources {
	inputs.property 'version', project.version
	filesMatching('fabric.mod.json') { expand version: project.version }
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

tasks.named('test') {
	useJUnitPlatform()
}

tasks.withType(Jar).configureEach {
	from(rootProject.file('LICENSE')) {
		rename { 'LICENSE-RINGWORLD.txt' }
	}
}
