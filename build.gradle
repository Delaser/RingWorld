plugins {
	id 'fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

// Qualification invocations are deliberately opt-in.  Normal developer runs
// retain their historic build and run directories, while a matrix cell writes
// only below a reviewed disposable root.
def qualificationRootProperty = providers.gradleProperty("ringQualificationRoot").orNull
def qualificationCellProperty = providers.gradleProperty("ringQualificationCell").orNull
if ((qualificationRootProperty == null) != (qualificationCellProperty == null)) {
	throw new GradleException("ringQualificationRoot and ringQualificationCell must be supplied together")
}

def qualificationEnabled = qualificationRootProperty != null

// A qualification build may exercise broader loader metadata, but that is
// never a normal-development or release default. Keep the raw values shared
// here because Gradle configures both loader projects even when a command
// selects one of them; loader-specific grammar checks run only in the task
// that consumes the value.
def qualificationMinecraftRangeProperty = providers.gradleProperty("ringQualificationMinecraftRange").orNull
def qualificationNeoForgeRangeProperty = providers.gradleProperty("ringQualificationNeoForgeRange").orNull
if (!qualificationEnabled
		&& (qualificationMinecraftRangeProperty != null || qualificationNeoForgeRangeProperty != null)) {
	throw new GradleException("ringQualificationMinecraftRange and ringQualificationNeoForgeRange require ringQualificationRoot and ringQualificationCell")
}

def normalizeQualificationRange = { String propertyName, String rawValue ->
	if (rawValue == null) return null
	def value = rawValue.trim()
	if (value.isEmpty() || rawValue != value || value.length() > 80
			|| ["\"", "'", "\r", "\n", "\t", '$', '{', '}'].any { value.contains(it) }) {
		throw new GradleException("${propertyName} must be a short literal version range without quotes, whitespace padding, or placeholders")
	}
	return value
}

def qualificationMinecraftRange = normalizeQualificationRange(
		"ringQualificationMinecraftRange", qualificationMinecraftRangeProperty)
def qualificationNeoForgeRange = normalizeQualificationRange(
		"ringQualificationNeoForgeRange", qualificationNeoForgeRangeProperty)

def requireFabricQualificationMinecraftRange = { String value ->
	// Fabric version predicates use comparison clauses separated by exactly one
	// space. Requiring both bounds prevents a qualification invocation from
	// accidentally claiming an open-ended compatibility range.
	def clause = "(?:>=|>|<=|<|=|~|\\^)[0-9]+(?:\\.[0-9]+){1,3}(?:[-+._A-Za-z0-9]+)?"
	def boundedPredicate = "^${clause} ${clause}(?: ${clause}){0,2}" + '$'
	if (!(value ==~ boundedPredicate)) {
		throw new GradleException("ringQualificationMinecraftRange is not a bounded Fabric version predicate")
	}
}

def requireNeoForgeQualificationRange = { String propertyName, String value ->
	// NeoForge uses Maven range syntax. Keep the accepted form deliberately
	// small and bounded: one numeric-ish lower and upper release identifier.
	if (!(value ==~ /^[\[(][0-9][0-9A-Za-z._-]{0,63},[0-9][0-9A-Za-z._-]{0,63}[\])]$/)) {
		throw new GradleException("${propertyName} is not a bounded NeoForge/Minecraft Maven version range")
	}
}
File qualificationCellRoot = null
if (qualificationEnabled) {
	def rawRoot = qualificationRootProperty.trim()
	def rawCell = qualificationCellProperty.trim()
	def rootSegments = rawRoot.replace('\\', '/').tokenize('/')
	if (rawRoot.isEmpty() || rawRoot == "." || rawRoot == ".."
			|| rootSegments.contains("..")) {
		throw new GradleException("ringQualificationRoot must not be empty or contain path traversal")
	}
	if (!(rawCell ==~ /[A-Za-z0-9][A-Za-z0-9._-]{0,95}/)
			|| rawCell == "." || rawCell == "..") {
		throw new GradleException("ringQualificationCell must be one safe cell identifier")
	}

	def repositoryRoot = rootDir.canonicalFile
	def requestedRoot = file(rawRoot).canonicalFile
	def allowedRoots = [
			new File(repositoryRoot, "dist/qualification").canonicalFile
	]
	def isWithin = { File child, File parent ->
		child == parent || child.toPath().startsWith(parent.toPath())
	}
	if (!allowedRoots.any { allowed -> isWithin(requestedRoot, allowed) }) {
		throw new GradleException("ringQualificationRoot must be below ${allowedRoots[0]}")
	}
	qualificationCellRoot = new File(requestedRoot, rawCell).canonicalFile
	if (!isWithin(qualificationCellRoot, requestedRoot)) {
		throw new GradleException("ringQualificationCell resolves outside ringQualificationRoot")
	}
	layout.buildDirectory.set(new File(qualificationCellRoot, "build/fabric"))
}

def qualificationRunDirectory = { String historicPath ->
	if (!qualificationEnabled) return historicPath
	def relative = historicPath.startsWith("run/") ? historicPath.substring("run/".length()) : historicPath
	return new File(new File(qualificationCellRoot, "run"), relative).path
}
def qualificationRunFile = { String historicPath -> file(qualificationRunDirectory(historicPath)) }
ext.ringQualificationEnabled = qualificationEnabled
ext.ringQualificationCellRoot = qualificationCellRoot
ext.ringQualificationRunDirectory = qualificationRunDirectory
ext.ringQualificationBuildDirectory = qualificationEnabled
		? new File(qualificationCellRoot, "build") : null
ext.ringQualificationMinecraftRange = qualificationMinecraftRange
ext.ringQualificationNeoForgeRange = qualificationNeoForgeRange
ext.requireFabricQualificationMinecraftRange = requireFabricQualificationMinecraftRange
ext.requireNeoForgeQualificationRange = requireNeoForgeQualificationRange

def fabricMultiplayerPort = {
	def raw = (qualificationEnabled
			? providers.gradleProperty("ringQualificationFabricMultiplayerPort")
					.orElse(providers.gradleProperty("ringQualificationPort"))
					.orElse(providers.gradleProperty("ringFabricMultiplayerPort"))
			: providers.gradleProperty("ringFabricMultiplayerPort"))
			.orElse("25568").get().trim()
	try {
		def port = Integer.parseInt(raw)
		if (port < 1 || port > 65535) throw new NumberFormatException(raw)
		return port
	} catch (NumberFormatException ignored) {
		throw new GradleException("ringFabricMultiplayerPort must be an integer from 1 to 65535")
	}
}

def fabricRaidSeamPort = {
	def raw = (qualificationEnabled
			? providers.gradleProperty("ringQualificationFabricRaidSeamPort")
					.orElse(providers.gradleProperty("ringQualificationRaidSeamPort"))
					.orElse(providers.gradleProperty("ringFabricRaidSeamPort"))
			: providers.gradleProperty("ringFabricRaidSeamPort"))
			.orElse("25567").get().trim()
	try {
		def port = Integer.parseInt(raw)
		if (port < 1 || port > 65535) throw new NumberFormatException(raw)
		return port
	} catch (NumberFormatException ignored) {
		throw new GradleException("ringQualificationRaidSeamPort/ringFabricRaidSeamPort must be an integer from 1 to 65535")
	}
}

repositories {
	mavenCentral()
}

loom {
	splitEnvironmentSourceSets()
	mods {
		"ringworld" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
	runs {
		configureEach {
			if (qualificationEnabled) {
				runDir qualificationRunDirectory("loom/${name}")
			}
		}
		qualificationSmokeServer {
			server()
			name "RingWorld Qualification Smoke Server"
			runDir qualificationRunDirectory("qualification-smoke")
			programArgs "--port", fabricMultiplayerPort().toString(), "nogui"
		}
		multiplayerServer {
			server()
			name "RingWorld Multiplayer Server"
			runDir qualificationRunDirectory("run-multiplayer/server")
			vmArg "-Dringworld.multiplayerTest=true"
			programArg "nogui"
		}
		multiplayerClientA {
			client()
			name "RingWorld Multiplayer Client A"
			runDir qualificationRunDirectory("run-multiplayer/client-a")
			vmArg "-Dringworld.multiplayerTestRole=A"
			vmArg "-Dringworld.multiplayerTestPort=${fabricMultiplayerPort()}"
			programArgs "--username", "RingTesterA"
		}
		multiplayerClientB {
			client()
			name "RingWorld Multiplayer Client B"
			runDir qualificationRunDirectory("run-multiplayer/client-b")
			vmArg "-Dringworld.multiplayerTestRole=B"
			vmArg "-Dringworld.multiplayerTestPort=${fabricMultiplayerPort()}"
			programArgs "--username", "RingTesterB"
		}
		raidSeamArmServer {
			server()
			name "RingWorld Raid Seam Arm Server"
			runDir qualificationRunDirectory("run-raid-seam/server")
			vmArg "-Dringworld.raidSeamTest=true"
			vmArg "-Dringworld.raidSeamTestPhase=arm"
			vmArg "-Dringworld.raidSeamTestStopAfterSave=true"
			programArg "nogui"
		}
		raidSeamReloadServer {
			server()
			name "RingWorld Raid Seam Reload Server"
			runDir qualificationRunDirectory("run-raid-seam/server")
			vmArg "-Dringworld.raidSeamTest=true"
			vmArg "-Dringworld.raidSeamTestPhase=reload"
			programArg "nogui"
		}
		raidSeamClientA {
			client()
			name "RingWorld Raid Seam Client A"
			runDir qualificationRunDirectory("run-raid-seam/client-a")
			vmArg "-Dringworld.multiplayerTestRole=A"
			vmArg "-Dringworld.multiplayerTestPort=${fabricRaidSeamPort()}"
			programArgs "--username", "RingTesterA"
		}
		raidSeamClientB {
			client()
			name "RingWorld Raid Seam Client B"
			runDir qualificationRunDirectory("run-raid-seam/client-b")
			vmArg "-Dringworld.multiplayerTestRole=B"
			vmArg "-Dringworld.multiplayerTestPort=${fabricRaidSeamPort()}"
			programArgs "--username", "RingTesterB"
		}
		layoutSwitchClient {
			client()
			name "RingWorld Layout Switch Client"
			// Never open the source saves in-place: this run receives disposable
			// copies from prepareCopiedLayoutSwitchWorlds below.
			runDir qualificationRunDirectory("run-layout-switch")
			vmArg "-Dringworld.layoutSwitchFirst=" + providers.gradleProperty("ringLayoutSwitchFirstDestination")
					.orElse("RingWorld Layout Switch A").get()
			vmArg "-Dringworld.layoutSwitchSecond=" + providers.gradleProperty("ringLayoutSwitchSecondDestination")
					.orElse("RingWorld Layout Switch B").get()
			vmArg "-Dringworld.layoutSwitchExpectation=" + providers.gradleProperty("ringLayoutSwitchExpectation")
					.orElse("different-layout").get()
		}
		productionProjectionClient {
			client()
			name "RingWorld Production Projection Capture"
			// The projection run opens only the disposable copied world prepared
			// below. It must never open a source checkpoint in place.
			runDir qualificationRunDirectory("run-production-projection")
			vmArg "-Dringworld.captureRingProjection=true"
			vmArg "-Dringworld.projectionWorld=" + providers.gradleProperty("ringProjectionDestination")
					.orElse("RingWorld Production Projection").get()
			vmArg("-Dringworld.projectionViewDistanceChunks="
					+ providers.gradleProperty("ringProjectionViewDistanceChunks")
							.orElse("16").get())
			vmArg("-Dringworld.projectionEnvironment="
					+ providers.gradleProperty("ringProjectionEnvironment")
							.orElse("noon").get())
			vmArg("-Dringworld.projectionGraphicsMode="
					+ providers.gradleProperty("ringProjectionGraphicsMode")
							.orElse("fancy").get())
		}
		productionStreamingProjectionClient {
			client()
			name "RingWorld Production Streaming Projection Capture"
			// This is a distinct early-streaming gate over a disposable copy.
			// The teleport occurs only after the complete Atlas arrives, leaving
			// time to observe the fallback before real chunks reach 0.58V.
			runDir qualificationRunDirectory("run-production-streaming-projection")
			vmArg "-Dringworld.captureRingProjection=true"
			vmArg "-Dringworld.projectionStreamingEdge=true"
			vmArg("-Dringworld.projectionWorld="
					+ providers.gradleProperty("ringStreamingProjectionDestination")
							.orElse("RingWorld Fabric Streaming Projection").get())
			vmArg("-Dringworld.projectionViewDistanceChunks="
					+ providers.gradleProperty("ringStreamingProjectionViewDistanceChunks")
							.orElse("16").get())
			vmArg "-Dringworld.projectionEnvironment=noon"
			vmArg("-Dringworld.projectionGraphicsMode="
					+ providers.gradleProperty("ringStreamingProjectionGraphicsMode")
							.orElse("fabulous").get())
			programArgs "--username", "StreamingTester", "--width", "1280", "--height", "720"
		}
		handoffFoliageCaptureClient {
			client()
			name "RingWorld Handoff Foliage Capture"
			// The fixture mutates only a disposable copy of the complete
			// production save prepared below.
			runDir qualificationRunDirectory("run-handoff-foliage-capture")
			vmArg "-Dringworld.captureRingHandoffFoliage=true"
			vmArg("-Dringworld.handoffFoliageWorld="
					+ providers.gradleProperty("ringHandoffFoliageDestination")
							.orElse("RingWorld Fabric Handoff Foliage").get())
			programArgs "--username", "FoliageTester", "--width", "1280", "--height", "720"
		}
		productionVisualParityClient {
			client()
			name "RingWorld Production Visual Parity"
			// This run receives a fresh copied save and uses server-authoritative
			// poses for the natural seam and both finite-width rims.
			runDir qualificationRunDirectory("run-production-visual-parity")
			vmArg "-Dringworld.captureRingVisualParity=true"
			vmArg("-Dringworld.visualParityWorld="
					+ providers.gradleProperty("ringVisualParityDestination")
							.orElse("RingWorld Fabric Visual Parity").get())
			vmArg("-Dringworld.visualParityViewDistanceChunks="
					+ providers.gradleProperty("ringVisualParityViewDistanceChunks")
							.orElse("16").get())
		}
		productionLifecycleClient {
			client()
			name "RingWorld Production Lifecycle Regression"
			// The client opens only the disposable copied world prepared below.
			// Do not use quick-play: its macOS launch path is nondeterministic.
			runDir qualificationRunDirectory("run-production-lifecycle")
			vmArg "-Dringworld.productionLifecycleTest=true"
			vmArg("-Dringworld.productionLifecycleWorld="
					+ providers.gradleProperty("ringProductionLifecycleDestination")
							.orElse("RingWorld Production Lifecycle").get())
		}
		curvedObjectCaptureClient {
			client()
			name "RingWorld Curved Object Capture"
			runDir qualificationRunDirectory("run-curved-object-capture")
			vmArg "-Dringworld.curvedObjectCapture=true"
			programArgs "--username", "RingObjectTester"
		}
		atlasUiClient {
			client()
			name "RingWorld Atlas UI Regression"
			runDir qualificationRunDirectory("run-atlas-ui")
			vmArg "-Dringworld.atlasUiTest=true"
			vmArg "-Dringworld.atlasUiExpectedBuildLabel=${project.release_label} · ${project.mod_version}"
			// Minecraft login names are limited to 16 characters.
			programArgs "--username", "AtlasUiTester"
		}
		creationUiClient {
			client()
			name "RingWorld Creation UI Regression"
			runDir qualificationRunDirectory("run-creation-ui")
			vmArg "-Dringworld.creationUiTest=true"
			// The menu-only fixture asserts this exact framebuffer at startup.
			programArgs "--username", "CreationUiTester", "--width", "1920", "--height", "1080"
		}
		mapCompassCaptureClient {
			client()
			name "RingWorld Map and Compass Capture"
			runDir qualificationRunDirectory("run-map-compass-capture")
			vmArg "-Dringworld.captureMapCompass=true"
			programArgs "--username", "MapCompassTester"
		}
		strongholdTestServer {
			server()
			name "RingWorld Stronghold Test Server"
			runDir qualificationRunDirectory("run-stronghold-test")
			vmArg "-Dringworld.strongholdTest=true"
			vmArg "-Dringworld.worldgenMatrix=" + providers.gradleProperty("ringWorldgenMatrix")
					.orElse("false").get()
			vmArg "-Dringworld.strongholdTestResume=" + providers.gradleProperty("ringStrongholdTestResume")
					.orElse("false").get()
			programArg "nogui"
		}
		headlessPrewarmServer {
			server()
			name "RingWorld Headless Atlas Prewarm"
			// This is the only launch directory accepted by the checked-in
			// disposable fixture. Never point this launch at a source save.
			runDir qualificationRunDirectory("run-headless-prewarm")
			vmArg "-Dringworld.headlessPrewarm=true"
			vmArg "-Dringworld.headlessPrewarmReport=" + providers.gradleProperty("ringHeadlessPrewarmResult")
					.orElse("result.json").get()
			programArg "nogui"
		}
	}
}

// Loader-neutral Minecraft code remains in the conventional main/client
// trees. Fabric-owned entrypoints, lifecycle hooks, networking transports,
// environment lookup, and launch adapters live in explicit platform trees so
// the same common sources can be compiled by the future NeoForge module.
sourceSets.main.java.srcDir 'src/platform/fabric/java'
sourceSets.main.resources.srcDir 'src/platform/fabric/resources'
sourceSets.client.java.srcDir 'src/platform/fabricClient/java'

def checkedSaveId = { String value, String propertyName ->
	def saveId = value == null ? "" : value.trim()
	if (saveId.isEmpty() || saveId == "." || saveId == ".."
				|| saveId.contains("/") || saveId.indexOf(92) >= 0) {
		throw new GradleException("-${propertyName} must be a single existing save-folder identifier")
	}
	return saveId
}

def requireSave = { String value, String propertyName, File savesDirectory ->
	def saveId = checkedSaveId(value, propertyName)
	def worldDirectory = new File(savesDirectory, saveId)
	if (!new File(worldDirectory, "level.dat").isFile()) {
		throw new GradleException("-${propertyName}='${saveId}' is not an existing save under "
				+ savesDirectory + " (expected " + new File(worldDirectory, "level.dat") + ")")
	}
	return [id: saveId, directory: worldDirectory]
}

def sourceSavesDirectory = qualificationRunFile("run/saves")
def layoutSwitchSavesDirectory = qualificationRunFile("run-layout-switch/saves")
def projectionSavesDirectory = qualificationRunFile("run-production-projection/saves")
def streamingProjectionRunDirectory = qualificationRunFile("run-production-streaming-projection")
def streamingProjectionSavesDirectory = new File(streamingProjectionRunDirectory, "saves")
def handoffFoliageRunDirectory = qualificationRunFile("run-handoff-foliage-capture")
def handoffFoliageSavesDirectory = new File(handoffFoliageRunDirectory, "saves")
def visualParitySavesDirectory = qualificationRunFile("run-production-visual-parity/saves")
def lifecycleSavesDirectory = qualificationRunFile("run-production-lifecycle/saves")
def strongholdTestDirectory = qualificationRunFile("run-stronghold-test")
def headlessPrewarmDirectory = qualificationRunFile("run-headless-prewarm")
def raidSeamDirectory = qualificationRunFile("run-raid-seam")

def requireFabricRuntimeGateLog = { File logFile, String passMarker,
									 String failMarker, String label ->
	def log = logFile.isFile() ? logFile.getText("UTF-8") : ""
	if (!log.contains(passMarker) || log.contains(failMarker)) {
		throw new GradleException("${label} did not pass; inspect ${logFile}")
	}
}

// A rendered-all-sections result does not prove that the integrated server has
// supplied the entire configured handoff radius. Require the capture client's
// explicit contiguous-X observation plus the renderer's complete vanilla-
// shaped 2-D window proof, so emergency Atlas coverage cannot masquerade as a
// settled Experiment 19 handoff.
def requireProjectionSettledRadius = { File logFile, String label ->
	def log = logFile.isFile() ? logFile.getText("UTF-8") : ""
	def markerLines = log.readLines().findAll {
		it.contains("[projection-capture] handoff capture armed at requestedChunks=")
	}
	if (markerLines.isEmpty()) {
		throw new GradleException(
				"${label} is missing the settled handoff-radius marker: ${logFile}")
	}
	def matcher = (markerLines.last() =~ /requestedChunks=(\d+), effectiveChunks=(\d+), loadedX=\+(\d+)\/-(\d+)/)
	if (!matcher.find()) {
		throw new GradleException(
				"${label} has a malformed settled handoff-radius marker: ${logFile}")
	}
	int requestedChunks = matcher.group(1).toInteger()
	int effectiveChunks = matcher.group(2).toInteger()
	int loadedPositiveX = matcher.group(3).toInteger()
	int loadedNegativeX = matcher.group(4).toInteger()
	if (requestedChunks <= 0 || effectiveChunks != requestedChunks
			|| loadedPositiveX != effectiveChunks
			|| loadedNegativeX != effectiveChunks
			|| !markerLines.last().contains("streamingWindowComplete=true")) {
		throw new GradleException(
				"${label} did not capture a full settled drawable handoff window "
						+ "(requested=${requestedChunks}, effective=${effectiveChunks}, "
						+ "loadedX=+${loadedPositiveX}/-${loadedNegativeX}): ${logFile}")
	}
}
ext.requireProjectionSettledRadius = requireProjectionSettledRadius

// The early-streaming fixture is valid only while the real contiguous radius
// remains inside the fixed 0.58V proxy onset. Bind the screenshot to both the
// measured chunks and the renderer-published opaque-near fallback state.
def requireProjectionStreamingFallback = { File logFile, String label ->
	def log = logFile.isFile() ? logFile.getText("UTF-8") : ""
	if (!log.contains("[projection-capture] result=true, streaming fallback capture complete")
			|| log.contains("[projection-capture] result=false")) {
		throw new GradleException("${label} did not pass; inspect ${logFile}")
	}
	def markerLines = log.readLines().findAll {
		it.contains("[projection-capture] streaming fallback armed at requestedChunks=")
	}
	if (markerLines.size() != 1) {
		throw new GradleException(
				"${label} requires exactly one streaming fallback marker: ${logFile}")
	}
	def number = /([+\-0-9.Ee]+)/
	def matcher = (markerLines.first() =~ /requestedChunks=(\d+), effectiveChunks=(\d+), loadedX=\+(\d+)\/-(\d+), incompleteWindow=(true|false), renderedAllSections=(true|false), missingChunks=(\d+), missingNonXChunk=(true|false), firstMissingChunk=\((-?\d+),(-?\d+)\), fixedProxyOnsetBlocks=${number}, fallbackStartBlocks=${number}, fallbackOpaqueFromBlocks=${number}, proxyDrawn=${number}, targetDistance=${number}, pitch=${number}, surfaceY=${number}, graphics=(fast|fancy|fabulous), clouds=off, hudHidden=(true|false), fov=(\d+), time=(\d+), rain=${number}, thunder=${number}, framebuffer=(\d+)x(\d+)/)
	if (!matcher.find()) {
		throw new GradleException(
				"${label} has a malformed streaming fallback marker: ${logFile}")
	}
	int requested = matcher.group(1).toInteger()
	int effective = matcher.group(2).toInteger()
	int loadedPositive = matcher.group(3).toInteger()
	int loadedNegative = matcher.group(4).toInteger()
	boolean incompleteWindow = matcher.group(5).toBoolean()
	boolean renderedAllSections = matcher.group(6).toBoolean()
	int missingChunks = matcher.group(7).toInteger()
	boolean missingNonXChunk = matcher.group(8).toBoolean()
	double onset = Double.parseDouble(matcher.group(11))
	double fallbackStart = Double.parseDouble(matcher.group(12))
	double fallbackEnd = Double.parseDouble(matcher.group(13))
	double proxyDrawn = Double.parseDouble(matcher.group(14))
	double targetDistance = Double.parseDouble(matcher.group(15))
	double pitch = Double.parseDouble(matcher.group(16))
	double surfaceY = Double.parseDouble(matcher.group(17))
	String graphics = matcher.group(18)
	boolean hudHidden = matcher.group(19).toBoolean()
	int fov = matcher.group(20).toInteger()
	long dayTime = matcher.group(21).toLong()
	double rain = Double.parseDouble(matcher.group(22))
	double thunder = Double.parseDouble(matcher.group(23))
	int framebufferWidth = matcher.group(24).toInteger()
	int framebufferHeight = matcher.group(25).toInteger()
	int minimumLoaded = Math.min(loadedPositive, loadedNegative)
	if (requested <= 0 || effective != requested || minimumLoaded < 2
			|| minimumLoaded * 16.0D >= onset
			|| !incompleteWindow || (renderedAllSections && !missingNonXChunk)
			|| (renderedAllSections && missingChunks <= 0)
			|| !Double.isFinite(onset) || !Double.isFinite(fallbackStart)
			|| !Double.isFinite(fallbackEnd) || !Double.isFinite(targetDistance)
			|| !Double.isFinite(pitch) || !Double.isFinite(surfaceY)
			|| Math.abs(fallbackStart) > 0.05D || Math.abs(fallbackEnd) > 0.05D
			|| !Double.isFinite(proxyDrawn) || Math.abs(proxyDrawn - 1.0D) > 0.001D
			|| !hudHidden || fov != 70 || dayTime != 6_000L
			|| !Double.isFinite(rain) || Math.abs(rain) > 0.001D
			|| !Double.isFinite(thunder) || Math.abs(thunder) > 0.001D
			|| framebufferWidth != 1_280 || framebufferHeight != 720
			|| targetDistance <= 0.0D || targetDistance >= onset) {
		throw new GradleException(
				"${label} did not prove bounded pre-onset fallback coverage "
						+ "(requested=${requested}, effective=${effective}, "
						+ "loadedX=+${loadedPositive}/-${loadedNegative}, "
						+ "incomplete=${incompleteWindow}, renderedAll=${renderedAllSections}, "
						+ "missing=${missingChunks}, missingNonX=${missingNonXChunk}, "
						+ "onset=${onset}, fallback=${fallbackStart}..${fallbackEnd}): ${logFile}")
	}
	def policyLines = log.readLines().findAll {
		it.contains("[projection-capture] applied unattended focus policy and pre-login ")
	}
	def policy = policyLines.size() == 1
			? (policyLines.first() =~ /view distance=(\d+) chunks, graphics=(fast|fancy|fabulous), clouds=off, hudHidden=true, fov=(\d+)/)
			: null
	if (policy == null || !policy.find()
			|| policy.group(1).toInteger() != requested
			|| policy.group(2) != graphics || policy.group(3).toInteger() != fov) {
		throw new GradleException(
				"${label} did not bind its pre-login and capture-time policy: ${logFile}")
	}
	def drainLines = log.readLines().findAll {
		it.contains("[projection-capture] streaming drain complete requestedChunks=")
	}
	if (drainLines.size() != 1) {
		throw new GradleException(
				"${label} requires exactly one post-capture drain marker: ${logFile}")
	}
	def drain = (drainLines.first() =~ /requestedChunks=(\d+), missingChunks=(\d+), renderedAllSections=(true|false), streamingWindowComplete=(true|false), stableTicks=(\d+)/)
	if (!drain.find() || drain.group(1).toInteger() != requested
			|| drain.group(2).toInteger() != 0
			|| !drain.group(3).toBoolean() || !drain.group(4).toBoolean()
			|| drain.group(5).toInteger() < 20
			|| log.indexOf(drainLines.first()) <= log.indexOf(markerLines.first())
			|| log.indexOf("[projection-capture] result=true, streaming fallback capture complete")
					<= log.indexOf(drainLines.first())) {
		throw new GradleException(
				"${label} did not prove a drained post-capture window: ${logFile}")
	}
}
ext.requireProjectionStreamingFallback = requireProjectionStreamingFallback

// The legacy terrain shaders reconstruct the exact dynamic colour envelope of
// the proxy drawn after section setup and before live terrain. Bind evidence to that
// published state so a broad rain/Atlas tone drift cannot pass a one-row image
// continuity check merely because it is gradual.
def requireProjectionRevealScale = { File logFile, String label, String environment ->
	def markerLines = logFile.isFile() ? logFile.readLines("UTF-8").findAll {
		it.contains("[projection-capture] handoff capture armed at requestedChunks=")
	} : []
	if (markerLines.isEmpty()) {
		throw new GradleException(
				"${label} is missing the proxy reveal-scale marker: ${logFile}")
	}
	def matcher = (markerLines.last() =~ /proxyRevealScale=([+\-0-9.Ee]+)/)
	if (!matcher.find()) {
		throw new GradleException(
				"${label} has a malformed proxy reveal-scale marker: ${logFile}")
	}
	double scale
	try {
		scale = Double.parseDouble(matcher.group(1))
	} catch (NumberFormatException failure) {
		throw new GradleException(
				"${label} has an invalid proxy reveal scale: ${logFile}", failure)
	}
	boolean rain = environment == "rain"
	if (!Double.isFinite(scale) || scale < 0.0D || scale > 1.0D
			|| (rain ? scale > 0.05D : scale < 0.95D)) {
		throw new GradleException(
				"${label} has proxy reveal scale ${scale} for ${environment}: ${logFile}")
	}
}
ext.requireProjectionRevealScale = requireProjectionRevealScale

def requireProjectionGraphicsMode = { File logFile, String label, String expected ->
	expected = expected.trim().toLowerCase(Locale.ROOT)
	def markerLines = logFile.isFile() ? logFile.readLines("UTF-8").findAll {
		it.contains("[projection-capture] applied unattended focus policy and pre-login ")
	} : []
	if (markerLines.size() != 1
			|| !markerLines.first().contains("graphics=${expected}")) {
		throw new GradleException(
				"${label} did not bind graphics=${expected}: ${logFile}")
	}
}
ext.requireProjectionGraphicsMode = requireProjectionGraphicsMode

def requirePartialAtlasHandoff = { File logFile, String label ->
	def policyLines = logFile.isFile() ? logFile.readLines("UTF-8").findAll {
		it.contains("[atlas-ui-test] applied pre-login view distance=")
	} : []
	if (policyLines.size() != 1
			|| !policyLines.first().contains(
					"view distance=6, graphics=fancy, clouds=off, fov=70")) {
		throw new GradleException(
				"${label} did not bind its pre-login partial-capture policy: ${logFile}")
	}
	def markerLines = logFile.isFile() ? logFile.readLines("UTF-8").findAll {
		it.contains("[atlas-ui-test] partial-handoff requestedChunks=")
	} : []
	if (markerLines.size() != 1) {
		throw new GradleException(
				"${label} requires exactly one partial-handoff marker: ${logFile}")
	}
	def matcher = (markerLines.first() =~ /requestedChunks=(\d+), effectiveChunks=(\d+), loadedX=\+(\d+)\/-(\d+), presentCells=(\d+), totalCells=(\d+), visibleCompletion=([+\-0-9.Ee]+), generationFog=([+\-0-9.Ee]+), proxyRevealScale=([+\-0-9.Ee]+), streamingWindowComplete=(true|false), pitch=([+\-0-9.Ee]+), graphics=fancy, clouds=off, hudHidden=true, fov=(\d+), time=(\d+), rain=([+\-0-9.Ee]+)/)
	if (!matcher.find()) {
		throw new GradleException(
				"${label} has a malformed partial-handoff marker: ${logFile}")
	}
	int requested = matcher.group(1).toInteger()
	int effective = matcher.group(2).toInteger()
	int loadedPositive = matcher.group(3).toInteger()
	int loadedNegative = matcher.group(4).toInteger()
	int present = matcher.group(5).toInteger()
	int total = matcher.group(6).toInteger()
	double visible = Double.parseDouble(matcher.group(7))
	double generationFog = Double.parseDouble(matcher.group(8))
	double revealScale = Double.parseDouble(matcher.group(9))
	boolean streamingWindowComplete = matcher.group(10).toBoolean()
	double pitch = Double.parseDouble(matcher.group(11))
	int fov = matcher.group(12).toInteger()
	long dayTime = matcher.group(13).toLong()
	double rain = Double.parseDouble(matcher.group(14))
	if (requested != 6 || effective != requested
			|| loadedPositive != effective || loadedNegative != effective
			|| present <= 0 || present >= total || total <= 0
			|| !Double.isFinite(visible) || visible <= 0.0D || visible >= 0.95D
			|| !Double.isFinite(generationFog) || generationFog < 0.0D
			|| generationFog >= 1.0D
			|| !Double.isFinite(revealScale) || revealScale <= 0.0D
			|| revealScale >= 0.95D
			|| !streamingWindowComplete
			|| !Double.isFinite(pitch)
			|| fov != 70 || dayTime != 6_000L
			|| !Double.isFinite(rain) || Math.abs(rain) > 0.001D
			|| Math.abs(revealScale - (1.0D - generationFog)) > 0.01D) {
		throw new GradleException(
				"${label} did not prove a settled partial Atlas handoff: ${logFile}")
	}
}
ext.requirePartialAtlasHandoff = requirePartialAtlasHandoff

def requireReadablePng = { File screenshot, String label ->
	if (!screenshot.isFile()) {
		throw new GradleException("${label} is missing ${screenshot}")
	}
	def input = javax.imageio.ImageIO.createImageInputStream(screenshot)
	if (input == null) {
		throw new GradleException("${label} is not a readable image: ${screenshot}")
	}
	try {
		def readers = javax.imageio.ImageIO.getImageReaders(input)
		if (!readers.hasNext()) {
			throw new GradleException("${label} is not a decodable image: ${screenshot}")
		}
		def reader = readers.next()
		try {
			if (!reader.formatName.equalsIgnoreCase("png")) {
				throw new GradleException("${label} is not a PNG: ${screenshot}")
			}
			reader.setInput(input, true, true)
			def width = reader.getWidth(0)
			def height = reader.getHeight(0)
			if (width < 16 || height < 16 || width > 16_384 || height > 16_384) {
				throw new GradleException(
						"${label} has unsafe dimensions ${width}x${height}: ${screenshot}")
			}
			def image = reader.read(0)
			if (image == null || image.width != width || image.height != height) {
				throw new GradleException("${label} did not decode correctly: ${screenshot}")
			}
		} catch (GradleException failure) {
			throw failure
		} catch (Exception failure) {
			throw new GradleException("${label} is corrupt: ${screenshot}", failure)
		} finally {
			reader.dispose()
		}
	} finally {
		input.close()
	}
}

def requireNonUniformPng = { File screenshot, String label ->
	requireReadablePng(screenshot, label)
	def image = javax.imageio.ImageIO.read(screenshot)
	if (image == null) {
		throw new GradleException("${label} did not decode correctly: ${screenshot}")
	}
	Integer firstVisiblePixel = null
	boolean nonUniform = false
	for (int y = 0; y < image.height && !nonUniform; y++) {
		for (int x = 0; x < image.width; x++) {
			int pixel = image.getRGB(x, y)
			if ((pixel >>> 24) != 0) {
				if (firstVisiblePixel == null) {
					firstVisiblePixel = pixel
				} else if (pixel != firstVisiblePixel) {
					nonUniform = true
					break
				}
			}
		}
	}
	if (firstVisiblePixel == null || !nonUniform) {
		throw new GradleException("${label} is blank or uniform: ${screenshot}")
	}
}

// A complete production Atlas must contribute terrain detail when the camera
// looks radially across the ring. A flat fog-colour strip previously passed
// the readable-PNG check after 1.21.1 overwrote the proxy reveal state.
def requireProjectionAtlasDetail = { File screenshot, String label ->
	requireReadablePng(screenshot, label)
	def image = javax.imageio.ImageIO.read(screenshot)
	if (image == null) {
		throw new GradleException("${label} did not decode correctly: ${screenshot}")
	}
	int x0 = Math.floor(image.width * 0.475) as int
	int x1 = Math.ceil(image.width * 0.525) as int
	int y0 = Math.floor(image.height * 0.05) as int
	int y1 = Math.ceil(image.height * 0.95) as int
	def quantizedColours = new HashSet<Integer>()
	for (int y = y0; y < y1; y++) {
		for (int x = x0; x < x1; x++) {
			int pixel = image.getRGB(x, y)
			if ((pixel >>> 24) != 0) {
				int quantized = ((pixel >>> 19) & 0x1F) << 10
				quantized |= ((pixel >>> 11) & 0x1F) << 5
				quantized |= (pixel >>> 3) & 0x1F
				quantizedColours.add(quantized)
			}
		}
	}
	if (quantizedColours.size() < 16) {
		throw new GradleException(
				"${label} has no textured Atlas detail in its radial-up band "
						+ "(${quantizedColours.size()} quantized colours): ${screenshot}")
	}
}
ext.requireProjectionAtlasDetail = requireProjectionAtlasDetail

// The production handoff view is deliberately water-dominant. Average a
// central band by scanline so terrain texture remains legal while the old
// one-row live/proxy cutoff (or a pale sky leak) fails closed.
def requireProjectionHandoffContinuity = { File screenshot, String label ->
	requireReadablePng(screenshot, label)
	def image = javax.imageio.ImageIO.read(screenshot)
	if (image == null) {
		throw new GradleException("${label} did not decode correctly: ${screenshot}")
	}
	int x0 = Math.floor(image.width * 0.42) as int
	int x1 = Math.ceil(image.width * 0.67) as int
	int y0 = Math.floor(image.height * 0.42) as int
	int y1 = Math.ceil(image.height * 0.72) as int
	if (x1 - x0 < 2 || y1 - y0 < 2) {
		throw new GradleException("${label} is too small for handoff analysis: ${screenshot}")
	}
	double[] previous = null
	double maximumAdjacentJump = 0.0D
	def quantizedColours = new HashSet<Integer>()
	for (int y = y0; y < y1; y++) {
		long red = 0L
		long green = 0L
		long blue = 0L
		for (int x = x0; x < x1; x++) {
			int pixel = image.getRGB(x, y)
			red += (pixel >>> 16) & 0xFF
			green += (pixel >>> 8) & 0xFF
			blue += pixel & 0xFF
			int quantized = ((pixel >>> 19) & 0x1F) << 10
			quantized |= ((pixel >>> 11) & 0x1F) << 5
			quantized |= (pixel >>> 3) & 0x1F
			quantizedColours.add(quantized)
		}
		double samples = x1 - x0
		double[] current = [red / samples, green / samples, blue / samples]
		if (previous != null) {
			double jump = Math.abs(current[0] - previous[0])
					+ Math.abs(current[1] - previous[1])
					+ Math.abs(current[2] - previous[2])
			maximumAdjacentJump = Math.max(maximumAdjacentJump, jump)
		}
		previous = current
	}
	if (quantizedColours.size() < 8) {
		throw new GradleException(
				"${label} has no visible terrain detail in its handoff band "
						+ "(${quantizedColours.size()} quantized colours): ${screenshot}")
	}
	if (maximumAdjacentJump > 75.0D) {
		throw new GradleException(String.format(Locale.ROOT,
				"%s has an abrupt live/Atlas handoff (adjacent-row RGB jump %.2f): %s",
				label, maximumAdjacentJump, screenshot))
	}
}
ext.requireProjectionHandoffContinuity = requireProjectionHandoffContinuity

def verifyFabricProjectionOutputs = { File runDirectory, String environment ->
	def normalizedEnvironment = environment.trim().toLowerCase(Locale.ROOT)
	if (!(normalizedEnvironment in ["noon", "dusk", "night", "rain"])) {
		throw new GradleException(
				"ringProjectionEnvironment must be one of noon, dusk, night, or rain")
	}
	def logFile = new File(runDirectory, "logs/latest.log")
	requireFabricRuntimeGateLog(logFile,
			"[projection-capture] result=true, captures complete",
			"[projection-capture] result=false", "Fabric projection capture")
	requireProjectionSettledRadius(logFile, "Fabric projection capture")
	requireProjectionRevealScale(
			logFile, "Fabric projection capture", normalizedEnvironment)
	def prefix = normalizedEnvironment == "noon"
			? "ringworld-projection-" : "ringworld-projection-${normalizedEnvironment}-"
	["tangent", "handoff", "up"].each { view ->
		requireReadablePng(new File(runDirectory, "screenshots/${prefix}${view}.png"),
				"Fabric projection capture")
	}
	requireProjectionAtlasDetail(
			new File(runDirectory, "screenshots/${prefix}up.png"),
			"Fabric projection capture")
	requireProjectionHandoffContinuity(
			new File(runDirectory, "screenshots/${prefix}handoff.png"),
			"Fabric projection capture")
}

def handoffFoliageRoi = { java.awt.image.BufferedImage image ->
	int x0 = Math.max(0, image.width.intdiv(8))
	int x1 = Math.min(image.width, image.width - image.width.intdiv(8))
	int y0 = Math.max(0, image.height.intdiv(8))
	int y1 = Math.min(image.height, image.height - image.height.intdiv(8))
	if (image.width < 320 || image.height < 180 || x1 <= x0 || y1 <= y0) {
		throw new GradleException(
				"handoff foliage screenshot is too small: ${image.width}x${image.height}")
	}
	[x0, x1, y0, y1]
}

// Every diagnostic plane is centred on the final Atlas ray. At the fixed
// 1280x720/FOV-70 capture geometry this conservative box is covered by all
// seven planes, while the broader ROI above remains useful as background
// telemetry. Keep the two roles separate so animated water cannot dilute the
// foliage-local history check.
def handoffFoliageFocusedRoi = { java.awt.image.BufferedImage image ->
	if (image.width != 1280 || image.height != 720) {
		throw new GradleException(
				"handoff foliage screenshot must be exactly 1280x720, got "
						+ "${image.width}x${image.height}")
	}
	[image.width * 7 / 16, image.width * 9 / 16,
			image.height * 3 / 8, image.height * 5 / 8]*.intValue()
}

def requireHandoffFoliageDetail = { File screenshot, String label ->
	requireReadablePng(screenshot, label)
	def image = javax.imageio.ImageIO.read(screenshot)
	def roi = handoffFoliageFocusedRoi(image)
	def quantizedColours = new HashSet<Integer>()
	int minimumLuma = 255
	int maximumLuma = 0
	long greenDominant = 0L
	long samples = 0L
	for (int y = roi[2]; y < roi[3]; y++) {
		for (int x = roi[0]; x < roi[1]; x++) {
			int pixel = image.getRGB(x, y)
			int red = (pixel >>> 16) & 0xFF
			int green = (pixel >>> 8) & 0xFF
			int blue = pixel & 0xFF
			int quantized = (red >>> 3) << 10 | (green >>> 3) << 5 | blue >>> 3
			quantizedColours.add(quantized)
			int luma = (red * 3 + green * 6 + blue) / 10
			minimumLuma = Math.min(minimumLuma, luma)
			maximumLuma = Math.max(maximumLuma, luma)
			if (green >= red + 5 && green >= blue + 5) greenDominant++
			samples++
		}
	}
	logger.lifecycle(
			"[handoff-foliage-verifier] ${label} focused detail colours=${quantizedColours.size()}, "
					+ "lumaRange=${maximumLuma - minimumLuma}, greenPixels=${greenDominant}/${samples}")
	if (quantizedColours.size() < 32 || maximumLuma - minimumLuma < 24
			|| greenDominant * 20L < samples) {
		throw new GradleException(
				"${label} has a trivial foliage ROI (colours=${quantizedColours.size()}, "
						+ "lumaRange=${maximumLuma - minimumLuma}, "
						+ "greenPixels=${greenDominant}/${samples}): ${screenshot}")
	}
}

def handoffFoliageRgbL1 = { int first, int second ->
	Math.abs(((first >>> 16) & 0xFF) - ((second >>> 16) & 0xFF))
			+ Math.abs(((first >>> 8) & 0xFF) - ((second >>> 8) & 0xFF))
			+ Math.abs((first & 0xFF) - (second & 0xFF))
}

def handoffFoliageAveragePixel = { int first, int second ->
	int red = ((((first >>> 16) & 0xFF) + ((second >>> 16) & 0xFF)) / 2).intValue()
	int green = ((((first >>> 8) & 0xFF) + ((second >>> 8) & 0xFF)) / 2).intValue()
	int blue = (((first & 0xFF) + (second & 0xFF)) / 2).intValue()
	(red << 16) | (green << 8) | blue
}

def logHandoffFoliageBroadDifference = { java.awt.image.BufferedImage first,
		java.awt.image.BufferedImage second, String label ->
	def roi = handoffFoliageRoi(first)
	long total = 0L
	int overTwentyFour = 0
	int count = 0
	for (int y = roi[2]; y < roi[3]; y++) {
		for (int x = roi[0]; x < roi[1]; x++) {
			int difference = handoffFoliageRgbL1(first.getRGB(x, y), second.getRGB(x, y))
			total += difference
			if (difference > 24) overTwentyFour++
			count++
		}
	}
	logger.lifecycle(String.format(Locale.ROOT,
			"[handoff-foliage-verifier] %s broad-background meanRgbL1=%.6f, over24=%.6f",
			label, total / (double)count, overTwentyFour / (double)count))
}

def requireHandoffFoliageRepeatability = { Map<String, File> files, String label ->
	def images = files.collectEntries { id, file ->
		def image = javax.imageio.ImageIO.read(file)
		if (image == null || image.width != 1280 || image.height != 720) {
			throw new GradleException(
					"${label} ${id} is missing or not an exact 1280x720 PNG: ${file}")
		}
		[(id): image]
	}
	def roi = handoffFoliageFocusedRoi(images["center-a"])
	def maskImage = new java.awt.image.BufferedImage(
			1280, 720, java.awt.image.BufferedImage.TYPE_INT_ARGB)
	def residualImage = new java.awt.image.BufferedImage(
			1280, 720, java.awt.image.BufferedImage.TYPE_INT_ARGB)
	def residuals = [] as ArrayList<Integer>
	long residualTotal = 0L
	int overTwentyFour = 0
	int minimumX = Integer.MAX_VALUE
	int maximumX = Integer.MIN_VALUE
	int minimumY = Integer.MAX_VALUE
	int maximumY = Integer.MIN_VALUE
	for (int y = roi[2]; y < roi[3]; y++) {
		for (int x = roi[0]; x < roi[1]; x++) {
			int a0 = images["center-a"].getRGB(x, y)
			int a1 = images["center-a-control"].getRGB(x, y)
			int b0 = images["center-b"].getRGB(x, y)
			int b1 = images["center-b-control"].getRGB(x, y)
			int e0 = images["empty-a"].getRGB(x, y)
			int e1 = images["empty-b"].getRGB(x, y)
			int averageA = handoffFoliageAveragePixel(a0, a1)
			int averageB = handoffFoliageAveragePixel(b0, b1)
			int averageEmpty = handoffFoliageAveragePixel(e0, e1)
			int temporalA = handoffFoliageRgbL1(a0, a1)
			int temporalB = handoffFoliageRgbL1(b0, b1)
			int temporalEmpty = handoffFoliageRgbL1(e0, e1)
			int redA = (averageA >>> 16) & 0xFF
			int greenA = (averageA >>> 8) & 0xFF
			int blueA = averageA & 0xFF
			int redB = (averageB >>> 16) & 0xFF
			int greenB = (averageB >>> 8) & 0xFF
			int blueB = averageB & 0xFF
			boolean foliageChromaA = (greenA >= redA + 5 && greenA >= blueA + 5)
					|| (redA >= greenA + 10 && blueA + 4 >= greenA)
			boolean foliageChromaB = (greenB >= redB + 5 && greenB >= blueB + 5)
					|| (redB >= greenB + 10 && blueB + 4 >= greenB)
			int foregroundA = handoffFoliageRgbL1(averageA, averageEmpty)
			int foregroundB = handoffFoliageRgbL1(averageB, averageEmpty)
			boolean presentA = foliageChromaA
					&& temporalA <= 18 && temporalEmpty <= 18 && foregroundA >= 30
			boolean presentB = foliageChromaB
					&& temporalB <= 18 && temporalEmpty <= 18 && foregroundB >= 30
			// The union makes directionally missing foliage a large residual
			// instead of silently dropping it from the acceptance mask.
			boolean inMask = presentA || presentB
			if (!inMask) continue
			maskImage.setRGB(x, y, 0xFFFFFFFF as int)
			minimumX = Math.min(minimumX, x)
			maximumX = Math.max(maximumX, x)
			minimumY = Math.min(minimumY, y)
			maximumY = Math.max(maximumY, y)
			int rawHistory = handoffFoliageRgbL1(averageA, averageB)
			int temporalAllowance = Math.max(temporalEmpty, Math.max(temporalA, temporalB))
			int residual = Math.max(0, rawHistory - temporalAllowance)
			residuals.add(residual)
			residualTotal += residual
			if (residual > 24) overTwentyFour++
			int heat = Math.min(255, residual * 8)
			residualImage.setRGB(x, y, (0xFF000000 | heat << 16) as int)
		}
	}
	int maskPixels = residuals.size()
	int horizontalSpan = maskPixels == 0 ? 0 : maximumX - minimumX + 1
	int verticalSpan = maskPixels == 0 ? 0 : maximumY - minimumY + 1
	def maskFile = new File(files["center-a"].parentFile,
			"ringworld-handoff-foliage-mask.png")
	def residualFile = new File(files["center-a"].parentFile,
			"ringworld-handoff-foliage-history-residual.png")
	javax.imageio.ImageIO.write(maskImage, "PNG", maskFile)
	javax.imageio.ImageIO.write(residualImage, "PNG", residualFile)
	if (maskPixels < 512 || horizontalSpan < 80 || verticalSpan < 80) {
		throw new GradleException(
				"${label} does not expose the layered foliage fixture "
						+ "(maskPixels=${maskPixels}, span=${horizontalSpan}x${verticalSpan}): "
						+ maskFile)
	}
	java.util.Collections.sort(residuals)
	double mean = residualTotal / (double)maskPixels
	int p99 = residuals[Math.max(0, (int)Math.ceil(maskPixels * 0.99D) - 1)]
	double overFraction = overTwentyFour / (double)maskPixels
	logger.lifecycle(String.format(Locale.ROOT,
			"[handoff-foliage-verifier] %s foliage-mask pixels=%d, span=%dx%d, "
					+ "historyResidualMean=%.6f, p99=%d, over24=%.6f",
			label, maskPixels, horizontalSpan, verticalSpan, mean, p99, overFraction))
	logHandoffFoliageBroadDifference(
			images["center-a"], images["center-b"], label)
	if (mean > 1.5D || p99 > 12 || overFraction > 0.005D) {
		throw new GradleException(String.format(Locale.ROOT,
				"%s foliage is camera-history dependent after temporal-noise subtraction "
						+ "(meanRgbL1=%.6f, p99=%d, over24=%.6f): %s",
				label, mean, p99, overFraction, residualFile))
	}
}

def requireHandoffShaderBindingContract = {
	def shaderRoot = file("src/client/resources/assets/minecraft/shaders/core")
	def programIds = ["rendertype_solid", "rendertype_cutout",
			"rendertype_cutout_mipped", "rendertype_translucent", "rendertype_tripwire"]
	def fragments = new HashSet<String>()
	programIds.each { id ->
		def programFile = new File(shaderRoot, "${id}.json")
		if (!programFile.isFile()) {
			throw new GradleException("missing legacy handoff shader program ${programFile}")
		}
		def program = new groovy.json.JsonSlurper().parse(programFile)
		def revealUniforms = program.uniforms.findAll {
			it.name == "RingWorldLegacyProxyRevealScale"
		}
		if (revealUniforms.size() != 1 || revealUniforms.first().type != "float"
				|| revealUniforms.first().count != 1) {
			throw new GradleException(
					"${programFile} does not declare the exact proxy reveal uniform")
		}
		def drawnUniforms = program.uniforms.findAll {
			it.name == "RingWorldLegacyProxyDrawn"
		}
		if (drawnUniforms.size() != 1 || drawnUniforms.first().type != "float"
				|| drawnUniforms.first().count != 1) {
			throw new GradleException(
					"${programFile} does not declare the exact proxy-drawn uniform")
		}
		fragments.add(program.fragment.toString())
	}
	fragments.each { fragment ->
		def fragmentFile = new File(shaderRoot, "${fragment}.fsh")
		def source = fragmentFile.isFile() ? fragmentFile.getText("UTF-8") : ""
		if (!source.contains("#moj_import <ringworld_handoff.glsl>")) {
			throw new GradleException(
					"${fragmentFile} does not consume the legacy handoff include")
		}
	}
	def includeFile = file(
			"src/client/resources/assets/minecraft/shaders/include/ringworld_handoff.glsl")
	def include = includeFile.isFile() ? includeFile.getText("UTF-8") : ""
	if (!include.contains("uniform float RingWorldLegacyProxyRevealScale;")
			|| !include.contains("clamp(RingWorldLegacyProxyRevealScale, 0.0, 1.0)")
			|| !include.contains("uniform float RingWorldLegacyProxyDrawn;")
			|| !include.contains("clamp(RingWorldLegacyProxyDrawn, 0.0, 1.0)")) {
		throw new GradleException("${includeFile} does not publish and consume the reveal scale")
	}
	def publisherFile = file(
			"src/client/java/dev/ringworld/client/mixin/GlobalSettingsMixin.java")
	def publisher = publisherFile.isFile() ? publisherFile.getText("UTF-8") : ""
	if (!publisher.contains('set(shader, "RingWorldLegacyProxyRevealScale",')
			|| !publisher.contains('set(shader, "RingWorldLegacyProxyDrawn",')) {
		throw new GradleException("${publisherFile} does not publish the reveal scale")
	}
	def proxyProgramFile = file(
			"src/client/resources/assets/ringworld/shaders/core/ring_surface.json")
	def proxyProgram = proxyProgramFile.isFile()
			? new groovy.json.JsonSlurper().parse(proxyProgramFile) : null
	def streamingUniforms = proxyProgram == null ? [] : proxyProgram.uniforms.findAll {
		it.name == "RingWorldLegacyStreaming"
	}
	if (streamingUniforms.size() != 1 || streamingUniforms.first().type != "float"
			|| streamingUniforms.first().count != 2) {
		throw new GradleException(
				"${proxyProgramFile} does not declare the exact streaming-coverage uniform")
	}
	def proxyFragmentFile = file(
			"src/client/resources/assets/ringworld/shaders/core/ring_surface.fsh")
	def proxyFragment = proxyFragmentFile.isFile()
			? proxyFragmentFile.getText("UTF-8") : ""
	if (!proxyFragment.contains("uniform vec2 RingWorldLegacyStreaming;")
			|| !proxyFragment.contains("proxyAlpha = max(proxyAlpha, streamingProxyAlpha);")) {
		throw new GradleException(
				"${proxyFragmentFile} does not consume the streaming-coverage uniform")
	}
	def proxyPublisherFile = file(
			"src/client/java/dev/ringworld/client/render/RingSurfaceTextureRenderer.java")
	def proxyPublisher = proxyPublisherFile.isFile()
			? proxyPublisherFile.getText("UTF-8") : ""
	if (!proxyPublisher.contains('shader.getUniform("RingWorldLegacyStreaming")')
			|| !proxyPublisher.contains("RingStreamingProxyCoverage.span(")
			|| !proxyPublisher.contains("instanceof RingDrawableSectionView")
			|| !proxyPublisher.contains("legacyProxyDrawnThisFrame = true;")) {
		throw new GradleException(
				"${proxyPublisherFile} does not publish drawable-window streaming coverage")
	}
	def sectionBridgeFile = file(
			"src/client/java/dev/ringworld/client/mixin/LevelRendererMixin.java")
	def sectionBridge = sectionBridgeFile.isFile()
			? sectionBridgeFile.getText("UTF-8") : ""
	if (!sectionBridge.contains("RingDrawableSectionView")
			|| !sectionBridge.contains("CompiledSection.UNCOMPILED")
			|| !sectionBridge.contains("intersectsNonOpaqueProxyRegion(")
			|| !sectionBridge.contains("capturedFrustum != null")
			|| !sectionBridge.contains("visibleSections.isEmpty()")
			|| !sectionBridge.contains(": visibleSections)")
			|| !sectionBridge.contains("geometry.isExteriorChunkZ(chunkZ)")
			|| !sectionBridge.contains("hasOnlyAir()")) {
		throw new GradleException(
				"${sectionBridgeFile} does not prove current drawable-section coverage")
	}
	def drawSiteFile = file(
			"src/client/java/dev/ringworld/client/mixin/SkyRenderingMixin.java")
	def drawSite = drawSiteFile.isFile() ? drawSiteFile.getText("UTF-8") : ""
	if (!drawSite.contains('method = "renderLevel"')
			|| !drawSite.contains(
					'target = "Lnet/minecraft/client/renderer/LevelRenderer;compileSections(Lnet/minecraft/client/Camera;)V"')
			|| !drawSite.contains("shift = At.Shift.AFTER")
			|| !drawSite.contains("RingSurfaceTextureRenderer.render(")
			|| drawSite.indexOf("RingSurfaceTextureRenderer.render(")
					> drawSite.indexOf("RingSkyCycle.SunVisual")) {
		throw new GradleException(
				"${drawSiteFile} does not draw the proxy after section setup and before the star/terrain")
	}
}

def verifyHandoffFoliageOutputs = { File runDirectory, String label ->
	requireHandoffShaderBindingContract()
	def logFile = new File(runDirectory, "logs/latest.log")
	def log = logFile.isFile() ? logFile.getText("UTF-8") : ""
	if (!log.contains(
			"[handoff-foliage-capture] result=true, captures complete, screenshots=9")
			|| log.contains("[handoff-foliage-capture] result=false")
			|| log.contains("[handoff-foliage-capture] ")
					&& log.contains(" screenshot failure:")) {
		throw new GradleException("${label} did not pass; inspect ${logFile}")
	}
	def policyLines = log.readLines().findAll {
		it.contains("[handoff-foliage-capture] applied pre-login view distance=")
	}
	if (policyLines.size() != 1
			|| !policyLines.first().contains(
					"view distance=16, graphics=fancy, clouds=off, hudHidden=true, camera=first_person, fov=70")) {
		throw new GradleException("${label} did not bind its capture policy: ${logFile}")
	}
	def identityLines = log.readLines().findAll {
		it.contains("[handoff-foliage-capture] requested initial placement at ")
	}
	if (identityLines.size() != 1) {
		throw new GradleException("${label} requires one Atlas-identity marker: ${logFile}")
	}
	def identity = (identityLines.first() =~ /x=([+\-0-9.Ee]+), y=([+\-0-9.Ee]+), z=([+\-0-9.Ee]+), worldHash=([0-9a-f]+), sampleStep=(\d+), presentCells=(\d+)\/(\d+), framebuffer=(\d+)x(\d+)/)
	if (!identity.find()
			|| Math.abs(Double.parseDouble(identity.group(1)) - 4_096.5D) > 0.001D
			|| Math.abs(Double.parseDouble(identity.group(2)) - 120.0D) > 0.001D
			|| Math.abs(Double.parseDouble(identity.group(3)) + 17.5D) > 0.001D
			|| identity.group(4) != "c4f99d1076b39de3"
			|| identity.group(5).toInteger() != 8
			|| identity.group(6).toInteger() != 65_536
			|| identity.group(7).toInteger() != 65_536
			|| identity.group(8).toInteger() != 1_280
			|| identity.group(9).toInteger() != 720) {
		throw new GradleException("${label} did not bind the immutable production Atlas: ${logFile}")
	}
	def quiescence = [:]
	["pre-fixture", "post-fixture", "post-clear"].each { phase ->
		def lines = log.readLines().findAll {
			it.contains("[handoff-foliage-capture] Atlas quiescent phase=${phase},")
		}
		if (lines.size() != 1) {
			throw new GradleException(
					"${label} requires one ${phase} Atlas-quiescence marker: ${logFile}")
		}
		def marker = (lines.first() =~ /revision=(\d+), stableTicks=(\d+)/)
		if (!marker.find() || marker.group(2).toInteger() != 200) {
			throw new GradleException(
					"${label} has malformed ${phase} Atlas quiescence: ${logFile}")
		}
		quiescence[phase] = marker.group(1).toLong()
	}
	def fixtureLines = log.readLines().findAll {
		it.contains("[handoff-foliage-capture] fixture ready planes=")
	}
	if (fixtureLines.size() != 1) {
		throw new GradleException("${label} requires one fixture marker: ${logFile}")
	}
	def fixture = (fixtureLines.first() =~ /planes=(\d+), blocks=(\d+), sentinels=(\d+), atlasRevision=(\d+), targetDistance=([+\-0-9.Ee]+), targetAtlasHeight=([+\-0-9.Ee]+), pitch=([+\-0-9.Ee]+), centers=\[([^\]]+)\]/)
	if (!fixture.find() || fixture.group(1).toInteger() != 7
			|| fixture.group(2).toInteger() != 7_508
			|| fixture.group(3).toInteger() != 14
			|| fixture.group(4).toLong() != quiescence["post-fixture"]
			|| Math.abs(Double.parseDouble(fixture.group(5)) - 256.0D) > 0.001D
			|| Math.abs(Double.parseDouble(fixture.group(6)) - 63.0D) > 0.001D
			|| Math.abs(Double.parseDouble(fixture.group(7)) - 9.859631D) > 0.001D
			|| fixture.group(8).split(/,\s*/)*.toInteger()
					!= [81, 79, 77, 75, 73, 69, 65]) {
		throw new GradleException("${label} has a malformed foliage fixture: ${logFile}")
	}
	long atlasRevision = fixture.group(4).toLong()
	def settledLines = log.readLines().findAll {
		it.contains("[handoff-foliage-capture] settled requestedChunks=")
	}
	if (settledLines.size() != 1) {
		throw new GradleException("${label} requires one settled-radius marker: ${logFile}")
	}
	def settled = (settledLines.first() =~ /requestedChunks=(\d+), effectiveChunks=(\d+), loadedX=\+(\d+)\/-(\d+), atlasRevision=(\d+), proxyRevealScale=([+\-0-9.Ee]+), streamingWindowComplete=(true|false), camera=first_person, graphics=fancy, clouds=off, hudHidden=true, fov=(\d+), time=(\d+), rain=([+\-0-9.Ee]+), thunder=([+\-0-9.Ee]+), framebuffer=(\d+)x(\d+)/)
	if (!settled.find() || settled.group(1).toInteger() != 16
			|| settled.group(2).toInteger() != 16
			|| settled.group(3).toInteger() != 16
			|| settled.group(4).toInteger() != 16
			|| settled.group(5).toLong() != atlasRevision
			|| Double.parseDouble(settled.group(6)) < 0.95D
			|| !settled.group(7).toBoolean()
			|| settled.group(8).toInteger() != 70
			|| settled.group(9).toLong() != 6_000L
			|| Math.abs(Double.parseDouble(settled.group(10))) > 0.001D
			|| Math.abs(Double.parseDouble(settled.group(11))) > 0.001D
			|| settled.group(12).toInteger() != 1_280
			|| settled.group(13).toInteger() != 720) {
		throw new GradleException("${label} did not settle a full foliage radius: ${logFile}")
	}
	def resetRequestedLines = log.readLines().findAll {
		it.contains("[handoff-foliage-capture] reset-view requested ")
	}
	if (resetRequestedLines.size() != 1
			|| !resetRequestedLines.first().contains(
					"queueEmptyImmediately=true, bridgeCompleteImmediately=false, camera=first_person")) {
		throw new GradleException(
				"${label} did not bind the queue-empty/uncompiled reset state: ${logFile}")
	}
	def resetFallbackLines = log.readLines().findAll {
		it.contains("[handoff-foliage-capture] reset-view fallback ")
	}
	if (resetFallbackLines.size() != 1) {
		throw new GradleException("${label} requires one reset fallback marker: ${logFile}")
	}
	def resetFallback = (resetFallbackLines.first() =~ /queueEmptyImmediately=true, bridgeCompleteImmediately=false, streamingWindowComplete=(true|false), fallbackStart=([+\-0-9.Ee]+), fallbackOpaqueFrom=([+\-0-9.Ee]+), proxyDrawn=([+\-0-9.Ee]+), camera=first_person, atlasRevision=(\d+)/)
	if (!resetFallback.find() || resetFallback.group(1) != "false"
			|| Math.abs(Double.parseDouble(resetFallback.group(2))) > 0.001D
			|| Math.abs(Double.parseDouble(resetFallback.group(3))) > 0.001D
			|| Math.abs(Double.parseDouble(resetFallback.group(4)) - 1.0D) > 0.001D
			|| resetFallback.group(5).toLong() != atlasRevision) {
		throw new GradleException("${label} did not restore Atlas ownership after reset: ${logFile}")
	}
	def resetRecoveryLines = log.readLines().findAll {
		it.contains("[handoff-foliage-capture] reset-view recovery ")
	}
	if (resetRecoveryLines.size() != 1) {
		throw new GradleException("${label} requires one reset recovery marker: ${logFile}")
	}
	def resetRecovery = (resetRecoveryLines.first() =~ /streamingWindowComplete=true, fadeStart=([+\-0-9.Ee]+), opaqueFrom=([+\-0-9.Ee]+), proxyDrawn=([+\-0-9.Ee]+), camera=first_person, atlasRevision=(\d+)/)
	if (!resetRecovery.find()
			|| Math.abs(Double.parseDouble(resetRecovery.group(1)) - 256.0D) > 0.001D
			|| Math.abs(Double.parseDouble(resetRecovery.group(2)) - 256.0D) > 0.001D
			|| Math.abs(Double.parseDouble(resetRecovery.group(3)) - 1.0D) > 0.001D
			|| resetRecovery.group(4).toLong() != atlasRevision) {
		throw new GradleException("${label} did not prove reset recovery: ${logFile}")
	}
	int resetRequestedIndex = log.indexOf(resetRequestedLines.first())
	int resetFallbackIndex = log.indexOf(resetFallbackLines.first())
	int resetRecoveryIndex = log.indexOf(resetRecoveryLines.first())
	int resultIndex = log.indexOf(
			"[handoff-foliage-capture] result=true, captures complete, screenshots=9")
	if (!(resetRequestedIndex < resetFallbackIndex
			&& resetFallbackIndex < resetRecoveryIndex
			&& resetRecoveryIndex < resultIndex)) {
		throw new GradleException(
				"${label} reset evidence is not causally ordered: ${logFile}")
	}
	double fixturePitch = Double.parseDouble(fixture.group(7))
	def expectedPoses = ["negative-z": -8.5D, "center-a": 0.5D,
			"center-a-control": 0.5D, "positive-z": 9.5D,
			"center-b": 0.5D, "center-b-control": 0.5D]
	expectedPoses.each { id, expectedZ ->
		def lines = log.readLines().findAll {
			it.contains("[handoff-foliage-capture] captured ${id} at ")
		}
		if (lines.size() != 1) {
			throw new GradleException("${label} requires one ${id} pose marker: ${logFile}")
		}
		def pose = (lines.first() =~ /x=([+\-0-9.Ee]+), y=([+\-0-9.Ee]+), z=([+\-0-9.Ee]+), yaw=([+\-0-9.Ee]+), pitch=([+\-0-9.Ee]+), atlasRevision=(\d+), proxyRevealScale=([+\-0-9.Ee]+), streamingWindowComplete=(true|false), camera=first_person, graphics=fancy, clouds=off, hudHidden=true, fov=(\d+), time=(\d+), rain=([+\-0-9.Ee]+), thunder=([+\-0-9.Ee]+), framebuffer=(\d+)x(\d+)/)
		if (!pose.find()
				|| Math.abs(Double.parseDouble(pose.group(1)) - 4_096.5D) > 0.001D
				|| Math.abs(Double.parseDouble(pose.group(2)) - 120.0D) > 0.001D
				|| Math.abs(Double.parseDouble(pose.group(3)) - expectedZ) > 0.001D
				|| Math.abs(Double.parseDouble(pose.group(4)) - 90.0D) > 0.001D
				|| Math.abs(Double.parseDouble(pose.group(5)) - fixturePitch) > 0.001D
				|| pose.group(6).toLong() != atlasRevision
				|| Double.parseDouble(pose.group(7)) < 0.95D
				|| !pose.group(8).toBoolean()
				|| pose.group(9).toInteger() != 70
				|| pose.group(10).toLong() != 6_000L
				|| Math.abs(Double.parseDouble(pose.group(11))) > 0.001D
				|| Math.abs(Double.parseDouble(pose.group(12))) > 0.001D
				|| pose.group(13).toInteger() != 1_280
				|| pose.group(14).toInteger() != 720) {
			throw new GradleException("${label} has an invalid ${id} capture pose: ${logFile}")
		}
	}
	def motionLines = log.readLines().findAll {
		it.contains("[handoff-foliage-capture] motion metrics steps=")
	}
	if (motionLines.size() != 1) {
		throw new GradleException("${label} requires one motion marker: ${logFile}")
	}
	def motion = (motionLines.first() =~ /steps=(\d+), maxStep=([+\-0-9.Ee]+), frameSamples=(\d+), averageMs=([+\-0-9.Ee]+), maxMs=([+\-0-9.Ee]+), over50Ms=(\d+), streamingCoverageDropFrames=(\d+), maximumStreamingCoverageDropRun=(\d+), unsafeStreamingCoverageFrames=(\d+)/)
	if (!motion.find()) {
		throw new GradleException("${label} has invalid motion telemetry: ${logFile}")
	}
	double maximumStep = Double.parseDouble(motion.group(2))
	int frameSamples = motion.group(3).toInteger()
	double averageMs = Double.parseDouble(motion.group(4))
	double maximumMs = Double.parseDouble(motion.group(5))
	int over50Ms = motion.group(6).toInteger()
	int coverageDrops = motion.group(7).toInteger()
	int maximumCoverageDropRun = motion.group(8).toInteger()
	int unsafeCoverageFrames = motion.group(9).toInteger()
	if (motion.group(1).toInteger() != 144
			|| !Double.isFinite(maximumStep) || maximumStep <= 0.0D
			|| maximumStep > 0.26D || frameSamples <= 0
			|| !Double.isFinite(averageMs) || averageMs < 0.0D
			|| !Double.isFinite(maximumMs) || maximumMs < averageMs
			|| over50Ms < 0 || over50Ms > frameSamples
			|| coverageDrops < 0 || coverageDrops > 64
			|| coverageDrops * 50L > frameSamples
			|| maximumCoverageDropRun < 0 || maximumCoverageDropRun > 32
			|| maximumCoverageDropRun > coverageDrops
			|| unsafeCoverageFrames != 0) {
		throw new GradleException("${label} has invalid motion telemetry: ${logFile}")
	}
	def envelopeLines = log.readLines().findAll {
		it.contains("[handoff-foliage-capture] blocked-sky envelope blockedScale=")
	}
	if (envelopeLines.size() != 1) {
		throw new GradleException("${label} requires one blocked-sky marker: ${logFile}")
	}
	def envelope = (envelopeLines.first() =~ /blockedScale=([+\-0-9.Ee]+), blockedDrawn=([+\-0-9.Ee]+), recoveredScale=([+\-0-9.Ee]+), recoveredDrawn=([+\-0-9.Ee]+), atlasRevision=(\d+)/)
	if (!envelope.find()
			|| Math.abs(Double.parseDouble(envelope.group(1))) > 0.001D
			|| Math.abs(Double.parseDouble(envelope.group(2))) > 0.001D
			|| Double.parseDouble(envelope.group(3)) < 0.95D
			|| Math.abs(Double.parseDouble(envelope.group(4)) - 1.0D) > 0.001D
			|| envelope.group(5).toLong() != atlasRevision) {
		throw new GradleException("${label} failed its blocked-sky envelope: ${logFile}")
	}
	def clearedLines = log.readLines().findAll {
		it.contains("[handoff-foliage-capture] fixture cleared blocks=")
	}
	if (clearedLines.size() != 1) {
		throw new GradleException("${label} requires one cleared-fixture marker: ${logFile}")
	}
	def cleared = (clearedLines.first() =~ /blocks=(\d+), atlasRevision=(\d+)/)
	if (!cleared.find() || cleared.group(1).toInteger() != 7_508
			|| cleared.group(2).toLong() != quiescence["post-clear"]
			|| quiescence["pre-fixture"] != quiescence["post-fixture"]
			|| quiescence["post-fixture"] != quiescence["post-clear"]
			|| atlasRevision != quiescence["post-fixture"]) {
		throw new GradleException(
				"${label} did not isolate live foliage from Atlas revisions: ${logFile}")
	}
	["empty-a", "empty-b"].each { id ->
		def lines = log.readLines().findAll {
			it.contains("[handoff-foliage-capture] captured ${id} at ")
		}
		if (lines.size() != 1) {
			throw new GradleException("${label} requires one ${id} pose marker: ${logFile}")
		}
		def pose = (lines.first() =~ /x=([+\-0-9.Ee]+), y=([+\-0-9.Ee]+), z=([+\-0-9.Ee]+), yaw=([+\-0-9.Ee]+), pitch=([+\-0-9.Ee]+), atlasRevision=(\d+), proxyRevealScale=([+\-0-9.Ee]+), streamingWindowComplete=(true|false), camera=first_person, graphics=fancy, clouds=off, hudHidden=true, fov=(\d+), time=(\d+), rain=([+\-0-9.Ee]+), thunder=([+\-0-9.Ee]+), framebuffer=(\d+)x(\d+)/)
		if (!pose.find()
				|| Math.abs(Double.parseDouble(pose.group(1)) - 4_096.5D) > 0.001D
				|| Math.abs(Double.parseDouble(pose.group(2)) - 120.0D) > 0.001D
				|| Math.abs(Double.parseDouble(pose.group(3)) - 0.5D) > 0.001D
				|| Math.abs(Double.parseDouble(pose.group(4)) - 90.0D) > 0.001D
				|| Math.abs(Double.parseDouble(pose.group(5)) - fixturePitch) > 0.001D
				|| pose.group(6).toLong() != quiescence["post-clear"]
				|| Double.parseDouble(pose.group(7)) < 0.95D
				|| !pose.group(8).toBoolean()
				|| pose.group(9).toInteger() != 70
				|| pose.group(10).toLong() != 6_000L
				|| Math.abs(Double.parseDouble(pose.group(11))) > 0.001D
				|| Math.abs(Double.parseDouble(pose.group(12))) > 0.001D
				|| pose.group(13).toInteger() != 1_280
				|| pose.group(14).toInteger() != 720) {
			throw new GradleException("${label} has an invalid ${id} control pose: ${logFile}")
		}
	}
	def screenshots = [:]
	expectedPoses.keySet().each { id ->
		def screenshot = new File(runDirectory,
				"screenshots/ringworld-handoff-foliage-${id}.png")
		requireHandoffFoliageDetail(screenshot, label)
		screenshots[id] = screenshot
	}
	["empty-a", "empty-b"].each { id ->
		def screenshot = new File(runDirectory,
				"screenshots/ringworld-handoff-foliage-${id}.png")
		requireReadablePng(screenshot, label)
		screenshots[id] = screenshot
	}
	requireReadablePng(new File(runDirectory,
			"screenshots/ringworld-handoff-foliage-reset-fallback.png"), label)
	requireHandoffFoliageRepeatability(screenshots, label)
}
ext.verifyHandoffFoliageOutputs = verifyHandoffFoliageOutputs

def requireVisualParitySeamMotionMetrics = { File logFile, String label ->
	def metrics = logFile.readLines("UTF-8").findAll {
		it.contains("[visual-parity-capture] seam motion frame metrics:")
	}
	if (metrics.isEmpty()) {
		throw new GradleException("${label} is missing seam-motion frame metrics: ${logFile}")
	}
	def sampleMatcher = (metrics.last() =~ /samples=(\d+)/)
	if (!sampleMatcher.find() || sampleMatcher.group(1).toInteger() <= 0) {
		throw new GradleException("${label} recorded no seam-motion frame samples: ${logFile}")
	}
}

def verifyFabricVisualParityOutputs = { File runDirectory ->
	def logFile = new File(runDirectory, "logs/latest.log")
	requireFabricRuntimeGateLog(logFile,
			"[visual-parity-capture] result=true, captures complete",
			"[visual-parity-capture] result=false",
			"Fabric visual-parity capture")
	requireVisualParitySeamMotionMetrics(logFile, "Fabric visual-parity capture")
	["seam", "seam-join", "min-rim", "max-rim"].each { view ->
		def screenshot = new File(runDirectory,
				"screenshots/ringworld-visual-parity-${view}.png")
		if (!screenshot.isFile()) {
			throw new GradleException("Fabric visual-parity capture is missing " + screenshot)
		}
	}
}

def verifyFabricLayoutSwitchOutputs = { File runDirectory, List<String> destinations, String expectation ->
	def logFile = new File(runDirectory, "logs/latest.log")
	requireFabricRuntimeGateLog(logFile,
			"[layout-switch] result-json={\"passed\":true,",
			"[layout-switch] result-json={\"passed\":false,",
			"Fabric layout-switch client")
	if (!logFile.text.contains("[layout-switch] expectation=${expectation}")) {
		throw new GradleException(
				"Fabric layout-switch client did not run expected mode '${expectation}'; inspect ${logFile}")
	}
	destinations.each { destinationId ->
		def destination = new File(new File(runDirectory, "saves"),
				checkedSaveId(destinationId, "ringLayoutSwitchDestination"))
		if (!new File(destination, "level.dat").isFile()) {
			throw new GradleException(
