		delete(tangent)
		expectRejected("missing projection screenshot") {
			verifyFabricProjectionOutputs(projection, "noon")
		}
		writeText(tangent, "not a PNG")
		expectRejected("corrupt projection screenshot") {
			verifyFabricProjectionOutputs(projection, "noon")
		}
		writePng(tangent)
		writeText(new File(projection, "logs/latest.log"),
				"[projection-capture] handoff capture armed at requestedChunks=16, "
						+ "effectiveChunks=16, loadedX=+16/-16, handoffBlocks=256.0, "
						+ "pitch=12.0, surfaceY=63.0, streamingWindowComplete=true\n"
