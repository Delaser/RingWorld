def verifyCreationUiOutputs = { File runDirectory, String label ->
	def logFile = new File(runDirectory, "logs/latest.log")
	requireFabricRuntimeGateLog(logFile, "[creation-ui-test] PASS", "[creation-ui-test] FAIL", label)
	creationUiScreenshotPrefixes.each { prefix ->
		def screenshots = fileTree(new File(runDirectory, "screenshots")).matching {
			include prefix + "*.png"
		}.files
		if (screenshots.isEmpty()) {
			throw new GradleException("${label} is missing screenshot ${prefix}*.png")
		}
		screenshots.each { screenshot -> requireNonUniformPng(screenshot, label) }
	}
	def createdLevels = fileTree(new File(runDirectory, "saves")).matching {
		include "**/level.dat"
	}.files
	if (!createdLevels.isEmpty()) {
		throw new GradleException("${label} created a world despite being menu-only: ${createdLevels}")
	}
	verifyCreationUiConfig(runDirectory, label)
}
