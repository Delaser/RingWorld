def verifyCreationUiConfig = { File runDirectory, String label ->
	def configFile = new File(runDirectory, "config/ringworld.properties")
	if (!configFile.isFile()) {
		throw new GradleException("${label} did not retain its final bootstrap configuration: ${configFile}")
	}
	def config = new Properties()
	configFile.withInputStream { config.load(it) }
	def expected = [
			"circumferenceBlocks": "4096",
			"widthBlocks": "640",
			"wallHeightBlocks": "192",
			"requestOceanMonument": "true",
			"testMode": "false",
			"pregenerateTerrainAtlas": "false"
	]
	expected.each { key, value ->
