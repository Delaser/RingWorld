tasks.register('verifyLoaderBoundary') {
	group = 'verification'
	description = 'Fails when loader API imports leak into loader-neutral source trees.'
	inputs.files(fileTree('src/main/java') { include '**/*.java' },
			fileTree('src/client/java') { include '**/*.java' })
	doLast {
		def forbidden = ['net.fabricmc', 'net.neoforged']
		def violations = []
		inputs.files.files.sort().each { source ->
			def text = source.getText('UTF-8')
			forbidden.each { namespace ->
				if (text.contains('import ' + namespace) || text.contains(namespace + '.')) {
					violations << rootProject.relativePath(source) + ': references ' + namespace
				}
			}
		}
		if (!violations.isEmpty()) {
			throw new GradleException('Loader APIs leaked into shared sources:\n' + violations.join('\n'))
		}
	}
}

tasks.named('check') {
	dependsOn tasks.named('verifyLoaderBoundary')
}

tasks.withType(Jar).configureEach {
