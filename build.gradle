tasks.register("verifyCurvedObjectCaptureClient") {
	group = "ringworld verification"
	description = "Fails unless both Fabric curved rigid-object captures completed."
	mustRunAfter("runCurvedObjectCaptureClient")
	doLast {
		def logFile = new File(qualificationRunFile("run-curved-object-capture"), "logs/latest.log")
		def log = logFile.isFile() ? logFile.text : ""
		if (!log.contains("[curved-object-capture] result=PASS, captures complete")
				|| log.contains("[curved-object-capture] result=FAIL")) {
			throw new GradleException("Fabric curved-object capture did not pass; inspect " + logFile)
		}
		["far", "near"].each { distance ->
			def screenshot = new File(qualificationRunFile("run-curved-object-capture"), "screenshots/ringworld-curved-objects-${distance}.png")
			if (!screenshot.isFile()) {
				throw new GradleException("Fabric curved-object capture is missing " + screenshot)
			}
		}
	}
}

