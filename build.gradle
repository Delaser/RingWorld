tasks.register("prepareHeadlessPrewarmWorld") {
	group = "ringworld verification"
	description = "Prepares a fresh or copied disposable world for headless atlas prewarm."
	inputs.property("ringHeadlessPrewarmSource",
			providers.gradleProperty("ringHeadlessPrewarmSource").orElse(""))
	inputs.property("ringHeadlessPrewarmResult",
			providers.gradleProperty("ringHeadlessPrewarmResult").orElse("result.json"))
	inputs.property("ringHeadlessPrewarmResume",
			providers.gradleProperty("ringHeadlessPrewarmResume").orElse("false"))
	inputs.property("ringHeadlessPrewarmCircumference",
			providers.gradleProperty("ringHeadlessPrewarmCircumference").orElse("2048"))
	inputs.property("ringHeadlessPrewarmWidth",
			providers.gradleProperty("ringHeadlessPrewarmWidth").orElse("416"))
	outputs.upToDateWhen { false }
	doLast {
		def sourceName = providers.gradleProperty("ringHeadlessPrewarmSource").orElse("").get().trim()
		def resume = providers.gradleProperty("ringHeadlessPrewarmResume").orElse("false").get().toBoolean()
		def reportName = providers.gradleProperty("ringHeadlessPrewarmResult").orElse("result.json").get().trim()
		if (reportName.isEmpty() || reportName == "progress.json" || reportName.contains("/") || reportName.indexOf(92) >= 0 || !reportName.endsWith(".json")) {
			throw new GradleException("-PringHeadlessPrewarmResult must be one .json filename")
		}
		def eula = new File(headlessPrewarmDirectory, "eula.txt")
		if (!eula.isFile()) {
			eula.parentFile.mkdirs()
			eula.text = "# Review https://aka.ms/MinecraftEULA before changing this value.\neula=false\n"
		}
		if (!eula.isFile() || !eula.text.readLines().any { it.trim() == "eula=true" }) {
			throw new GradleException("Review ${eula}, then set eula=true to run this disposable server")
		}
		def world = new File(headlessPrewarmDirectory, "world")
		if (resume) {
			if (!sourceName.isEmpty() || !new File(world, "level.dat").isFile()) {
				throw new GradleException("-PringHeadlessPrewarmResume=true requires the existing disposable world and no copy source")
			}
		} else {
			delete(world)
			delete(new File(headlessPrewarmDirectory, "logs"))
		}
		if (!sourceName.isEmpty()) {
			def source = requireSave(sourceName, "ringHeadlessPrewarmSource", sourceSavesDirectory)
			copy { from source.directory; into world }
			if (!new File(world, "level.dat").isFile()) {
				throw new GradleException("copied headless world is missing level.dat: " + world)
			}
			logger.lifecycle("[headless-prewarm] copied source={} destination={}", source.directory, world)
		}
		// A prewarm may crash before it can write new evidence. Never let the
		// finalizer mistake an older COMPLETE result for this launch, including
		// a deliberate resume of the same disposable runtime world.
		def reportDirectory = new File(world, "ringworld-prewarm")
		delete(new File(reportDirectory, reportName))
		delete(new File(reportDirectory, "progress.json"))
		def properties = new Properties()
		def propertiesFile = new File(headlessPrewarmDirectory, "server.properties")
		if (propertiesFile.isFile()) propertiesFile.withInputStream { properties.load(it) }
		properties.setProperty("level-name", "world")
		properties.setProperty("online-mode", "false")
		properties.setProperty("server-port", "0")
		// A non-interactive job has no players, so vanilla's empty-server pause
		// would otherwise stop normal ticks partway through pregeneration.
		properties.setProperty("pause-when-empty-seconds", "-1")
		propertiesFile.withOutputStream { properties.store(it, "Disposable RingWorld headless prewarm") }
		def config = new Properties()
		def configFile = new File(headlessPrewarmDirectory, "config/ringworld.properties")
		config.setProperty("widthBlocks",
				providers.gradleProperty("ringHeadlessPrewarmWidth").orElse("416").get())
		config.setProperty("circumferenceBlocks",
				providers.gradleProperty("ringHeadlessPrewarmCircumference").orElse("2048").get())
		config.setProperty("wallHeightBlocks", "160")
		config.setProperty("testMode", "false")
		config.setProperty("testViewDistanceChunks", "6")
		// The launch adapter supplies HEADLESS_PREWARM itself and suppresses
		// background autostart even if an existing copied config says true.
		config.setProperty("pregenerateTerrainAtlas", "false")
		configFile.parentFile.mkdirs()
		configFile.withOutputStream { config.store(it, "Disposable RingWorld headless prewarm") }
	}
}

tasks.register("verifyHeadlessPrewarm") {
	group = "ringworld verification"
	description = "Converts a non-complete headless prewarm JSON result into a failing Gradle result."
	mustRunAfter("runHeadlessPrewarmServer")
	doLast {
		def resultName = providers.gradleProperty("ringHeadlessPrewarmResult").orElse("result.json").get().trim()
		def expectedCircumference = providers.gradleProperty("ringHeadlessPrewarmCircumference").orElse("2048").get().toInteger()
		def expectedWidth = providers.gradleProperty("ringHeadlessPrewarmWidth").orElse("416").get().toInteger()
		def expectedMapping = providers.gradleProperty("ringHeadlessPrewarmExpectedTerrainNoiseMapping").orElse("4").get().toInteger()
		if (!(expectedMapping in [1, 2, 3, 4])) {
			throw new GradleException("-PringHeadlessPrewarmExpectedTerrainNoiseMapping must be 1, 2, 3, or 4")
		}
		def result = new File(headlessPrewarmDirectory, "world/ringworld-prewarm/" + resultName)
		if (!result.isFile()) {
			throw new GradleException("Headless prewarm did not write a terminal result; inspect " + result)
		}
		def report
		try {
			report = new groovy.json.JsonSlurper().parse(result)
		} catch (Exception failure) {
			throw new GradleException("Headless prewarm result is not valid JSON: " + result, failure)
		}
		if (!(report instanceof Map) || report.schemaVersion != 2 || report.status != "COMPLETE" || report.identityAvailable != true
				|| report.terrainNoiseMapping != expectedMapping
				|| !report.containsKey("atlasPath") || !report.atlasPath || !report.containsKey("failureReason") || report.failureReason != null
				|| !(report.totalChunks instanceof Number) || !(report.completedChunks instanceof Number)
				|| !(report.totalCells instanceof Number) || !(report.completedCells instanceof Number)
				|| report.circumferenceBlocks != expectedCircumference || report.widthBlocks != expectedWidth
				|| report.totalChunks <= 0 || report.totalCells <= 0
				|| report.completedChunks != report.totalChunks || report.completedCells != report.totalCells) {
			throw new GradleException("Headless prewarm did not complete; inspect " + result)
		}
	}
}

