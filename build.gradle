        .orElse("false")
def multiplayerHarnessDimension = { String propertyName, String defaultValue, int minimum, boolean chunkAligned ->
	def raw = providers.gradleProperty(propertyName).orElse(defaultValue).get().trim()
	int value
	try {
		value = Integer.parseInt(raw)
	} catch (NumberFormatException ignored) {
		throw new GradleException("${propertyName} must be a positive integer")
	}
	if (value < minimum) {
		throw new GradleException("${propertyName} must be at least ${minimum} blocks")
	}
	if (chunkAligned && value % 16 != 0) {
		throw new GradleException("${propertyName} must be divisible by 16 blocks")
	}
	value
}
// Mirror RingGeometry/RingWorldConfig's bootstrap constraints. The server
// still applies the full first-world dimension report before world creation.
