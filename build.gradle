tasks.register("prepareCopiedProductionVisualParityWorld") {
	group = "ringworld verification"
	description = "Copies the named production save into the isolated Fabric seam-and-rim visual-parity run."
	inputs.property("ringVisualParitySource",
			providers.gradleProperty("ringVisualParitySource").orElse(""))
	inputs.property("ringVisualParityDestination",
			providers.gradleProperty("ringVisualParityDestination")
					.orElse("RingWorld Fabric Visual Parity"))
	outputs.dir(visualParitySavesDirectory)
	outputs.upToDateWhen { false }
	doLast {
		def source = requireSave(providers.gradleProperty("ringVisualParitySource").orNull,
				"ringVisualParitySource", sourceSavesDirectory)
		def destinationId = checkedSaveId(
				providers.gradleProperty("ringVisualParityDestination")
						.orElse("RingWorld Fabric Visual Parity").get(),
				"ringVisualParityDestination")
		def destination = new File(visualParitySavesDirectory, destinationId)
		delete(destination)
		delete(new File(qualificationRunFile("run-production-visual-parity"), "screenshots"))
		delete(new File(qualificationRunFile("run-production-visual-parity"), "ringworld-cache"))
		delete(new File(qualificationRunFile("run-production-visual-parity"), "logs"))
		copy {
			from(source.directory)
			into(destination)
		}
		if (!new File(destination, "level.dat").isFile()) {
			throw new GradleException("copied Fabric visual-parity save is missing level.dat: " + destination)
		}
		logger.lifecycle("[fabric-visual-parity] copied source={} destination={}",
				source.directory, destination)
	}
}

