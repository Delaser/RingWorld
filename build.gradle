tasks.register("verifyOutboundPositionPacketInventory") {
	group = "ringworld verification"
	description = "Fails unless every audited outbound positional block packet is canonicalized."
	inputs.file("src/client/java/dev/ringworld/client/mixin/ClientConnectionMixin.java")
	doLast {
		def outboundPositionMixin = file(
				"src/client/java/dev/ringworld/client/mixin/ClientConnectionMixin.java").text
		[
				"ServerboundPlayerActionPacket",
				"ServerboundUseItemOnPacket",
				"ServerboundSignUpdatePacket",
				"ServerboundBlockEntityTagQueryPacket",
				"ServerboundSetCommandBlockPacket",
				"ServerboundSetStructureBlockPacket",
				"ServerboundSetJigsawBlockPacket",
				"ServerboundJigsawGeneratePacket"
		].each { packetType ->
			if (!outboundPositionMixin.contains("packet instanceof ${packetType}")) {
				throw new GradleException(
						"Outbound positional packet audit is missing ${packetType}")
			}
		}
	}
}

tasks.register("verifyFabricRuntimeGateContracts") {
	group = "ringworld verification"
	description = "Proves the Fabric projection/layout/lifecycle verifiers reject stale or corrupt evidence."
	outputs.upToDateWhen { false }
	doLast {
		requireHandoffShaderBindingContract()
		def fixtureRoot = layout.buildDirectory.dir(
				"tmp/fabric-runtime-gate-verifiers").get().asFile
		delete(fixtureRoot)
		fixtureRoot.mkdirs()

		def writeText = { File destination, String value ->
			destination.parentFile.mkdirs()
			destination.setText(value, "UTF-8")
		}
		def writePng = { File destination ->
			destination.parentFile.mkdirs()
			def image = new java.awt.image.BufferedImage(
					16, 16, java.awt.image.BufferedImage.TYPE_INT_ARGB)
			image.setRGB(0, 0, 0xFFFFFFFF as int)
			image.setRGB(15, 15, 0xFF000000 as int)
			// Deterministic terrain-like variation through the normalized centre
			// band used by the production radial-up Atlas assertion.
			for (int y = 0; y < 16; y++) {
				image.setRGB(7, y, (0xFF000000L | (y * 13L << 16)
						| ((255L - y * 11L) << 8) | (y * 7L)) as int)
				image.setRGB(8, y, (0xFF000000L | ((255L - y * 9L) << 16)
						| (y * 15L << 8) | (255L - y * 5L)) as int)
			}
			if (!javax.imageio.ImageIO.write(image, "png", destination)) {
				throw new GradleException("Could not create PNG verifier fixture ${destination}")
			}
		}
		def writeFlatProjectionPng = { File destination ->
			destination.parentFile.mkdirs()
			def image = new java.awt.image.BufferedImage(
					16, 16, java.awt.image.BufferedImage.TYPE_INT_ARGB)
			def graphics = image.createGraphics()
			try {
				graphics.color = new java.awt.Color(0x78, 0xA7, 0xED)
				graphics.fillRect(0, 0, 16, 16)
			} finally {
				graphics.dispose()
			}
			// Keep the image globally non-uniform while its proxy band stays flat.
			image.setRGB(0, 0, 0xFFFFFFFF as int)
			image.setRGB(15, 15, 0xFF000000 as int)
			if (!javax.imageio.ImageIO.write(image, "png", destination)) {
				throw new GradleException(
						"Could not create flat projection verifier fixture ${destination}")
			}
		}
		def writeHandoffPng = { File destination, boolean hardCutoff ->
			destination.parentFile.mkdirs()
			def image = new java.awt.image.BufferedImage(
					32, 32, java.awt.image.BufferedImage.TYPE_INT_ARGB)
			for (int y = 0; y < image.height; y++) {
				int step = hardCutoff && y >= 17 ? 110 : 0
				for (int x = 0; x < image.width; x++) {
					int red = Math.max(0, Math.min(255, 55 + y * 2 - step + x % 3))
					int green = Math.max(0, Math.min(255, 75 + y * 2 - step + x % 3))
					int blue = Math.max(0, Math.min(255, 125 + y * 2 - step + x % 3))
					image.setRGB(x, y, (0xFF000000L | (red << 16)
							| (green << 8) | blue) as int)
				}
			}
			if (!javax.imageio.ImageIO.write(image, "png", destination)) {
				throw new GradleException(
						"Could not create handoff verifier fixture ${destination}")
			}
		}
		def expectRejected = { String caseName, Closure verification ->
			boolean rejected = false
			try {
				verification.call()
			} catch (GradleException expected) {
				rejected = true
			}
			if (!rejected) {
				throw new GradleException(
						"Fabric runtime-gate verifier accepted invalid fixture: ${caseName}")
			}
		}

		def partialAtlas = new File(fixtureRoot, "partial-atlas")
		def partialAtlasLog = new File(partialAtlas, "logs/latest.log")
		def partialCapturePolicy =
				"[atlas-ui-test] applied pre-login view distance=6, " +
						"graphics=fancy, clouds=off, fov=70\n"
		def validPartialMarker =
				"[atlas-ui-test] partial-handoff requestedChunks=6, " +
						"effectiveChunks=6, loadedX=+6/-6, presentCells=1536, " +
						"totalCells=4096, visibleCompletion=0.36, " +
						"generationFog=0.66, proxyRevealScale=0.34, " +
						"streamingWindowComplete=true, pitch=12.0, " +
						"graphics=fancy, clouds=off, hudHidden=true, fov=70, " +
						"time=6000, rain=0.0\n"
		writeText(partialAtlasLog, partialCapturePolicy + validPartialMarker)
		requirePartialAtlasHandoff(partialAtlasLog, "partial Atlas contract fixture")
		writeText(partialAtlasLog,
				partialCapturePolicy + validPartialMarker.replace(
						"streamingWindowComplete=true",
						"streamingWindowComplete=false"))
		expectRejected("emergency streaming coverage in partial-Atlas handoff") {
			requirePartialAtlasHandoff(partialAtlasLog,
					"partial Atlas contract fixture")
		}
		writeText(partialAtlasLog,
				partialCapturePolicy + validPartialMarker.replace(
						"proxyRevealScale=0.34", "proxyRevealScale=0.75"))
		expectRejected("inconsistent partial-Atlas reveal envelope") {
			requirePartialAtlasHandoff(partialAtlasLog,
					"partial Atlas contract fixture")
		}
		writeText(partialAtlasLog,
				partialCapturePolicy + "[atlas-ui-test] partial-handoff malformed\n")
		expectRejected("malformed partial-Atlas marker") {
			requirePartialAtlasHandoff(partialAtlasLog,
					"partial Atlas contract fixture")
		}

		def projection = new File(fixtureRoot, "projection")
		writeText(new File(projection, "logs/latest.log"),
				"[projection-capture] handoff capture armed at requestedChunks=16, "
						+ "effectiveChunks=16, loadedX=+16/-16, handoffBlocks=256.0, "
						+ "pitch=12.0, surfaceY=63.0, proxyRevealScale=1.0, "
						+ "streamingWindowComplete=true\n"
						+ "[projection-capture] result=true, captures complete\n")
		["tangent", "handoff", "up"].each { view ->
			writePng(new File(projection,
					"screenshots/ringworld-projection-${view}.png"))
		}
		def handoff = new File(projection,
				"screenshots/ringworld-projection-handoff.png")
		writeHandoffPng(handoff, false)
		verifyFabricProjectionOutputs(projection, "noon")
		writeText(new File(projection, "logs/latest.log"),
				"[projection-capture] handoff capture armed at requestedChunks=16, "
						+ "effectiveChunks=16, loadedX=+16/-16, handoffBlocks=256.0, "
