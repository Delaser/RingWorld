def verifyCreationUiOutputs = { File runDirectory, String label ->
	def logFile = new File(runDirectory, "logs/latest.log")
	requireFabricRuntimeGateLog(logFile, "[creation-ui-test] PASS", "[creation-ui-test] FAIL", label)
