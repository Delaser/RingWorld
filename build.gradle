tasks.register("prepareCopiedProductionProjectionWorld") {
	group = "ringworld verification"
	description = "Copies the named production-projection source save into its isolated run directory."
	inputs.property("ringProjectionWorld",
			providers.gradleProperty("ringProjectionWorld").orElse(""))
	inputs.property("ringProjectionDestination",
			providers.gradleProperty("ringProjectionDestination")
					.orElse("RingWorld Production Projection"))
	outputs.dir(projectionSavesDirectory)
	// World state can change between runs; refresh only the ignored destination copy.
	outputs.upToDateWhen { false }
	doLast {
		["screenshots", "ringworld-cache", "logs", "crash-reports"].each {
			delete(file("run-production-projection/${it}"))
		}
		// Keep release-evidence captures free of the first-world movement toast.
		// This directory is disposable and isolated from the user's real options.
		def projectionOptions = file("run-production-projection/options.txt")
		def optionLines = projectionOptions.isFile()
				? projectionOptions.readLines("UTF-8") : []
		optionLines.removeAll { it.startsWith("tutorialStep:") }
		optionLines.add("tutorialStep:none")
		projectionOptions.parentFile.mkdirs()
		projectionOptions.setText(optionLines.join("\n") + "\n", "UTF-8")
		def source = requireSave(providers.gradleProperty("ringProjectionWorld").orNull,
				"ringProjectionWorld", sourceSavesDirectory)
		def destinationId = checkedSaveId(
				providers.gradleProperty("ringProjectionDestination")
						.orElse("RingWorld Production Projection").get(),
				"ringProjectionDestination")
		def destination = new File(projectionSavesDirectory, destinationId)
		delete(destination)
		copy {
			from(source.directory)
			into(destination)
		}
		if (!new File(destination, "level.dat").isFile()) {
			throw new GradleException("copied projection save is missing level.dat: " + destination)
		}
