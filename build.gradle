plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	mavenCentral()
}

loom {
	splitEnvironmentSourceSets()
	mods {
		"ringworld" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
	runs {
		multiplayerServer {
			server()
			name "RingWorld Multiplayer Server"
			runDir "run-multiplayer/server"
			vmArg "-Dringworld.multiplayerTest=true"
			programArg "nogui"
		}
		multiplayerClientA {
			client()
			name "RingWorld Multiplayer Client A"
			runDir "run-multiplayer/client-a"
			vmArg "-Dringworld.multiplayerTestRole=A"
			vmArg "-Dringworld.multiplayerTestPort=25566"
			programArgs "--username", "RingTesterA"
		}
		multiplayerClientB {
			client()
			name "RingWorld Multiplayer Client B"
			runDir "run-multiplayer/client-b"
			vmArg "-Dringworld.multiplayerTestRole=B"
			vmArg "-Dringworld.multiplayerTestPort=25566"
			programArgs "--username", "RingTesterB"
		}
		layoutSwitchClient {
			client()
			name "RingWorld Layout Switch Client"
			runDir "run"
			vmArg "-Dringworld.layoutSwitchFirst=RingWorld Automated Test (10)"
			vmArg "-Dringworld.layoutSwitchSecond=RingWorld Automated Test (6)"
		}
		productionProjectionClient {
			client()
			name "RingWorld Production Projection Capture"
			runDir "run"
			vmArg "-Dringworld.captureRingProjection=true"
			programArgs "--quickPlaySingleplayer",
					providers.gradleProperty("ringProjectionWorld")
							.orElse("RingWorld Automated Test (3)").get()
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	testImplementation platform('org.junit:junit-bom:5.11.4')
	testImplementation 'org.junit.jupiter:junit-jupiter'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

processResources {
	inputs.property 'version', project.version
	filesMatching('fabric.mod.json') { expand version: project.version }
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

tasks.named('test') {
	useJUnitPlatform()
}
