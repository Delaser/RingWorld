tasks.register("prepareCopiedLayoutSwitchWorlds") {
	group = "ringworld verification"
	description = "Copies two explicit saved worlds into the isolated layout-switch run directory."
	inputs.property("ringLayoutSwitchFirstSource",
			providers.gradleProperty("ringLayoutSwitchFirstSource").orElse("RingWorld Automated Test (10)"))
	inputs.property("ringLayoutSwitchSecondSource",
			providers.gradleProperty("ringLayoutSwitchSecondSource").orElse("RingWorld Automated Test (6)"))
	inputs.property("ringLayoutSwitchFirstDestination",
			providers.gradleProperty("ringLayoutSwitchFirstDestination").orElse("RingWorld Layout Switch A"))
	inputs.property("ringLayoutSwitchSecondDestination",
			providers.gradleProperty("ringLayoutSwitchSecondDestination").orElse("RingWorld Layout Switch B"))
	inputs.property("ringLayoutSwitchExpectation",
			providers.gradleProperty("ringLayoutSwitchExpectation").orElse("different-layout"))
	outputs.dir(layoutSwitchSavesDirectory)
	// A saved world can change between runs; always refresh only the isolated copies.
	outputs.upToDateWhen { false }
	doLast {
		["screenshots", "ringworld-cache", "logs", "crash-reports"].each {
			delete(file("run-layout-switch/${it}"))
		}
		def copies = [
			[providers.gradleProperty("ringLayoutSwitchFirstSource").orElse("RingWorld Automated Test (10)").get(),
					providers.gradleProperty("ringLayoutSwitchFirstDestination").orElse("RingWorld Layout Switch A").get(),
					"ringLayoutSwitchFirstSource", "ringLayoutSwitchFirstDestination"],
			[providers.gradleProperty("ringLayoutSwitchSecondSource").orElse("RingWorld Automated Test (6)").get(),
					providers.gradleProperty("ringLayoutSwitchSecondDestination").orElse("RingWorld Layout Switch B").get(),
					"ringLayoutSwitchSecondSource", "ringLayoutSwitchSecondDestination"]
		]
		def destinations = [] as Set
		copies.each { copySpec ->
			def source = requireSave(copySpec[0], copySpec[2], sourceSavesDirectory)
			def destinationId = checkedSaveId(copySpec[1], copySpec[3])
			if (!destinations.add(destinationId)) {
				throw new GradleException("layout-switch destinations must be distinct")
			}
			def destination = new File(layoutSwitchSavesDirectory, destinationId)
			delete(destination)
			copy {
				from(source.directory)
				into(destination)
			}
			if (!new File(destination, "level.dat").isFile()) {
				throw new GradleException("copied layout-switch save is missing level.dat: " + destination)
			}
			logger.lifecycle("[layout-switch] copied source={} destination={}", source.directory, destination)
		}
	}
}

