tasks.register("verifyFabricRuntimeGateContracts") {
	group = "ringworld verification"
	description = "Proves the Fabric projection/layout/lifecycle verifiers reject stale or corrupt evidence."
	outputs.upToDateWhen { false }
	doLast {
		def fixtureRoot = layout.buildDirectory.dir(
				"tmp/fabric-runtime-gate-verifiers").get().asFile
		delete(fixtureRoot)
		fixtureRoot.mkdirs()

		def writeText = { File destination, String value ->
			destination.parentFile.mkdirs()
			destination.setText(value, "UTF-8")
		}
		def writePng = { File destination ->
			destination.parentFile.mkdirs()
			def image = new java.awt.image.BufferedImage(
					16, 16, java.awt.image.BufferedImage.TYPE_INT_ARGB)
			image.setRGB(0, 0, 0xFFFFFFFF as int)
			image.setRGB(15, 15, 0xFF000000 as int)
			if (!javax.imageio.ImageIO.write(image, "png", destination)) {
				throw new GradleException("Could not create PNG verifier fixture ${destination}")
			}
		}
		def expectRejected = { String caseName, Closure verification ->
			boolean rejected = false
			try {
				verification.call()
			} catch (GradleException expected) {
				rejected = true
			}
			if (!rejected) {
				throw new GradleException(
						"Fabric runtime-gate verifier accepted invalid fixture: ${caseName}")
			}
		}

		def projection = new File(fixtureRoot, "projection")
		writeText(new File(projection, "logs/latest.log"),
				"[projection-capture] result=true, captures complete\n")
		["tangent", "handoff", "up"].each { view ->
			writePng(new File(projection,
					"screenshots/ringworld-projection-${view}.png"))
		}
		verifyFabricProjectionOutputs(projection, "noon")
		def tangent = new File(projection,
				"screenshots/ringworld-projection-tangent.png")
		delete(tangent)
		expectRejected("missing projection screenshot") {
			verifyFabricProjectionOutputs(projection, "noon")
		}
		writeText(tangent, "not a PNG")
		expectRejected("corrupt projection screenshot") {
			verifyFabricProjectionOutputs(projection, "noon")
		}
		writePng(tangent)
		writeText(new File(projection, "logs/latest.log"),
				"[projection-capture] result=true, captures complete\n"
						+ "[projection-capture] result=false, fixture failure\n")
		expectRejected("failed projection log") {
			verifyFabricProjectionOutputs(projection, "noon")
		}
		expectRejected("invalid projection environment") {
			verifyFabricProjectionOutputs(projection, "invalid")
		}

		def visualParity = new File(fixtureRoot, "visual-parity")
		writeText(new File(visualParity, "logs/latest.log"),
				"[visual-parity-capture] seam motion frame metrics: samples=12, averageMs=8.0, maxMs=12.0, over50Ms=0\n"
						+ "[visual-parity-capture] result=true, captures complete\n")
		["seam", "min-rim", "max-rim"].each { view ->
			writePng(new File(visualParity,
					"screenshots/ringworld-visual-parity-${view}.png"))
		}
		verifyFabricVisualParityOutputs(visualParity)
		writeText(new File(visualParity, "logs/latest.log"),
				"[visual-parity-capture] result=true, captures complete\n")
		expectRejected("missing visual-parity seam-motion metrics") {
			verifyFabricVisualParityOutputs(visualParity)
		}
		writeText(new File(visualParity, "logs/latest.log"),
				"[visual-parity-capture] seam motion frame metrics: samples=0, averageMs=0.0, maxMs=0.0, over50Ms=0\n"
						+ "[visual-parity-capture] result=true, captures complete\n")
		expectRejected("zero visual-parity seam-motion samples") {
			verifyFabricVisualParityOutputs(visualParity)
		}

		def layoutSwitch = new File(fixtureRoot, "layout-switch")
		writeText(new File(layoutSwitch, "logs/latest.log"),
				"[layout-switch] expectation=different-layout\n"
						+ "[layout-switch] result-json={\"passed\":true,\"detail\":\"fixture\"}\n")
		["Layout A", "Layout B"].each { destination ->
			writeText(new File(layoutSwitch, "saves/${destination}/level.dat"), "fixture")
		}
		verifyFabricLayoutSwitchOutputs(layoutSwitch, ["Layout A", "Layout B"], "different-layout")
		expectRejected("wrong layout-switch expectation") {
			verifyFabricLayoutSwitchOutputs(layoutSwitch, ["Layout A", "Layout B"],
					"same-geometry-different-seed")
		}
		writeText(new File(layoutSwitch, "logs/latest.log"),
				"[layout-switch] expectation=same-geometry-different-seed\n"
						+ "[layout-switch] result-json={\"passed\":true,\"detail\":\"fixture\"}\n")
		verifyFabricLayoutSwitchOutputs(layoutSwitch, ["Layout A", "Layout B"],
				"same-geometry-different-seed")
		writeText(new File(layoutSwitch, "logs/latest.log"),
				"[layout-switch] expectation=different-layout\n"
						+ "[layout-switch] result-json={\"passed\":true,\"detail\":\"fixture\"}\n"
						+ "[layout-switch] result-json={\"passed\":false,\"detail\":\"failed\"}\n")
		expectRejected("failed layout-switch log") {
			verifyFabricLayoutSwitchOutputs(layoutSwitch, ["Layout A", "Layout B"], "different-layout")
		}
		writeText(new File(layoutSwitch, "logs/latest.log"),
				"[layout-switch] expectation=different-layout\n"
						+ "[layout-switch] result-json={\"passed\":true,\"detail\":\"fixture\"}\n")
		delete(new File(layoutSwitch, "saves/Layout B/level.dat"))
		expectRejected("missing layout-switch output") {
			verifyFabricLayoutSwitchOutputs(layoutSwitch, ["Layout A", "Layout B"], "different-layout")
		}

		def lifecycle = new File(fixtureRoot, "lifecycle")
		writeText(new File(lifecycle, "logs/latest.log"),
				"[production-lifecycle] result=true fixture\n")
		writeText(new File(lifecycle, "saves/Lifecycle/level.dat"), "fixture")
		verifyFabricProductionLifecycleOutputs(lifecycle, "Lifecycle")
		writeText(new File(lifecycle, "logs/latest.log"),
				"[production-lifecycle] result=true fixture\n"
						+ "[production-lifecycle] result=false fixture failure\n")
		expectRejected("failed production-lifecycle log") {
			verifyFabricProductionLifecycleOutputs(lifecycle, "Lifecycle")
		}
		delete(new File(lifecycle, "logs/latest.log"))
		expectRejected("missing production-lifecycle log") {
			verifyFabricProductionLifecycleOutputs(lifecycle, "Lifecycle")
		}

		logger.lifecycle("[fabric-runtime-gates] verifier contract fixtures passed")
	}
}

