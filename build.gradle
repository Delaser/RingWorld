		delete(new File(lifecycle, "logs/latest.log"))
		expectRejected("missing production-lifecycle log") {
			verifyFabricProductionLifecycleOutputs(lifecycle, "Lifecycle")
		}

		logger.lifecycle("[fabric-runtime-gates] verifier contract fixtures passed")
	}
}

