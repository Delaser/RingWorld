		expectRejected("failed layout-switch log") {
			verifyFabricLayoutSwitchOutputs(layoutSwitch, ["Layout A", "Layout B"], "different-layout")
		}
		writeText(new File(layoutSwitch, "logs/latest.log"),
				"[layout-switch] expectation=different-layout\n"
						+ "[layout-switch] result-json={\"passed\":true,\"detail\":\"fixture\"}\n")
		delete(new File(layoutSwitch, "saves/Layout B/level.dat"))
		expectRejected("missing layout-switch output") {
			verifyFabricLayoutSwitchOutputs(layoutSwitch, ["Layout A", "Layout B"], "different-layout")
